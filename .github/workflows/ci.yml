# Quality gates per release (CLAUDE.md): Q1 build+unit, Q2 static analysis+SAST,
# Q3 integration+contract tests, Q4 security review+dependency scan, Q4.5 BCBS 239
# lineage validation (P7). A failed gate blocks merge. Q5 (manual prod approval)
# is evidenced at release time (BACKOFFICE-57 bundle), not on every PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # HARNESS-13 — on-demand full-matrix run. Needed because eleven stories were merged on
  # locally-run gates during the July GitHub Actions billing outage ("Merged on local gates"
  # in docs/backlog.yaml) and nothing has since re-verified that surface in CI on demand.
  # Q1b is the one gate that CANNOT run here — it diffs against a PR merge base, which a
  # manual dispatch does not have. It therefore reports that explicitly rather than skipping
  # silently: a "full matrix" run that quietly omits a gate is precisely the HARNESS-07 bug.
  workflow_dispatch:

# Supersede in-progress runs for the same branch/PR: a new push cancels the stale
# run rather than letting both consume runners (deploy.yml/release-evidence.yml
# already do this). Distinct groups per ref so branches never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  q1-build-unit:
    name: Q1 — build + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - name: Generated artifacts are committed and current
        run: git diff --exit-code packages/contracts/src/*.generated.ts
      - run: pnpm build
      # HARNESS-09: the unit suite runs WITH the coverage gate — vitest.config.ts's 80%
      # thresholds (scoped to services/bff/src) fail the run when breached, so the
      # CLAUDE.md "coverage >=80%" rule is CI-enforced, not a local convention.
      - run: pnpm test:coverage

  q1b-test-integrity:
    name: Q1b — test integrity (anti-reward-hacking)
    runs-on: ubuntu-latest
    # Only meaningful on a PR (needs a merge base to diff against). Skipped on push to main.
    # HARNESS-13: on workflow_dispatch the JOB still runs so the check-run exists and says why
    # it could not check — an omitted gate must never be indistinguishable from a passing one.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so merge-base against the PR target resolves.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Deterministic, no install needed: fails if the diff weakens tests (skip/only/.fails
      # markers, or net assertion loss alongside an implementation change). The control of
      # record behind the local .claude/hooks/test-tripwire.sh advisory tripwire.
      - if: github.event_name == 'pull_request'
        run: node scripts/test-integrity.mjs
      - if: github.event_name != 'pull_request'
        name: Not applicable on a manual dispatch — stated, not silently skipped
        run: |
          echo "::notice title=Q1b NOT RUN::test-integrity diffs the PR against its merge base."
          echo "A workflow_dispatch run has no merge base, so this gate cannot execute here."
          echo "It is NOT a pass. Q1b is enforced on every pull request."
          {
            echo "### Q1b — test integrity: NOT RUN"
            echo ""
            echo "This gate diffs a PR against its merge base. A manual dispatch has no merge"
            echo "base, so it cannot execute. **This is not a pass** — Q1b runs on every PR."
          } >> "$GITHUB_STEP_SUMMARY"

  discovery-gates:
    name: Discovery — D1–D9 gates + waist + harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # The discovery harness is pure-Node and dependency-free — no install step needed.
      # The scripts/ tests cover the merge-blocking harness gates (HARNESS-06 ADR numbering).
      - name: Harness unit tests (gates + renderers)
        run: node --test 'discovery/**/*.test.mjs' 'scripts/test/*.test.mjs'
      # Same independence rule as Q2/Q4 (HARNESS-07): a failing harness unit test must not hide
      # whether the discovery runs and the waist gate are themselves clean. No install guard
      # needed here — this job is dependency-free, so checkout is the only prerequisite.
      - name: Validate every discovery run (D1–D9)
        if: ${{ !cancelled() }}
        run: |
          status=0
          shopt -s nullglob
          for dir in discovery/runs/*/; do
            echo "::group::$dir"
            node discovery/gates/validate.mjs "$dir" || status=1
            echo "::endgroup::"
          done
          exit $status
      # The waist gate (HG-0007): a pending feature backlog item must trace to a green
      # discovery hand-off. Closes the seam between the two diamonds.
      - name: Discovery → delivery waist gate (backlog ↔ hand-off)
        if: ${{ !cancelled() }}
        run: node scripts/discovery-link-check.mjs

  q2-static-sast:
    name: Q2 — static analysis + SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # lint, typecheck and SAST are INDEPENDENT checks that happen to share a runner. Without
      # this guard a lint error skips both of the others, so one run reports one problem and the
      # SAST result is simply absent — indistinguishable, on the checks tab, from having passed.
      # Gated on setup rather than a bare !cancelled(): if the install itself failed there is no
      # node_modules and running the rest would only produce noise. (HARNESS-07)
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: semgrep (SAST)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pipx install semgrep
          semgrep scan --config p/typescript --error --exclude '*.generated.ts'

  q2b-docs-integrity:
    name: Q2b — documentation integrity (anti-drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Deterministic, no install needed: fails if a current-state doc references a file that no
      # longer exists, or if two ADRs share a number. The doc analogue of Q1's generated-artifact
      # diff-check (HARNESS-05, ADR 0020).
      - run: node scripts/doc-link-check.mjs

  # Q2b is intra-tree, so it cannot see a number contended ACROSS branches — two PRs each
  # adding a different 0027 are both green until the second one merges (ADR 0018 and ADR 0027
  # both landed that way). Deliberately its OWN job, not a step on Q2b: a gate that can be
  # skipped by an unrelated earlier failure is a gate you cannot trust to be red when it matters.
  q2c-adr-numbering:
    name: Q2c — ADR number reservation (cross-PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs real history: the check diffs this branch's ADRs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: ADR number reservation
        env:
          # Read-only use: list open PRs and their changed files. Absent/expired token or an
          # unreachable API soft-skips the peer check — a merge gate must not flake on GitHub.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/adr-number-check.mjs
      # Separately guarded, per HARNESS-07: steps share a runner and run sequentially, so a
      # failure above would SKIP this one and a skipped gate looks exactly like a passing gate
      # on the checks tab. Gated on the checkout/setup having succeeded, not a bare
      # !cancelled(), so a failed setup does not run this with no node available.
      # Kept in this job rather than a new one — Q2c already fetches the base ref this check
      # needs, and adding a check-run name strands branch-protection rules pinned to the
      # existing ones.
      - name: ADR amendment record (ADR 0030)
        if: ${{ !cancelled() }}
        run: node scripts/adr-amendment-check.mjs

  q3-integration-contract:
    name: Q3 — integration + contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ofbo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ofbo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:apply
      - run: pnpm db:seed
      - run: pnpm test:integration

  q3-e2e:
    name: Q3 — portal E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ofbo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ofbo
      BFF_URL: http://localhost:8787
      NEBRAS_SIM_URL: http://localhost:8788
      SIM_ADMIN_TOKEN: ci-demo-token-not-a-secret
      DEPLOY_PROFILE: demo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm db:apply
      - run: pnpm db:seed
      - name: install Playwright Chromium
        run: pnpm --filter @ofbo/portal exec playwright install --with-deps chromium
      # The E2E drives the full demo stack: Nebras sim + BFF + a production portal build.
      - name: start Nebras sim + BFF
        run: |
          (cd services/nebras-sim && PORT=8788 ADMIN_TOKEN="$SIM_ADMIN_TOKEN" pnpm exec tsx scripts/serve.ts > /tmp/sim.log 2>&1 &)
          (cd services/bff && PORT=8787 pnpm exec tsx scripts/serve.ts > /tmp/bff.log 2>&1 &)
          # Bounded readiness wait: fail (with the service log) after 90s instead of
          # hanging until the job timeout if a service never comes up.
          wait_for() {
            local name="$1" log="$2"; shift 2
            local deadline=$((SECONDS + 90))
            until "$@" >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$name did not become ready within 90s"
                tail -n 50 "$log" || true
                exit 1
              fi
              sleep 1
            done
            echo "$name ready"
          }
          wait_for "Nebras sim" /tmp/sim.log curl -sf http://localhost:8788/tpp-reports/2026-05
          wait_for "BFF" /tmp/bff.log curl -s -o /dev/null http://localhost:8787/
      - name: build + start portal
        run: |
          pnpm --filter @ofbo/portal build
          (cd apps/portal && PORT=3000 pnpm start > /tmp/portal.log 2>&1 &)
          deadline=$((SECONDS + 90))
          until curl -sf http://localhost:3000 >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::portal did not become ready within 90s"
              tail -n 50 /tmp/portal.log || true
              exit 1
            fi
            sleep 1
          done
          echo "portal ready"
      - run: pnpm --filter @ofbo/portal e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/portal/playwright-report
          retention-days: 7

  q4-security-deps:
    name: Q4 — security review + dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      # Dependency scan blocks on high/critical in SHIPPED (production) deps.
      # Dev/build-tooling advisories are tracked separately, not a merge blocker.
      - name: dependency scan (production deps)
        run: pnpm audit --prod --audit-level=high
      # The secrets scan is independent of the dependency scan — a vulnerable transitive dep
      # says nothing about whether a credential was committed. Before this guard, the audit
      # failing skipped the secrets scan entirely: that is exactly how it went unrun on main
      # from 22-26 Jul while the audit was red, with no red secrets check to show for it.
      # A skipped security scan must never be mistakable for a passing one. (HARNESS-07)
      - name: secrets scan (security review)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pipx install semgrep
          semgrep scan --config p/secrets --error --exclude '*.generated.ts'

  q45-lineage:
    name: Q4.5 — BCBS 239 lineage validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ofbo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ofbo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:apply
      - run: pnpm db:seed
      # Exercise the real write-path emitters so lineage exists for the tables
      # that emit at write time (audit, risk_signal, approval_request, …).
      - run: pnpm test:integration
      # Gate: every table with rows must emit lineage, save documented gaps.
      - run: pnpm --filter @ofbo/db lineage:gate
