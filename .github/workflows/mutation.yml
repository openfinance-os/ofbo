# HARNESS-04 — mutation testing of the security-critical BFF core (rbac / auth / four-eyes /
# high-class audit / Idempotency-Key window).
# Q1b proves tests aren't WEAKENED; this proves they aren't HOLLOW — a surviving mutant is a
# behaviour change no test caught. Deliberately NOT a universal per-PR gate: a full run cost
# ~8 min when this was written and is ~25 min as of Aug 2026 — right against the timeout-minutes
# ceiling below, so it would badly tax every unrelated PR. (That 3x growth is unexplained and
# worth its own investigation: a job pinned to its own timeout is also the job most likely to
# start failing spuriously.) Instead it runs on a schedule, on demand, and on PRs that actually
# touch the security core. `break` (stryker.config.json) sits below the
# measured baseline so a real regression fails without flaking on the mutation-score noise floor.
name: mutation

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:17 UTC (off-peak, off-minute so the fleet doesn't stampede the runner pool).
    - cron: '17 3 * * 1'
  # HARNESS-18 — `synchronize` is DELIBERATELY ABSENT. The default types are
  # (opened, synchronize, reopened), so dropping one means listing the others explicitly.
  #
  # WHY: a `paths:` filter on `pull_request` is evaluated against the WHOLE PR DIFF, not
  # against the commits just pushed. So the moment a branch touched auth.ts once, every later
  # push re-ran this 25-minute job — including pushes that touched only docs. Measured 18-19
  # Aug 2026: 30 mutation runs in two days, 59% of every run this workflow has had since it
  # was created on 24 Jun, because both live branches touch auth.ts + approvals/service.ts.
  # 15 of those 30 were CANCELLED by the concurrency group below after burning 10-14 minutes
  # each — 215 runner-minutes in two days that produced no mutation score at all. Only 6 of
  # the 30 ran to completion.
  #
  # WHAT IS PRESERVED: a security-core PR is still mutation-tested when it is OPENED (drafts
  # included — the build agent opens drafts, and `opened` fires for them) and again when it is
  # marked READY FOR REVIEW, i.e. against the state a human is actually asked to merge. What
  # is dropped is the ~20 intermediate re-runs per PR that re-proved the same thing at 25
  # minutes a time. This is a cost change, not a coverage change: the gate still sees every
  # security-core PR, and `break` (stryker.config.json) is untouched.
  #
  # ESCAPE HATCH: `workflow_dispatch` above accepts any ref, so this can be re-run against a
  # feature branch on demand. Deliberately NOT a label trigger — dispatch already covers it.
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - 'services/bff/src/rbac.ts'
      - 'services/bff/src/auth.ts'
      - 'services/bff/src/approvals/**'
      - 'services/bff/src/high-class-audit.ts'
      - 'services/bff/src/idempotency.ts'
      - 'stryker.config.json'
      - 'vitest.mutation.config.ts'
      - '.github/workflows/mutation.yml'

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing — security core (rbac/auth/four-eyes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails (exit 1) if the mutation score drops below the calibrated break threshold.
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14
