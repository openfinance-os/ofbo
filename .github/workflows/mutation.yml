# HARNESS-04 — mutation testing of the security-critical BFF core (rbac / auth / four-eyes /
# high-class audit / Idempotency-Key window).
# Q1b proves tests aren't WEAKENED; this proves they aren't HOLLOW — a surviving mutant is a
# behaviour change no test caught. Deliberately NOT a universal per-PR gate: a full run cost
# ~8 min when this was written and is ~25 min as of Aug 2026 — right against the timeout-minutes
# ceiling below, so it would badly tax every unrelated PR. (That 3x growth is unexplained and
# worth its own investigation: a job pinned to its own timeout is also the job most likely to
# start failing spuriously.) Instead it runs on a schedule, on demand, and on PRs that actually
# touch the security core. `break` (stryker.config.json) sits below the
# measured baseline so a real regression fails without flaking on the mutation-score noise floor.
name: mutation

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:17 UTC (off-peak, off-minute so the fleet doesn't stampede the runner pool).
    - cron: '17 3 * * 1'
  # HARNESS-19 — `synchronize` is BACK, and cost is controlled by the `changes` job below
  # instead of by trigger breadth. This CORRECTS HARNESS-18, which removed `synchronize` and in
  # doing so opened a real coverage hole. The hole, found by the hard-stop reviewer on PR #329:
  #
  #   1. PR opened NON-DRAFT, diff touches no security-core path → `opened` fires, `paths:`
  #      does not match, no run. Correct.
  #   2. A later push adds `approvals/service.ts` or `high-class-audit.ts` → under HARNESS-18
  #      `synchronize` was gone, so NOTHING fired.
  #   3. `ready_for_review` cannot fire — the PR was never a draft.
  #   4. The PR merged with its four-eyes / high-class-audit changes mutation-tested ZERO times,
  #      caught only by the weekly schedule, on the Monday AFTER it was already on main.
  #
  # The whole-diff `paths:` semantics that caused HARNESS-18's cost problem were also what made
  # that case safe. Removing `synchronize` removed the cost and the safety together, and the
  # header then claimed "a cost change, not a coverage change", which was false.
  #
  # THE FIX SEPARATES TWO QUESTIONS, because they are different questions:
  #   `paths:` (below)  — "is this BRANCH relevant to the security core at all?" Evaluated by
  #                       GitHub against the cumulative PR diff. A branch that never touches the
  #                       security core starts nothing and costs literally zero.
  #   `changes` (job)   — "did THIS PUSH touch it?" Evaluated against the pushed range
  #                       (`before`..`after`), which is what `paths:` cannot express.
  #
  # So a docs-only push to a branch that touched auth.ts last week starts a ~1-minute classifier
  # and stops. A push that actually edits auth.ts runs the full ~25-minute gate. Against the
  # 18-19 Aug window that motivated HARNESS-18: 30 runs × ~25 min becomes ~30 × ~1 min plus the
  # handful that genuinely touched the security core — and case 2 above now runs the gate.
  #
  # THE CLASSIFIER FAILS OPEN, deliberately: if it cannot resolve the pushed range (force-push,
  # shallow history, a missing `before`), it RUNS the gate rather than guessing. A cost control
  # that skips a security gate on uncertainty is not a cost control, it is a hole.
  #
  # ESCAPE HATCH: `workflow_dispatch` above accepts any ref. Deliberately NOT a label trigger.
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'services/bff/src/rbac.ts'
      - 'services/bff/src/auth.ts'
      - 'services/bff/src/approvals/**'
      - 'services/bff/src/high-class-audit.ts'
      - 'services/bff/src/idempotency.ts'
      - 'stryker.config.json'
      - 'vitest.mutation.config.ts'
      - '.github/workflows/mutation.yml'

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================================
  # HARNESS-19. Decides whether the ~25-minute gate below needs to run for THIS event.
  # Always runs, always reports — a gate that does not run must say so and say why, never
  # be silently absent (HARNESS-07 doctrine, and the q1b "NOT RUN" handling in ci.yml).
  #
  # FAILS OPEN. Every path that cannot positively establish "this push did not touch the
  # security core" sets run=true. Uncertainty runs the gate.
  # =====================================================================================
  changes:
    name: Did this push touch the security core?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the pushed range's base may be many commits back.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Dependency-free pure Node, like the discovery gates — no install step needed. The
      # decision lives in scripts/mutation-scope-check.mjs so it is unit-testable in
      # isolation; scripts/test/mutation-scope-check.test.mjs exercises every branch,
      # including the three that FAIL OPEN.
      - id: decide
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: node scripts/mutation-scope-check.mjs

  mutation:
    name: Mutation testing — security core (rbac/auth/four-eyes)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails (exit 1) if the mutation score drops below the calibrated break threshold.
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14
