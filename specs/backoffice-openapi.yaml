        last_period: { type: string, nullable: true, description: Reporting period of the most recent ingest }
        last_report_id: { type: string, format: uuid, nullable: true, description: compliance_report record of the most recent ingest }
        next_due_at: { type: string, format: date-time, description: When the next ingest is due per cadence }
        overdue: { type: boolean, description: True when now > next_due_at; drives the missed-cadence ITSM ticket + Risk signal }
    ApprovalRequest:
      type: object
      properties:
        approval_request_id: { type: string, format: uuid }
        operation_type: { type: string }
        state: { type: string, enum: [pending, approved, rejected, timed_out] }
        initiator: { type: string }
        approver_required_scope: { type: string }
