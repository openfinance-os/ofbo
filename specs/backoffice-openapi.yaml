      x-required-scope: platform:operations:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - { name: case_type, in: query, schema: { $ref: '#/components/schemas/ServiceDeskCaseType' } }
