# Open Finance Back Office — OpenAPI delta (PRD §7, v1.0 build baseline)
# Extends the platform contract (the platform core API contract). Conventions per CLAUDE.md:
# kebab-case paths, snake_case JSON, cursor pagination, standard error envelope,
# Idempotency-Key on mutating endpoints, x-fapi-interaction-id on every request.
# Rate limits (Kong-enforced per token) are declared via x-rate-limit-per-min.
# nebras_propagation_ms carries its NFR-18 bound in x-nfr18-exclusive-max-ms as well as in prose, so a
# test can bind the contract's number to the constant the services compare against (BACKOFFICE-91).
# INTEGRATORS: do not depend on receiving that extension. Many generators drop x- keys (typescript
# clients generated with openapi-typescript do), though some expose them — read the bound from the
# field's description, which every generator carries. The extension is an in-repo regression guard,
# not a machine-readable surface this contract promises consumers.
# Whether regulatory thresholds generally should be machine-readable is a cross-cutting question, and
# this header does not settle it: it is raised in ADR 0034, which is Proposed and awaits a human.
openapi: 3.0.3
info:
  title: Open Finance Back Office API (delta)
  version: 1.0.0
  description: >
    Admin-scoped endpoint families for the Open Finance Back Office (PRD v1.0 §7).
    All endpoints require an admin scope from PRD §3.5.1; scopes are enforced
    at Kong AND repeated at service layer (defence-in-depth, NFR-08).
    Four-eyes-gated operations return 202 with an approval_request and execute
    only after a second authorised principal approves (initiator != approver).

servers:
  - url: https://api.bank.example/v1

security:
  - adminOAuth: []

tags:
  - name: reconciliation
  - name: consents-admin
  - name: disputes
  - name: analytics
  - name: reports
  - name: approvals
  - name: audit
  - name: risk-signals
  - name: tpp-billing
  - name: governance
  - name: agents
  - name: readiness

paths:
  # ---------- 7.1 Reconciliation ----------
  /back-office/reconciliation/runs:
    get:
      tags: [reconciliation]
      summary: List reconciliation runs (paginated)
      x-rate-limit-per-min: 200
      x-required-scope: reconciliation:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: run_type
          in: query
          schema: { type: string, enum: [daily, monthly_close, replay, on_demand] }
        - name: status
          in: query
          schema: { type: string, enum: [running, completed, failed, partial] }
      responses:
        '200':
          description: Paginated run list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReconciliationRun' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/runs/{run_id}:
    get:
      tags: [reconciliation]
      summary: Get run summary with line counts
      x-rate-limit-per-min: 500
      x-required-scope: reconciliation:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ReconciliationRun' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/runs:replay:
    post:
      tags: [reconciliation]
      summary: Trigger replay over a date range (BACKOFFICE-10)
      x-rate-limit-per-min: 5
      x-required-scope: platform:operations:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [window_start, window_end]
              properties:
                window_start: { type: string, format: date-time }
                window_end: { type: string, format: date-time }
      responses:
        '202': { $ref: '#/components/responses/ReconciliationRun' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/breaks:
    get:
      tags: [reconciliation]
      summary: List breaks (filter by run_id, status, line_type, client_id)
      x-rate-limit-per-min: 200
      x-required-scope: reconciliation:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - { name: run_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BreakStatus' } }
        - { name: line_type, in: query, schema: { $ref: '#/components/schemas/LineType' } }
        - { name: client_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paginated break list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReconciliationBreak' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/breaks/{break_id}:
    get:
      tags: [reconciliation]
      summary: Get break detail with three-source diff (BACKOFFICE-11)
      x-rate-limit-per-min: 500
      x-required-scope: reconciliation:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/breakId'
      responses:
        '200': { $ref: '#/components/responses/ReconciliationBreak' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/breaks/{break_id}/claim:
    post:
      tags: [reconciliation]
      summary: Claim a flagged break (BACKOFFICE-03)
      x-rate-limit-per-min: 60
      x-required-scope: finance:reconciliation:write
      description: Consent-record breaks may alternatively be claimed with platform:operations:write.
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/breakId'
      responses:
        '200': { $ref: '#/components/responses/ReconciliationBreak' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/breaks/{break_id}/resolve:
    post:
      tags: [reconciliation]
      summary: Resolve with outcome + mandatory note (BACKOFFICE-04)
      x-rate-limit-per-min: 60
      x-required-scope: finance:reconciliation:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/breakId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_outcome, resolution_note]
              properties:
                resolution_outcome:
                  type: string
                  enum: [resolved_matched, resolved_internal_correction, escalated_fintech_billing]
                resolution_note:
                  type: string
                  minLength: 20
      responses:
        '200': { $ref: '#/components/responses/ReconciliationBreak' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/breaks/{break_id}/escalate-nebras:
    post:
      tags: [reconciliation]
      summary: Open a Nebras dispute case from a break (BACKOFFICE-05)
      x-rate-limit-per-min: 30
      x-required-scope: finance:disputes:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/breakId'
      responses:
        '200':
          description: Break escalated; Nebras case ID persisted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          break_id: { type: string, format: uuid }
                          status: { type: string, enum: [escalated_nebras_dispute] }
                          nebras_dispute_case_id: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/breaks/{break_id}/reopen:
    post:
      tags: [reconciliation]
      summary: Reopen a resolved break (four-eyes; BACKOFFICE-04)
      x-rate-limit-per-min: 10
      x-required-scope: audit:read
      x-four-eyes: true
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/breakId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justification]
              properties:
                justification: { type: string, minLength: 20 }
      responses:
        '202': { $ref: '#/components/responses/ApprovalPending' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/monthly-signoff:
    post:
      tags: [reconciliation]
      summary: Request the monthly reconciliation sign-off (four-eyes; BACKOFFICE-06)
      description: >
        Locking + signing a month's reconciliation summary is a high-stakes regulated
        action (a 5-year-immutable compliance_report with the Finance Analyst's attested
        sign-off), so it is four-eyes-gated: the initiator requests, a different
        finance:reconciliation:write principal approves, and only then is the report
        generated + locked. Returns 202 + approval_request; never executes inline (the
        binding four-eyes hard-stop). The locked Report is produced on approval.
      x-rate-limit-per-min: 5
      x-required-scope: finance:reconciliation:write
      x-four-eyes: true
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: "2026-07", description: Calendar month YYYY-MM }
      responses:
        '202': { $ref: '#/components/responses/ApprovalPending' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/thresholds:
    get:
      tags: [reconciliation]
      summary: Read break thresholds by fee class (BACKOFFICE-12)
      x-rate-limit-per-min: 100
      x-required-scope: reconciliation:read
      parameters: [ { $ref: '#/components/parameters/fapiInteractionId' } ]
      responses:
        '200': { $ref: '#/components/responses/Thresholds' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [reconciliation]
      summary: Update break thresholds (High-class audited)
      x-rate-limit-per-min: 10
      x-required-scope: platform:operations:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Threshold' }
      responses:
        '200': { $ref: '#/components/responses/Thresholds' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reconciliation/exports:cbuae:
    get:
      tags: [reconciliation]
      summary: Generate CBUAE-format reconciliation export (BACKOFFICE-08)
      x-rate-limit-per-min: 5
      x-required-scope: compliance:reports:generate
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - { name: period_start, in: query, required: true, schema: { type: string, format: date } }
        - { name: period_end, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '202': { $ref: '#/components/responses/Report' }
        default: { $ref: '#/components/responses/Error' }

  # ---------- 7.2 Consent & dispute (Customer Care) ----------
  /care-surface:mint-token:
    post:
      tags: [consents-admin]
      summary: Mint a short-lived care-surface token (BACKOFFICE-25)
      description: >
        Console-originated API calls act on a PSU's behalf carrying agent identity
        (act) and PSU subject (sub). This mints a short-lived (<= 15 min),
        request-scoped care token via the Platform Auth Service (P1 CareSurfacePort).
        The agent (act) is taken from the authenticated caller — never the body — so it
        cannot be spoofed; sub is the resolved PSU. Every mint writes a High-class audit
        record (act + sub, PII redacted). Mutating: Idempotency-Key required — a replay
        within the 24h window returns the original token (no duplicate issue or audit);
        normal use sends a fresh key per request, yielding a fresh <= 15 min token.
      x-rate-limit-per-min: 120
      x-required-scope: consents:admin
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier_type, psu_identifier]
              properties:
                identifier_type:
                  type: string
                  enum: [bank_customer_id, iban, emirates_id]
                psu_identifier:
                  type: string
                  description: PSU identifier; sent only to the BFF, redacted at audit emission.
      responses:
        '200':
          description: A short-lived care-surface token with act/sub claims.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CareToken' }
        default: { $ref: '#/components/responses/Error' }

  /consents:search-psu:
    get:
      tags: [consents-admin]
      summary: PSU-centric consent search (BACKOFFICE-16)
      description: >
        Unified search with identifier_type (BO-OQ-28 default). Every call writes a
        High-class audit record with the searching agent's identity. < 500 ms p95.
      x-rate-limit-per-min: 200
      x-required-scope: consents:admin
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - name: identifier_type
          in: query
          required: true
          schema: { type: string, enum: [bank_customer_id, iban, emirates_id] }
        - { name: identifier, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: PSU + consents across all TPPs (24 months)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PsuConsentSearchResult' }
        default: { $ref: '#/components/responses/Error' }

  /consents/{consent_id}:admin:
    get:
      tags: [consents-admin]
      summary: Admin view of a consent with cross-TPP context
      x-rate-limit-per-min: 500
      x-required-scope: consents:admin            # or audit:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/consentId'
      responses:
        '200':
          description: Consent admin view (full 7-state lifecycle status)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConsentAdminView' }
        default: { $ref: '#/components/responses/Error' }

  /consents/{consent_id}:revoke-admin:
    post:
      tags: [consents-admin]
      summary: Single-consent revocation with reason code (BACKOFFICE-17)
      x-rate-limit-per-min: 60
      x-required-scope: consents:admin
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/consentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code:
                  type: string
                  enum: [TPP_REQUEST, CLIENT_INSTRUCTION, REGULATORY]
                  description: FRAUD_SUSPECTED is reserved for :revoke-fraud
      responses:
        '200': { $ref: '#/components/responses/RevocationResult' }
        default: { $ref: '#/components/responses/Error' }

  /consents:revoke-bulk:
    post:
      tags: [consents-admin]
      summary: Emergency PSU-wide bulk revocation (four-eyes; BACKOFFICE-18)
      x-rate-limit-per-min: 5
      x-required-scope: consents:admin
      x-four-eyes: true
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [psu_identifier_type, psu_identifier, reason_code]
              properties:
                psu_identifier_type: { type: string, enum: [bank_customer_id, iban, emirates_id] }
                psu_identifier: { type: string }
                reason_code: { type: string, enum: [CLIENT_INSTRUCTION] }
      responses:
        '202': { $ref: '#/components/responses/ApprovalPending' }
        default: { $ref: '#/components/responses/Error' }

  /consents/{consent_id}:revoke-fraud:
    post:
      tags: [consents-admin]
      summary: Risk Analyst narrow-scope fraud revocation (BACKOFFICE-22)
      description: >
        Four-eyes-gated (binding adopting-bank default, PRD §10 / CLAUDE.md: four-eyes
        on fraud revoke). Returns 202 + approval_request; a different principal approves
        before the revoke executes — it never executes inline.
      x-rate-limit-per-min: 30
      x-required-scope: consents:admin:fraud-revoke
      x-four-eyes: true
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/consentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_context]
              properties:
                case_context: { type: string, description: Investigation context carried into the STR draft }
      responses:
        '202': { $ref: '#/components/responses/ApprovalPending' }
        default: { $ref: '#/components/responses/Error' }

  /consents/{consent_id}/audit-trail:
    get:
      tags: [audit]
      summary: 24-month audit trail for a consent (BACKOFFICE-19)
      x-rate-limit-per-min: 200
      x-required-scope: audit:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/consentId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': { $ref: '#/components/responses/ConsentEventList' }
        default: { $ref: '#/components/responses/Error' }

  /psu/{psu_identifier}/audit-trail:
    get:
      tags: [audit]
      summary: 24-month PSU-centric audit trail across all consents (BACKOFFICE-19)
      x-rate-limit-per-min: 100
      x-required-scope: audit:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - { name: psu_identifier, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': { $ref: '#/components/responses/ConsentEventList' }
        default: { $ref: '#/components/responses/Error' }

  /payments/{payment_id}:admin:
    get:
      tags: [disputes]
      summary: Admin payment view with consent-validity-at-time-of-payment (BACKOFFICE-20; Phase 0 reuse)
      x-rate-limit-per-min: 500
      x-required-scope: disputes:admin
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - { name: payment_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Payment trace + Risk Information Block + CoP outcome
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaymentAdminView' }
        default: { $ref: '#/components/responses/Error' }

  /disputes:
    post:
      tags: [disputes]
      summary: Create unauthorised-payment dispute (BACKOFFICE-20)
      x-rate-limit-per-min: 60
      x-required-scope: disputes:admin
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeCreate' }
      responses:
        '201': { $ref: '#/components/responses/Dispute' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [disputes]
      summary: List disputes (filter by state, psu, client_id)
      x-rate-limit-per-min: 200
      x-required-scope: disputes:admin             # or audit:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DisputeState' } }
        - { name: psu_identifier, in: query, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paginated dispute list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DisputeCase' }
        default: { $ref: '#/components/responses/Error' }

  /disputes/{dispute_id}:
    patch:
      tags: [disputes]
      summary: Update dispute state (per §6.3.1 state machine)
      x-rate-limit-per-min: 100
      x-required-scope: disputes:admin
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/disputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { $ref: '#/components/schemas/DisputeState' }
                escalated_to: { type: string }
                resolution_note: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Dispute' }
        default: { $ref: '#/components/responses/Error' }

  /disputes/{dispute_id}/call-recording:
    get:
      tags: [disputes]
      summary: Resolve the originating call recording for a dispute (BACKOFFICE-64)
      description: >
        Resolves the dispute's originating_call_id to a short-lived link to the
        contact-centre recording via the P1 CareSurfacePort (the bank's existing
        integration). The Back Office links, never copies — recording content stays in
        the bank's system. Every access writes a High-class call_recording_accessed
        audit. Returns 404 when the dispute has no call linkage (non-voice channels) or
        the recording is unavailable. Same RBAC posture as the dispute (disputes:admin).
      x-rate-limit-per-min: 100
      x-required-scope: disputes:admin
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/disputeId'
      responses:
        '200':
          description: A short-lived link to the originating call recording.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CallRecording' }
        default: { $ref: '#/components/responses/Error' }

  /disputes/{dispute_id}:initiate-refund:
    post:
      tags: [disputes]
      summary: Initiate refund under the next-business-day SLA (four-eyes; BACKOFFICE-21/-62)
      description: >
        On approval, the refund dispatches via the existing Ozone Connect
        GET /payment-consents/{consentId}/refund flow through the enterprise egress gateway
        (Phase 0 reuse) and is tracked with the 5 IPP status codes.
      x-rate-limit-per-min: 30
      x-required-scope: disputes:admin
      x-four-eyes: true
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/disputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refund_amount]
              properties:
                refund_amount: { $ref: '#/components/schemas/Money' }
      responses:
        '202': { $ref: '#/components/responses/ApprovalPending' }
        default: { $ref: '#/components/responses/Error' }

  # ---------- 7.2a Respondent-side Nebras dispute scheme clocks (BACKOFFICE-75) ----------
  # Distinct from the Customer-Care /disputes surface (bank/PSU as initiator) and from
  # the break escalate-nebras flow (bank initiating a Nebras case). Here Nebras raises a
  # dispute and the BANK IS THE RESPONDENT, bound to scheme clocks (Interaction Guide v4
  # defaults, BD-16: response 3 bd, formal resolution 15 bd, appeal 3 bd of verdict,
  # implementation 3 bd of final verdict). Owned by Finance (finance:disputes:write); the
  # amber/red breach risk is surfaced to Compliance via the Compliance View (BACKOFFICE-29).
  /back-office/disputes/respondent:
    post:
      tags: [disputes]
      summary: Register a Nebras-raised dispute where the bank is the respondent (BACKOFFICE-75)
      description: >
        Ingests a dispute Nebras has raised against the bank. The response (3 bd) and
        formal-resolution (15 bd) clocks start from raised_at on registration; appeal and
        implementation clocks start when the respective verdicts are recorded via :advance.
      x-rate-limit-per-min: 60
      x-required-scope: finance:disputes:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondentDisputeCreate' }
      responses:
        '201':
          description: Respondent dispute registered; response + resolution clocks started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RespondentDispute' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [disputes]
      summary: List respondent disputes (filter by state / breach status)
      x-rate-limit-per-min: 200
      x-required-scope: finance:disputes:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/RespondentDisputeState' }
        - name: breach_status
          in: query
          schema: { $ref: '#/components/schemas/SchemeClockStatus' }
          description: Filter to clocks at risk (amber) or breached (red)
      responses:
        '200':
          description: Paginated respondent-dispute list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RespondentDispute' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/disputes/respondent/{respondent_dispute_id}:
    get:
      tags: [disputes]
      summary: Respondent dispute detail — scheme clocks + per-clock breach status
      x-rate-limit-per-min: 200
      x-required-scope: finance:disputes:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/respondentDisputeId'
      responses:
        '200':
          description: Respondent dispute detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RespondentDispute' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/disputes/respondent/{respondent_dispute_id}:advance:
    post:
      tags: [disputes]
      summary: Record a respondent-side lifecycle action that stops / starts a scheme clock
      description: >
        respond → stops the response clock (state responded). record_verdict → resolution met,
        starts the appeal clock (3 bd). appeal → records the bank's appeal. record_final_verdict
        → starts the implementation clock (3 bd). implement → stops implementation (state implemented).
        Each action requires a note (≥20 chars) and writes an immutable High-class audit record.
      x-rate-limit-per-min: 60
      x-required-scope: finance:disputes:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/respondentDisputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, note]
              properties:
                action: { type: string, enum: [respond, record_verdict, appeal, record_final_verdict, implement] }
                note: { type: string, minLength: 20, description: Mandatory action note (immutable audit) }
                verdict_outcome: { type: string, nullable: true, enum: [upheld, partially_upheld, rejected], description: Required for record_verdict / record_final_verdict }
      responses:
        '200':
          description: Action recorded; affected clock updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RespondentDispute' }
        default: { $ref: '#/components/responses/Error' }

