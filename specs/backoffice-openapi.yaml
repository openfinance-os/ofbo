  /back-office/agents:register:
    post:
      tags: [agents]
      summary: Register an automation agent identity (DCR) — four-eyes (BACKOFFICE-60)
      description: >
        Programmatic admin-scope access (ADR 0017). Registers an automation under a
        pre-defined least-privilege agent persona whose scopes are a STRICT SUBSET of a
        human persona (PRD §2) and never platform:superadmin (BACKOFFICE-80 — agents are
        service accounts). The caller NAMES A PERSONA; the server binds that persona's
        scopes — the request can never request arbitrary scopes, so DCR is not a scope-
        escalation path. Granting agent authority is four-eyes-gated: returns 202 +
        approval_request; a different principal approves before the client credential is
        issued — it never registers inline. Issued read-only (allow_mutations=false,
        spend_budget=0) until a human raises both AND spend-control (BACKOFFICE-53) is live.
      x-rate-limit-per-min: 5
      x-required-scope: platform:agents:write
      x-four-eyes: true
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persona, display_name]
              properties:
                persona:
                  type: string
                  description: Agent persona id from the AGENT_PERSONAS catalogue (e.g. care-readonly-agent). Its scopes are bound server-side.
                display_name: { type: string, minLength: 3, description: Human-readable label for the automation (no PII) }
      responses:
        '202': { $ref: '#/components/responses/ApprovalPending' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/agents:
    get:
      tags: [agents]
      summary: List registered automation agents (BACKOFFICE-60)
      x-rate-limit-per-min: 60
      x-required-scope: platform:agents:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': { $ref: '#/components/responses/Agents' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/agents/{agent_id}:
    get:
      tags: [agents]
      summary: Get a registered automation agent (BACKOFFICE-60)
      x-rate-limit-per-min: 60
      x-required-scope: platform:agents:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/agentId'
      responses:
        '200': { $ref: '#/components/responses/Agent' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/agents/{agent_id}:revoke:
    post:
      tags: [agents]
      summary: Revoke (deactivate) an automation agent — single-actor kill switch (BACKOFFICE-60)
      description: >
        Deactivates an agent credential immediately. Deliberately NOT four-eyes: granting
        authority needs two principals, REMOVING it needs one — so a rogue or compromised
        agent can be killed without waiting for a second approver. High-class audited.
      x-rate-limit-per-min: 30
      x-required-scope: platform:agents:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/agentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, description: Why the agent is being deactivated (no PII) }
      responses:
        '200': { $ref: '#/components/responses/Agent' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/agents/{agent_id}:mint-session:
    post:
      tags: [agents]
      summary: Mint a short-lived agent session token (ADR 0018 — BACKOFFICE-53/-60)
      description: >
        Generalises the ADR 0001 act/sub minting into an agent SESSION token
        (token-exchange, RFC 8693). Issued ONLY for an `active` registration: returns a
        short-lived, server-verifiable token whose act = agent_id, scopes = the
        registration's bound scopes (a strict subset of a human persona; never
        platform:superadmin), plus a session_id + spend_budget. The MCP gateway presents
        this token as its bearer; the BFF verifies it (it minted it), re-asserts
        per-(agent_id, session_id) spend-control BFF-side — closing BACKOFFICE-53's
        defence-in-depth criterion (the gateway guard is never the sole layer) — and stamps
        the High-class audit with acting_principal = agent_id. NOT four-eyes: registration
        already was, and this grants no authority beyond the bound scopes; revoking the
        agent (single-actor kill switch) denylists the session before its TTL. Mutating:
        Idempotency-Key required — a replay within the 24h window returns the original
        session token (no duplicate session); a fresh key yields a fresh session.
      x-rate-limit-per-min: 60
      x-required-scope: platform:agents:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/agentId'
      responses:
        '200':
          description: A short-lived agent session token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AgentSessionToken' }
        default: { $ref: '#/components/responses/Error' }

