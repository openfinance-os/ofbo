  # ---------- 7.4 Reports & compliance ----------
  /back-office/reports:generate:
    post:
      tags: [reports]
      summary: Initiate periodic or ad-hoc report generation (BACKOFFICE-35)
      description: CBUAE-bound reports require Programme Manager four-eyes approval before submission.
      x-rate-limit-per-min: 10
      x-required-scope: compliance:reports:generate
      x-four-eyes: when CBUAE-bound
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_type, period_start, period_end]
              properties:
                report_type: { type: string, example: cbuae_monthly }
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
                target_psu_identifier: { type: string }
                target_client_id: { type: string, format: uuid }
                output_formats:
                  type: array
                  items: { type: string, enum: [pdf, xlsx] }
                  default: [pdf, xlsx]
      responses:
        '202': { $ref: '#/components/responses/Report' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reports:
    get:
      tags: [reports]
      summary: List reports (filter by type, period, state)
      x-rate-limit-per-min: 100
      x-required-scope: compliance:reports:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - { name: report_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReportStatus' } }
      responses:
        '200':
          description: Paginated report list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ComplianceReport' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reports/{report_id}:
    get:
      tags: [reports]
      summary: Get report metadata
      x-rate-limit-per-min: 500
      x-required-scope: compliance:reports:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/reportId'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reports/{report_id}/download:
    get:
      tags: [reports]
      summary: Download report PDF / XLSX with integrity hash
      x-rate-limit-per-min: 30
      x-required-scope: compliance:reports:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/reportId'
        - { name: format, in: query, required: true, schema: { type: string, enum: [pdf, xlsx] } }
      responses:
        '200':
          description: Binary stream; X-Content-SHA256 header carries the integrity hash
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reports/{report_id}:approve:
    post:
      tags: [reports]
      summary: Programme Manager approval for a CBUAE-bound report (four-eyes resolution)
      description: >
        This IS the four-eyes resolution step — the second principal authorising a
        CBUAE-bound report that was gated on generation. It executes the approval and
        returns 200 with the approved report; it is NOT itself a four-eyes-gated
        operation (which would regress), so it carries no x-four-eyes flag. The
        initiator ≠ approver rule is enforced by the approvals service.
      x-rate-limit-per-min: 10
      x-required-scope: programme:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/reportId'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/reports/{report_id}:submit:
    post:
      tags: [reports]
      summary: Mark report submitted to CBUAE (BO-OQ-29 default — status change after manual upload)
      x-rate-limit-per-min: 5
      x-required-scope: compliance:reports:generate
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - $ref: '#/components/parameters/reportId'
      responses:
        '200': { $ref: '#/components/responses/Report' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/str-drafts:
    get:
      tags: [reports]
      summary: List Suspicious Transaction Report (STR) drafts (BACKOFFICE-63)
      description: >
        STR drafts are auto-created when a fraud-suspected revocation is approved
        (BACKOFFICE-22) and held by the Back Office. Compliance reviews them before they are
        handed to the bank's STR workflow. No PII — a draft carries an internal consent ref +
        case context, never PSU identifiers.
      x-rate-limit-per-min: 100
      x-required-scope: compliance:reports:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - { name: status, in: query, schema: { type: string, enum: [draft, awaiting_handoff, handed_off] } }
      responses:
        '200':
          description: Paginated STR drafts (cursor in meta.next_cursor).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/StrDraft' } }
        default: { $ref: '#/components/responses/Error' }

  /back-office/str-drafts/{str_draft_id}:
    get:
      tags: [reports]
      summary: Get an STR draft (BACKOFFICE-63)
      x-rate-limit-per-min: 100
      x-required-scope: compliance:reports:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - { name: str_draft_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: A single STR draft.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StrDraft' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/str-drafts/{str_draft_id}:submit-to-workflow:
    post:
      tags: [reports]
      summary: Hand an approved STR draft to the bank's STR workflow — four-eyes (BACKOFFICE-63)
      description: >
        Submits an STR draft to the bank's existing STR workflow (P10), which is the system of
        record that files with the CBUAE AML GO portal. The Back Office NEVER submits to AML GO
        directly — it only hands off. Four-eyes-gated: a Compliance officer
        (compliance:reports:generate) initiates → 202 + approval_request; a Risk second-line
        (risk:read, the persona that owns STR triggers) approves via the approvals path. Only on
        that approval does the handoff to P10 run, recording the workflow reference. High-class
        audited; no PII.
      x-rate-limit-per-min: 10
      x-required-scope: compliance:reports:generate
      x-four-eyes: true
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - { name: str_draft_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { $ref: '#/components/responses/ApprovalPending' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/lfi-reports:
    get:
      tags: [reports]
      summary: Cadence health of the 16 login-only Nebras LFI reports (BACKOFFICE-67)
      description: >
        The 16 Nebras LFI Reports (availability, performance, billing, consent,
        payments, CoP et al. per API Hub Docs v8) are login-only with no API equivalent
        (PRD §3 known scheme limitation). This returns, per report type, the latest
        verified manual ingest and whether it is overdue against its defined cadence
        (daily availability/performance, weekly consent, monthly billing). A missed
        cadence raises an ITSM ticket + Risk signal via a headless monitor.
      x-rate-limit-per-min: 100
      x-required-scope: compliance:reports:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
      responses:
        '200':
          description: Per-report cadence status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LfiReportCadenceStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [reports]
      summary: Manual verified ingest of a login-only Nebras LFI report (BACKOFFICE-67)
      description: >
        The 16 Nebras LFI Reports are downloaded from the Nebras portal (no API) and
        uploaded here. The upload computes an integrity hash, writes a compliance_report
        record, and emits BCBS 239 lineage — the same verified-ingest pattern as the
        Nebras billing-record upload (BACKOFFICE-73). High-class audited with the acting
        principal.
      x-rate-limit-per-min: 20
      x-required-scope: compliance:reports:generate
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, report_type, report_period]
              properties:
                file: { type: string, format: binary }
                report_type:
                  type: string
                  description: One of the 16 login-only LFI report types, e.g. availability, performance, consent, billing
                report_period:
                  type: string
                  description: Reporting period the file covers (ISO date for daily, ISO week for weekly, YYYY-MM for monthly)
                source_note: { type: string, description: e.g. portal download timestamp / operator note }
      responses:
        '201':
          description: Report ingested — compliance_report written with integrity hash; BCBS 239 lineage emitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ComplianceReport' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/inquiries/psu:
    post:
      tags: [reports]
      summary: Generate per-PSU CBUAE inquiry bundle (BACKOFFICE-23)
      x-rate-limit-per-min: 10
      x-required-scope: compliance:reports:generate
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [psu_identifier_type, psu_identifier]
              properties:
                psu_identifier_type: { type: string, enum: [bank_customer_id, iban, emirates_id] }
                psu_identifier: { type: string }
                period_months: { type: integer, default: 24, maximum: 24 }
      responses:
        '202': { $ref: '#/components/responses/Report' }
        default: { $ref: '#/components/responses/Error' }

  # ---------- 7.5 Approvals ----------
  /approvals:
    post:
      tags: [approvals]
      summary: Create an approval request (usually created implicitly by four-eyes endpoints)
      x-rate-limit-per-min: 60
      x-required-scope: (initiator scope)
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_type, operation_payload]
              properties:
