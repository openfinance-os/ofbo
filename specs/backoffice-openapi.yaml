components:
  securitySchemes:
    adminOAuth:
      type: oauth2
      description: Platform Auth Service tokens (enterprise IdP OIDC exchange or care-surface connected-app client_credentials with act/sub claims)
      flows:
        clientCredentials:
          tokenUrl: https://auth.bank.example/oauth2/token
          scopes:
            consents:admin: PSU-centric consent search + revoke (Customer Care)
            consents:admin:fraud-revoke: FRAUD_SUSPECTED revocation only (Risk Analyst)
            disputes:admin: Dispute create/update + refund initiation (Customer Care)
            platform:operations:read: Operations Console reads
            platform:operations:write: Outage ack, incident creation, thresholds, replay
            platform:analytics:read: Executive Dashboard reads
            reconciliation:read: Reconciliation Engine outputs
            finance:reconciliation:write: Break investigation workflow
            finance:disputes:write: Nebras dispute case creation
            risk:read: Risk View signals
            risk:investigations:write: Risk investigation workflow + STR draft
            compliance:reports:read: Report library reads
            compliance:reports:generate: Initiate report runs (four-eyes when CBUAE-bound)
            audit:read: 24-month PSU-centric audit trail
            commercial:read: Commercial analytics views
            pipeline:read: Pipeline view
            programme:read: Programme view (cross-bank where applicable)
            certification:read: Certification tracker
            billing:read: TPP counterparty registry + invoice-run reads (Finance)
            billing:write: Financial-system registration + invoice-run initiation (Finance)
            platform:agents:read: Automation agent registry reads (Platform Administrator, BACKOFFICE-60)
            platform:agents:write: Agent DCR registration (four-eyes) + revoke (Platform Administrator, BACKOFFICE-60)
            platform:superadmin: Union of all scopes (Platform Super Administrator, BACKOFFICE-80). Marker scope — satisfies any scope check but is stamped on every High-class audit record; sessions auto-raise an ITSM ticket + Risk signal; four-eyes self-approval still rejected; human principals only; mutating actions require the x-superadmin-justification header (guardrail d)

  parameters:
    fapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Used as the OTel trace ID end-to-end (NFR-26)
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: 24h dedup window (Kong plugin); required on all mutating endpoints
    superAdminJustification:
      name: x-superadmin-justification
      in: header
      required: false
      schema: { type: string, minLength: 20 }
      description: >
        BACKOFFICE-80 guardrail (d): REQUIRED (min 20 chars) when the caller holds
        platform:superadmin and the operation is mutating; recorded on the High-class
        audit record. Ignored for all other personas. Absence under the marker scope
        yields 400 BACKOFFICE.JUSTIFICATION_REQUIRED.
    cursor:
      name: cursor
      in: query
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    breakId:
      name: break_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    consentId:
      name: consent_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    disputeId:
      name: dispute_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    respondentDisputeId:
      name: respondent_dispute_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    reportId:
      name: report_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    organisationId:
      name: organisation_id
      in: path
      required: true
      schema: { type: string }
      description: Trust Framework Directory OrganisationId
    recordSetId:
      name: record_set_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    invoiceRunId:
      name: invoice_run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    approvalId:
      name: approval_id
      in: path
      required: true
      # Approval ids are UUID v4 (approvals service: crypto.randomUUID()) — kept
      # consistent with ApprovalRequest.approval_request_id and invoice_run.approval_id.
      schema: { type: string, format: uuid }
    participantId:
      name: participant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    serviceDeskCaseId:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    agentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Standard error envelope (per CLAUDE.md)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ApprovalPending:
      description: Four-eyes operation accepted; pending second-person approval (2-business-hour expiry, BO-OQ-30 default)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ApprovalRequest' }
    ReconciliationRun:
      description: Reconciliation run
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ReconciliationRun' }
    ReconciliationBreak:
      description: Reconciliation break
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ReconciliationBreak' }
    Thresholds:
      description: Threshold set
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Threshold' }
    Dispute:
      description: Dispute case
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/DisputeCase' }
    Report:
      description: Compliance report record
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ComplianceReport' }
    Approval:
      description: Approval request
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ApprovalRequest' }
    Agent:
      description: Registered automation agent
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AgentRegistration' }
    Agents:
      description: Registered automation agents (paginated; cursor in meta.next_cursor)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRegistration' }
    RevocationResult:
      description: Revocation outcome
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      consent_id: { type: string, format: uuid }
                      status: { type: string, enum: [Revoked] }
                      nebras_propagation_ms:
                        type: integer
                        # THE BOUND IS NOT STATED IN THIS COMMENT — it is stated by the extension
                        # below and twice in the description, and a test binds every occurrence in
                        # this schema node. An unbound fourth copy is the defect this field exists to
                        # close, so this comment carries reasons and no number.
                        #
                        # WHY THE EXTENSION. The bound used to be prose alone, derived from nothing
                        # and compared by nothing — a fourth independent copy of a threshold the
                        # services single-source in services/bff/src/consents/nebras-sla.ts. A scheme
                        # amendment would have left the published contract telling integrators the old
                        # value while the code enforced the new one: of the four places to be wrong,
                        # the one with the widest audience.
                        #
                        # WHY `exclusive` IS IN THE KEY. Named `…-max-ms`, a machine consumer reads it
                        # the way JSON Schema reads `maximum` — inclusive — while every comparator
                        # that decides conformance is strict `<`. An acknowledgment landing exactly ON
                        # the bound would be a breach to the code and conformant to the consumer: a
                        # one-millisecond window on a regulated control.
                        #
                        # WHY NOT `p99`. The value is what a SINGLE measurement is compared against.
                        # NFR-18's own requirement is distributional, a p99 over those comparisons, so
                        # a key naming the statistic would invite a consumer to evaluate a percentile
                        # against a per-observation bound — a different check from the one the
                        # services run.
                        #
                        x-nfr18-exclusive-max-ms: 5000
                        description: >-
                          Observed Nebras acknowledgment latency for this revocation, in
                          milliseconds. A single measurement, not an aggregate.

                          `0` is a sentinel, not a measurement: it means the revocation was
                          acknowledged without leaving the deployment, so no propagation was timed.
                          Read it as "no propagation occurred" rather than as an exceptionally fast
                          one, and exclude it from latency statistics.

                          The NFR-18 bound is strictly below 5000 ms, exclusive: a measurement of
                          exactly 5000 fails that comparison. The bound is per-observation, while
                          NFR-18 itself is distributional (a p99 taken over those comparisons). This
                          response carries the measurement and not a conformance verdict, so a
                          consumer that needs pass/fail computes it from the stated bound. Note that
                          `data` declares no `required` list, so a generated client will type this
                          field optional even though the service emits it on every revocation —
                          handle absence.

                          Not constrained by `maximum`, deliberately: the field records what
                          happened, so a value at or above the bound is a real observation and must
                          stay representable. A schema constraint would make a breach unreportable
                          rather than impossible.
                      psu_notified: { type: boolean }
    ConsentEventList:
      description: Paginated consent lifecycle events
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ConsentEvent' }
    AnalyticsView:
      description: View payload with mandatory freshness metadata (BACKOFFICE-40)
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    description: >-
                      View-specific widgets. MAY carry an optional `sections` array of typed,
                      named AnalyticsSection panels (UIF-SPEC / ADR 0016): the portal renders
                      each section's `kind` with a bespoke primitive (gauge, contribution
                      bars, KPI strip, status cards, alert, table). Any other keys — and any
                      section whose `kind` the client does not recognise — degrade to the
                      generic labelled grid, so this stays backward-compatible with the
                      previous free-form `data`.
                    additionalProperties: true
                    properties:
                      sections:
                        type: array
                        items: { $ref: '#/components/schemas/AnalyticsSection' }
                  freshness: { $ref: '#/components/schemas/Freshness' }

  schemas:
    BillingProfitabilityScenario:
      type: object
      additionalProperties: false
      required: [scenario_id, effective_date, receivable_multiplier_basis_points, retail_overage]
      properties:
        scenario_id: { type: string, minLength: 1, maxLength: 100 }
        effective_date: { type: string, format: date }
        receivable_multiplier_basis_points: { type: integer, minimum: 0, maximum: 100000 }
        retail_overage:
          type: object
          additionalProperties: false
          required: [overage_units, current_rate_milli_fils, proposed_rate_milli_fils]
          properties:
            overage_units: { type: integer, minimum: 0 }
            current_rate_milli_fils: { type: integer, minimum: 0 }
            proposed_rate_milli_fils: { type: integer, minimum: 0 }
    BillingProfitabilityScenarioRequest:
      type: object
      additionalProperties: false
      required: [period, scenario]
      properties:
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        scenario: { $ref: '#/components/schemas/BillingProfitabilityScenario' }
    Envelope:
      type: object
      properties:
        meta:
          type: object
          properties:
            request_id: { type: string }
            timestamp: { type: string, format: date-time }
            next_cursor: { type: string, nullable: true }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, remediation, docs_url]
          properties:
            code: { type: string, example: BACKOFFICE.SCOPE_DENIED }
            message: { type: string }
            remediation: { type: string, description: What the caller can do to resolve the error }
            docs_url: { type: string, format: uri }
            required_scope: { type: string, nullable: true, description: Present on scope-denied errors }
        meta:
          type: object
          properties:
            request_id: { type: string }
            timestamp: { type: string, format: date-time }
    AgentRegistration:
      type: object
      description: >
        A registered automation agent identity (BACKOFFICE-60 / ADR 0017). No PII — this
        describes a service account, not a person. Scopes are a STRICT SUBSET of the
        human persona named by `derived_from` (PRD §2) and never include
        platform:superadmin (BACKOFFICE-80).
      required: [agent_id, client_id, display_name, persona, derived_from, scopes, status, allow_mutations, spend_budget, registered_by, created_at]
      properties:
        agent_id: { type: string, format: uuid }
        client_id: { type: string, description: OAuth2 client id issued on approval (DCR, RFC 7591) }
        display_name: { type: string }
        persona: { type: string, description: Agent persona id (e.g. care-readonly-agent) }
        derived_from: { type: string, description: Human persona this agent is a strict subset of (PRD §2) }
        scopes:
          type: array
          items: { type: string }
          description: Bound server-side from the persona; strict subset of derived_from's scopes; never platform:superadmin.
        status: { type: string, enum: [pending, active, revoked] }
        allow_mutations: { type: boolean, description: ADR 0017 — false until a human raises it AND spend-control (BACKOFFICE-53) is live }
        spend_budget: { type: integer, minimum: 0, description: Per-session consequential-operation budget (BACKOFFICE-53); 0 = read-only }
        registered_by: { type: string, description: IdP subject of the four-eyes initiator }
        approved_by: { type: string, nullable: true, description: IdP subject of the four-eyes approver (different principal) }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoke_reason: { type: string, nullable: true }
    AgentSessionToken:
      type: object
      description: >
        A short-lived agent session token (ADR 0018, Option 2). Generalises the ADR 0001
        act/sub minting: act = agent_id, scopes = the registration's bound scopes (a strict
        subset of a human persona; never platform:superadmin), plus a session_id +
        spend_budget so the BFF can re-assert per-(agent_id, session_id) spend-control
        BFF-side (BACKOFFICE-53). Issued only for an `active` registration. No PII — an
        agent is a service account, not a person.
      required: [session_token, agent_id, session_id, scopes, allow_mutations, spend_budget, expires_at]
      properties:
        session_token: { type: string, description: Opaque, server-verifiable bearer — the BFF minted it and verifies it (no client-asserted identity). No PII. }
        agent_id: { type: string, format: uuid, description: The registry agent id (act). Server-verified — never taken from a client header. }
        session_id: { type: string, description: Stable id for per-session spend accounting + trace correlation. }
        scopes:
          type: array
          items: { type: string }
          description: The registration's bound scopes; a strict subset of a human persona; never platform:superadmin.
        allow_mutations: { type: boolean, description: Mirrors the registration; mutating tools stay disabled when false. }
        spend_budget: { type: integer, minimum: 0, description: Per-session consequential-operation budget re-asserted BFF-side (BACKOFFICE-53); 0 = read-only. }
        expires_at: { type: string, format: date-time, description: Short TTL; revoking the agent denylists the session before it expires. }
    StrDraft:
      type: object
      description: >
        A Suspicious Transaction Report draft (BACKOFFICE-63). Auto-created on a
        fraud-suspected revocation (BACKOFFICE-22); handed to the bank's STR workflow (P10) on
        four-eyes approval, which submits to AML GO — the Back Office never submits directly.
        No PII — an internal consent ref + case context only, never PSU identifiers.
      required: [str_draft_id, source_consent_id, case_context, status, created_by, created_at]
      properties:
        str_draft_id: { type: string, format: uuid }
        source_consent_id: { type: string, description: Internal ref to the consent whose fraud-revoke raised this draft. No PII. }
        case_context: { type: string, description: Free-text investigator context carried into the STR. Synthetic in non-prod; no PII. }
        status: { type: string, enum: [draft, awaiting_handoff, handed_off], description: draft → awaiting_handoff (four-eyes initiated) → handed_off (accepted by the STR workflow). }
        created_by: { type: string, description: IdP subject that raised the draft (the fraud-revoke initiator). }
        approval_id: { type: string, nullable: true, description: The four-eyes approval request gating the handoff. }
        workflow_ref: { type: string, nullable: true, description: The bank STR workflow's own reference once it accepts the handoff. }
        approved_by: { type: string, nullable: true, description: IdP subject of the Risk second-line approver (different principal). }
        handed_off_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Money:
      type: object
      required: [amount, currency]
      description: 'Binding money convention (CLAUDE.md): integer minor units + ISO 4217 — never floating point. Example: { "amount": 150000, "currency": "AED" } = AED 1,500.00.'
      properties:
        amount: { type: integer, description: Integer minor units (fils for AED); may be negative for offsets/credits }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: AED, description: ISO 4217 alphabetic code }
    StatTone:
      type: string
      enum: [reconciled, break, breach, neutral]
      description: >-
        Semantic tone for a stat/trend (UIF-SPEC). Maps to the PRD §7 status triad —
        reconciled=green, break=amber, breach=red — plus neutral. Appearance only.
    AnalyticsSection:
      type: object
      required: [kind, title]
      description: >-
        A typed, named analytics panel (UIF-SPEC / ADR 0016). `kind` selects the bespoke
        portal primitive; the matching payload property carries its data (e.g. `stats` for
        kpi-strip, `gauge` for gauge). A client that does not recognise a `kind` MUST
        degrade it to the generic labelled grid — so producers can add kinds without a
        breaking change. Bound to the OpenAPI contract; carries no PSU PII.
      properties:
        kind:
          type: string
          enum: [kpi-strip, gauge, contribution-bars, status-cards, alert, object-table]
        title: { type: string }
        stats:
          type: array
          description: Payload for kind=kpi-strip.
          items: { $ref: '#/components/schemas/AnalyticsStat' }
        gauge:
          allOf: [{ $ref: '#/components/schemas/AnalyticsGauge' }]
          description: Payload for kind=gauge.
        segments:
          type: array
          description: Payload for kind=contribution-bars.
          items: { $ref: '#/components/schemas/AnalyticsContributionSegment' }
        cards:
          type: array
          description: Payload for kind=status-cards.
          items: { $ref: '#/components/schemas/AnalyticsStatusCard' }
        alert:
          allOf: [{ $ref: '#/components/schemas/AnalyticsAlert' }]
          description: Payload for kind=alert.
        table:
          allOf: [{ $ref: '#/components/schemas/AnalyticsTable' }]
          description: Payload for kind=object-table.
    AnalyticsStat:
      type: object
      required: [label, value]
      description: One big-number stat in a kpi-strip section (renders as KpiStat).
      properties:
        label: { type: string }
        value:
          type: string
          description: >-
            Pre-formatted display value — a string so the producer controls formatting
            (e.g. AED 4.82M or 32.8%).
        unit: { type: string, nullable: true }
        sublabel: { type: string, nullable: true }
        trend:
          type: object
          nullable: true
          required: [label]
          properties:
            label: { type: string }
            tone: { $ref: '#/components/schemas/StatTone' }
    AnalyticsGauge:
      type: object
      required: [value]
      description: A radial gauge payload (renders as Gauge).
      properties:
        value: { type: number }
        max: { type: number, default: 100 }
        unit: { type: string, nullable: true }
    AnalyticsContributionSegment:
      type: object
      required: [label, value]
      description: One segment of a contribution-bars section (renders as ContributionBar).
      properties:
        label: { type: string }
        value: { type: number, description: Relative weight; widths are normalised to the segment total. }
    AnalyticsStatusCard:
      type: object
      required: [label, status]
      description: One card in a status-cards section (status renders as a StatusBadge).
      properties:
        label: { type: string }
        value: { type: string, nullable: true }
        status: { type: string, description: A status token mapped to a tone via the shared status vocabulary. }
        note: { type: string, nullable: true }
    AnalyticsAlert:
      type: object
      required: [severity, message]
      description: An inline alert/callout section.
      properties:
        severity:
          type: string
          enum: [info, warning, critical]
        message: { type: string }
        remediation: { type: string, nullable: true }
    AnalyticsTable:
      type: object
      required: [columns, rows]
      description: A simple object-table section (the generic grid's typed form).
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
    Channel:
      type: string
      enum: [internal_retail, internal_sme, internal_corporate, external_direct, external_tpp_aas]
      description: §6.0 channel dimension (attribute, not tenant key)
    LineType:
      type: string
      enum: [nebras_fees, payment_settlement, consent_record, tpp_aas_pass_through, lfi_access_log, dao_api_call]
      description: >
        Reconciliation line classes. dao_api_call (BACKOFFICE-68) covers Dynamic Account
        Opening API calls in the three-way match; it defaults to the data-sharing fee +
        break threshold until DAO-specific volumes/pricing are observed.
    BreakStatus:
      type: string
      enum: [flagged, assigned, resolved_matched, resolved_internal_correction, escalated_nebras_dispute, escalated_fintech_billing]
    DisputeState:
      type: string
      enum: [open, in_progress, escalated, refund_initiated, resolved, closed]
    ReportStatus:
      type: string
      enum: [requested, generating, awaiting_approval, approved, submitted, rejected, archived]
    ConsentStatus:
      type: string
      enum: [AwaitingAuthorization, Authorized, Rejected, Suspended, Consumed, Expired, Revoked]
      description: Full CBUAE v2.1-final lifecycle. `Suspended` is gated on the platform gap closure (Ready-to-Build Checklist item 2).
    ReconciliationRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, example: recon-2026-07-15-daily }
        run_type: { type: string, enum: [daily, monthly_close, replay, on_demand] }
        status: { type: string, enum: [running, completed, failed, partial] }
        reconciliation_window_start: { type: string, format: date-time }
        reconciliation_window_end: { type: string, format: date-time }
        line_count_total: { type: integer, nullable: true }
        line_count_matched: { type: integer, nullable: true }
        line_count_unmatched: { type: integer, nullable: true }
        line_count_disputed: { type: integer, nullable: true }
        failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ReconciliationBreak:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string }
        client_id: { type: string, format: uuid, nullable: true }
        channel: { $ref: '#/components/schemas/Channel' }
        line_type: { $ref: '#/components/schemas/LineType' }
        status: { $ref: '#/components/schemas/BreakStatus' }
        variance_amount:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/Money' } ]
        variance_count: { type: integer, nullable: true }
        source_a_ref: { type: string, description: Nebras source line }
        source_b_ref: { type: string, description: Platform internal log line }
        source_c_ref: { type: string, nullable: true, description: Fintech billing line }
        assigned_to: { type: string, nullable: true }
        sla_clock_started_at: { type: string, format: date-time, nullable: true }
        resolution_outcome: { type: string, nullable: true }
        resolution_note: { type: string, nullable: true }
        nebras_dispute_case_id: { type: string, nullable: true }
        reopened_count: { type: integer }
        created_at: { type: string, format: date-time }
    Threshold:
      type: object
      required: [fee_class, threshold_value]
      properties:
        fee_class: { type: string, example: nebras_fees }
        threshold_value: { type: integer, description: 'Integer minor units (fils) when unit=aed — default 1 (= 1 fils) for fees; plain count when unit=count — default 0 for consent drift' }
        unit: { type: string, enum: [aed, count] }
    CareToken:
      type: object
      description: >
        A short-lived care-surface token (BACKOFFICE-25). act = the acting agent,
        sub = the PSU subject (both internal refs, no PII). Cap expires_at at <= 15 min.
      required: [token, act, sub, expires_at]
      properties:
        token: { type: string, description: Opaque bearer credential for care-surface calls. }
        act: { type: string, description: Acting agent identity (internal ref, no PII). }
        sub: { type: string, description: Resolved PSU subject (internal ref, no PII). }
        expires_at: { type: string, format: date-time }
    PsuConsentSearchResult:
      type: object
      properties:
        psu:
          type: object
          properties:
            bank_customer_id: { type: string }
            account_count: { type: integer }
        consents:
          type: array
          items: { $ref: '#/components/schemas/ConsentAdminView' }
    ConsentAdminView:
      type: object
      properties:
        consent_id: { type: string, format: uuid }
        tpp:
          type: object
          properties:
            client_id: { type: string, format: uuid }
            display_name: { type: string }
        purpose: { type: string, example: AISP_DATA_SHARING }
        scope: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/ConsentStatus' }
        granted_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        last_access_at: { type: string, format: date-time, nullable: true }
        multi_auth:
          type: object
          nullable: true
          description: Present for multi-authorisation payment consents (BACKOFFICE-61) — M-of-N authoriser visibility.
          properties:
            threshold: { type: integer, description: M — authorisers required to authorise the consent }
            received: { type: integer, description: Authorisers who have authorised so far }
            pending: { type: boolean, description: True while received < threshold (still pending the authorisation threshold) }
            authorisers:
              type: array
              items:
                type: object
                properties:
                  authoriser_ref: { type: string }
                  status: { type: string, description: Per-authoriser status (e.g. authorised, pending, rejected) }
                  authorised_at: { type: string, format: date-time, nullable: true }
    ConsentEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        consent_id: { type: string, format: uuid }
        psu_identifier: { type: string }
        event_type: { type: string, enum: [granted, accessed, modified, revoked] }
        event_subtype: { type: string, nullable: true, description: e.g. revocation reason code }
        event_data: { type: object }
        acting_principal: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    PaymentAdminView:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        ipp_status: { type: string, description: One of the 5 IPP status codes }
        consent_at_time_of_payment: { $ref: '#/components/schemas/ConsentAdminView' }
        cop_outcome: { type: object, description: CoP result from the Phase-0 endpoint }
        risk_information_block: { type: object, description: As submitted to the LFI }
        channel: { $ref: '#/components/schemas/Channel' }
    DisputeCreate:
      type: object
      required: [psu_identifier, dispute_type]
      properties:
        psu_identifier: { type: string }
        dispute_type: { type: string, enum: [unauthorised_payment, unrecognised_tpp, consent_complaint, data_misuse_complaint, other] }
        originating_payment_id: { type: string, format: uuid, nullable: true }
        originating_consent_id: { type: string, format: uuid, nullable: true }
        originating_call_id: { type: string, nullable: true, description: Contact-centre call linkage (BACKOFFICE-64, fast-follow) }
        dispute_reason_code: { type: string, nullable: true }
        aani_case_id: { type: string, nullable: true, description: 'Cross-scheme reference (BACKOFFICE-76) — Aani case id where the same dispute exists in the Aani instant-payment scheme' }
    CallRecording:
      type: object
      description: >
        A short-lived link to the contact-centre recording that originated a dispute
        (BACKOFFICE-64). The Back Office links, never copies — recording_url is a
        time-boxed locator in the bank's system; cap expires_at short.
      required: [recording_ref, expires_at]
      properties:
        recording_ref: { type: string, description: Opaque recording reference in the bank's contact-centre system. }
        recording_url: { type: string, nullable: true, description: Short-lived locator URL (null when only a reference is returned). }
        expires_at: { type: string, format: date-time }
    DisputeCase:
      allOf:
        - $ref: '#/components/schemas/DisputeCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            state: { $ref: '#/components/schemas/DisputeState' }
            sla_clock_started_at: { type: string, format: date-time }
            refund_required_by: { type: string, format: date-time, nullable: true, description: Next business day after sla_clock_started_at }
            refund_initiated_at: { type: string, format: date-time, nullable: true }
            refund_amount:
              nullable: true
              allOf: [ { $ref: '#/components/schemas/Money' } ]
            nebras_case_id: { type: string, nullable: true }
            care_case_id: { type: string, nullable: true }
            assigned_to: { type: string, nullable: true }
            cross_scheme:
              nullable: true
              allOf: [ { $ref: '#/components/schemas/CrossSchemeContext' } ]
            created_at: { type: string, format: date-time }
    CrossSchemeContext:
      type: object
      description: >
        Cross-scheme (Aani / Al Tareq) dispute context + double-compensation guard
        (BACKOFFICE-76). The guard blocks settling the same direct loss in both schemes.
      properties:
        aani_case_id: { type: string, nullable: true }
        aani_recall_window_expires_at: { type: string, format: date-time, nullable: true, description: 2-hour Aani fund-recall window (from the payment); surfaced in unauthorized-payment triage }
        settled_in_other_scheme: { type: boolean, description: True when the same direct loss has been settled in the other scheme }
        compensation_blocked: { type: boolean, description: Double-compensation guard — when true, an initiate-refund for the same direct loss is rejected (409) }
        sanadak_reference: { type: string, nullable: true, description: Consumer-protection-authority (Sanadak) escalation reference }
        sanadak_escalated_at: { type: string, format: date-time, nullable: true }
    RespondentDisputeCreate:
      type: object
      required: [nebras_dispute_ref, category, raised_at]
      properties:
        nebras_dispute_ref: { type: string, description: Nebras Case & Dispute Management reference for the dispute raised against the bank }
        category: { type: string, enum: [billing, consent, data_sharing, liability, conduct, other] }
        subject_summary: { type: string, nullable: true, description: Short synthetic summary — no PSU PII }
        raised_at: { type: string, format: date-time, description: When Nebras raised the dispute; the response + resolution clocks start here }
        originating_break_id: { type: string, format: uuid, nullable: true, description: Linked reconciliation break where one exists }
    RespondentDisputeState:
      type: string
      enum: [received, responded, under_resolution, resolved, appealed, awaiting_implementation, implemented, closed]
    SchemeClockStatus:
      type: string
      enum: [on_track, amber, red]
      description: on_track; amber within the warning window before due; red past due (breach)
    RespondentDispute:
      allOf:
        - $ref: '#/components/schemas/RespondentDisputeCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            state: { $ref: '#/components/schemas/RespondentDisputeState' }
            response_due_at: { type: string, format: date-time, description: raised_at + 3 business days }
            responded_at: { type: string, format: date-time, nullable: true }
            resolution_due_at: { type: string, format: date-time, description: raised_at + 15 business days }
            resolved_at: { type: string, format: date-time, nullable: true }
            appeal_due_at: { type: string, format: date-time, nullable: true, description: verdict + 3 business days }
            appealed_at: { type: string, format: date-time, nullable: true }
            implementation_due_at: { type: string, format: date-time, nullable: true, description: final verdict + 3 business days }
            implemented_at: { type: string, format: date-time, nullable: true }
            response_clock_status: { $ref: '#/components/schemas/SchemeClockStatus' }
            resolution_clock_status: { $ref: '#/components/schemas/SchemeClockStatus' }
            appeal_clock_status: { $ref: '#/components/schemas/SchemeClockStatus' }
            implementation_clock_status: { $ref: '#/components/schemas/SchemeClockStatus' }
            overall_breach_status: { $ref: '#/components/schemas/SchemeClockStatus' }
            verdict_outcome: { type: string, nullable: true, enum: [upheld, partially_upheld, rejected] }
            created_at: { type: string, format: date-time }
    ComplianceReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        report_type: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }
        reporting_period_start: { type: string, format: date-time }
        reporting_period_end: { type: string, format: date-time }
        requested_by: { type: string }
        approved_by: { type: string, nullable: true }
        integrity_hash: { type: string, nullable: true, description: SHA-256, set once approved }
        generated_at: { type: string, format: date-time, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
    LfiReportCadence:
      type: string
      enum: [daily, weekly, monthly]
      description: >
        Ingest cadence for a login-only Nebras LFI report (BACKOFFICE-67) — daily for
        availability/performance, weekly for consent, monthly for billing (PRD §7).
    LfiReportCadenceStatus:
      type: object
