                aani_case_id: { type: string, description: Aani instant-payment scheme case id }
                settled_in_other_scheme: { type: boolean, description: Set when the same direct loss has been settled in the other scheme (arms the double-compensation guard) }
                sanadak_reference: { type: string, description: Consumer-protection-authority (Sanadak) escalation reference }
      responses:
        '200':
