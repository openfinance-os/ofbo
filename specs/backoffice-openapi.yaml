    NebrasSeverity:
      type: string
      enum: [P1, P2, P3, P4]
      description: >
        Nebras incident severity taxonomy (BACKOFFICE-77). Mapped to the ITSM (P3)
        priority scheme: P1→critical, P2→high, P3→medium, P4→low.
    FraudIncident:
      type: object
      description: >
        A fraud incident escalated to the Nebras helpdesk (BACKOFFICE-77), tracking the
        captured case reference, the mapped ITSM priority, and the customer
        operational-pause state until resolution.
      properties:
        id: { type: string, format: uuid }
        consent_id: { type: string, format: uuid, nullable: true }
        client_id: { type: string, format: uuid, nullable: true }
        nebras_severity: { $ref: '#/components/schemas/NebrasSeverity' }
        itsm_priority: { type: string, enum: [low, medium, high, critical], description: Derived from nebras_severity }
        nebras_case_reference: { type: string, nullable: true }
        status: { type: string, enum: [open, reported, resolved] }
        operational_pause: { type: boolean, description: Customer operational-pause active until resolution }
        scheme_imposed_hold: { type: boolean, description: True when Nebras imposed a hold/temporary revocation on the bank (systemic-fraud P1) }
        summary: { type: string }
        opened_by: { type: string }
        opened_at: { type: string, format: date-time }
        reported_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string, example: psu_lookup }
        acting_principal: { type: string }
        acting_persona: { type: string }
        scope_used:
          type: string
          description: >
            The declared scope that authorised the action, or one of exactly three declared
            non-scope literals. Scheduled jobs previously stamped invented tokens (`billing:rate`,
            `reconciliation:run`, …) that named scopes an auditor could not resolve against this
            contract — permanently, since the trail is INSERT-only with a five-year retention and no
            deletion path. Identity is carried by `acting_principal` and `event_type`, so nothing is
            lost by recording that no scope was involved (CODE-03).


            The three, kept distinct because collapsing them is the blurring the trail exists to
            prevent — an auditor must be able to tell a headless job from a person whose action no
            scope mediated:


            - `system` — a scheduled actor that no principal authorised.

            - `none` — an auth-lifecycle event (signin failure, signout) where a HUMAN acted and no
            scope was in play. Filing these under `system` would attribute a person's failed signin
            to a machine.

            - `seed` — demo-profile seed provenance, written by the seed scripts. Never an
            authorisation; the demo environment is permanently non-prod.


            This list is the contract half of a closed loop: the three literals are declared once in
            `packages/db/src/audit.ts`, the CODE-03 resolvability check builds its allow-list from
            those same constants, and a test asserts every declared constant appears here. An earlier
            version of this description named only `system` while the code wrote all three, which
            reproduced CODE-03's own defect — a value an auditor cannot resolve against the contract —
            inside the change that was supposed to close it.
        target_psu_identifier: { type: string, nullable: true }
        target_consent_id: { type: string, format: uuid, nullable: true }
        target_dispute_id: { type: string, format: uuid, nullable: true }
        request_trace_id: { type: string, description: x-fapi-interaction-id }
        superadmin_marker: { type: boolean, description: 'BACKOFFICE-80: stamped true on every record produced under platform:superadmin' }
        request_body_redacted: { type: object }
        response_status:
          type: integer
          description: >
            The HTTP status returned to the caller, or `0` for an actor that issues no HTTP response
            at all. Zero is not a status code, which is why it can carry that meaning without
            colliding with one. Scheduled jobs previously stamped 200/201/202/502 for responses
            nobody received, including one path that recorded 200 on a SKIP (CODE-03).
        created_at: { type: string, format: date-time }
    Freshness:
      type: object
      properties:
        source_published_at: { type: string, format: date-time }
        view_refreshed_at: { type: string, format: date-time }
        stale: { type: boolean, description: 'True when older than threshold (default: 2× source refresh cadence — BO-OQ-23)' }
        stale_cause: { type: string, nullable: true }

    TppCounterparty:
      type: object
      properties:
        organisation_id: { type: string, description: Trust Framework Directory OrganisationId }
        legal_name: { type: string }
        registration_number: { type: string, nullable: true }
        directory_contacts: { type: array, items: { type: object, additionalProperties: true } }
        directory_synced_at: { type: string, format: date-time }
        production_status: { type: string, enum: [directory_only, active_traffic, dormant, decommissioned] }
        first_traffic_at: { type: string, format: date-time, nullable: true }
        registration_state: { type: string, enum: [unregistered, onboarding, registered, suspended] }
        financial_system_ref: { type: string, nullable: true, description: Counterparty reference in the P9 financial system }
        unbilled_traffic: { type: boolean, description: Alert condition — traffic observed without completed financial-system registration }
        mtd_fee_accrual:
          nullable: true
          description: Month-to-date fee accrual
          allOf: [ { $ref: '#/components/schemas/Money' } ]
        channel: { $ref: '#/components/schemas/Channel' }
    BillingRecordSet:
      type: object
      properties:
        record_set_id: { type: string, format: uuid }
        billing_period: { type: string, description: 'YYYY-MM' }
        ingested_at: { type: string, format: date-time }
        ingested_by: { type: string, description: acting principal (High-class audited) }
        source_note: { type: string, nullable: true }
        integrity_hash: { type: string }
        line_count: { type: integer }
        status: { type: string, enum: [ingested, reconciling, reconciled_clean, reconciled_with_breaks] }
        open_break_count: { type: integer }
        nebras_billing_query_refs: { type: array, items: { type: string }, description: Nebras case references for disputed lines (30-day window) }
    TppCostDocumentType:
      type: string
      description: Provider cost-document taxonomy (ADR 0007 D9, IG v5.0 §10). Nebras tax invoice is primary.
      enum:
        - nebras_tax_invoice
        - nebras_settlement_statement
        - lfi_self_invoice
        - credit_note
        - debit_note
        - manual_adjustment
    TppCostDocumentLine:
      type: object
      required:
        [line_ref, source_category, mapped, cost_recipient_type, cost_recipient_id, units,
         unit_price_milli_fils, actual_net, vat, actual_gross]
      description: >
        One provider line. `source_category` is the provider's own category, kept verbatim as
        evidence; `fee_class` is our mapping of it and is null exactly when `mapped` is false.
      properties:
        line_ref: { type: string }
        source_category: { type: string }
        fee_class: { type: string, nullable: true }
        mapped:
          type: boolean
          description: False when the provider category resolves to no known fee class. Such a line is flagged, never dropped.
        cost_recipient_type: { type: string, enum: [nebras, underlying_lfi] }
        cost_recipient_id: { type: string }
        units: { type: integer }
        unit_price_milli_fils:
          type: integer
          description: >
            A unit RATE in integer milli-fils (thousandths of a fil), NOT a money amount. The binding
            money convention governs amounts; a scheme tariff of 2.5 fils per call cannot be expressed
            in minor units without rounding the price itself away, so rates keep sub-minor resolution.
        actual_net: { $ref: '#/components/schemas/Money' }
        vat: { $ref: '#/components/schemas/Money' }
        actual_gross:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Always equals actual_net + vat; derived from the rounded parts so the triple ties.
    TppCostDocument:
      type: object
      required:
        [document_id, document_type, issuer_id, recipient_id, document_reference, billing_period,
         currency, net, vat, gross, document_sha256, issued_at,
         received_at, verified_by, verified_at, unmapped_line_count, redacted_field_count, lines]
      properties:
        document_id: { type: string, format: uuid }
        document_type: { $ref: '#/components/schemas/TppCostDocumentType' }
        issuer_id: { type: string }
        recipient_id: { type: string }
        document_reference: { type: string }
        billing_period: { type: string, description: 'YYYY-MM' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        net: { $ref: '#/components/schemas/Money' }
        vat: { $ref: '#/components/schemas/Money' }
        gross:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Always equals net + vat; derived from the rounded parts so the triple ties.
        document_sha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        issued_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        verified_by: { type: string, description: The second person who verified the upload; never equal to the uploader }
        verified_at: { type: string, format: date-time }
        unmapped_line_count:
          type: integer
          description: Lines stored with mapped=false, awaiting a category mapping. Non-zero is a signal, not a failure.
        redacted_field_count:
          type: integer
          description: >
            How many provider fields were redacted at parse time. Key paths are audited; the removed
            values are never stored or logged.
        lines:
          type: array
          items: { $ref: '#/components/schemas/TppCostDocumentLine' }
    PayableBreakType:
      type: string
      enum:
        [quantity_variance, rate_variance, unexpected_charge, missing_charge, wrong_recipient,
         duplicate_charge, vat_variance, period_variance, unmatched_document_line,
         unmatched_expected_line]
      description: >
        Payable break taxonomy (BILL-13 migration 0039). Narrower than the reconciliation `LineType`,
        which classifies WHICH STREAM a break belongs to rather than what went wrong; every value here
        maps onto a LineType via the cost recipient — Hub fees to nebras_fees, underlying-LFI API
        access to lfi_access_log.
    TppCostDiffLine:
      type: object
      required:
        [line_ref, break_type, line_type, presence, cost_recipient_type, cost_recipient_id,
         expected_net, actual_net, variance, variance_basis_points,
         material, reason_code]
      properties:
        line_ref: { type: string }
        break_type: { $ref: '#/components/schemas/PayableBreakType' }
        line_type:
          allOf: [{ $ref: '#/components/schemas/LineType' }]
          description: The contract class this break is shown as on GET /back-office/reconciliation/breaks.
        presence: { type: string, enum: [both, expected_only, document_only] }
        cost_recipient_type: { type: string, enum: [nebras, underlying_lfi] }
        cost_recipient_id: { type: string }
        fee_class: { type: string, nullable: true }
        source_category:
          type: string
          nullable: true
          description: The provider's own wording, retained because a billing query cites it back to them.
        expected_net: { $ref: '#/components/schemas/Money' }
        actual_net: { $ref: '#/components/schemas/Money' }
        variance:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: >
            Signed — negative where the provider undercharged. Rounded symmetrically, so a credit is
            not biased against the bank.
        variance_basis_points: { type: integer }
        material:
          type: boolean
          description: >
            Exceeds the MATERIALITY threshold — big enough to hold the period open — which is
            configurable independently of the matching tolerance that decides whether a break exists
            at all. The two are equal at the shipped defaults. Judged on the dimension the break is
            about: a VAT break on its VAT variance, a quantity break on its counts, the rest on net
            variance. Judging every type on net would make a VAT break permanently immaterial, since
            classification only reaches `vat_variance` once the net variance is inside tolerance. A
            wrong recipient is material at zero variance.
        reason_code: { type: string }
        reconciliation_break_id:
          type: string
          format: uuid
          nullable: true
          description: The E1 break this was escalated as; null until it is escalated.
    TppCostReconciliation:
      type: object
      description: >
        Money amounts are `Money` (integer minor units + ISO 4217), per the binding convention.
        Milli-fils — thousandths of a fil — is a RATING AND STORAGE precision only, needed because
        ADR 0007 prices scheme tariffs at 2.5 and 0.5 fils; it never reaches the wire as an amount on THIS schema or its siblings. One deliberate exception exists and is named here so the two statements do not contradict each other: `TppCostEvidenceExport` (BILL-17) ships the ledger's stored rows verbatim, milli-fils included, because its digest must attest to what the ledger HOLDS rather than to a rounded restatement of it. That pack is an evidence artefact, not a read model — the console reads its figures from these schemas, which do emit `Money`.
        The two integer fields that remain in milli-fils are a matching threshold and a unit rate,
        neither of which is an amount.
      required:
        [period, currency, tolerance_milli_fils, query_window_days, query_deadline,
         query_window_status, days_remaining_at_ingest, response_clocks, matched_line_count,
         break_count, expected_total_net, actual_total_net,
         net_variance, gross_variance, penalty_lines_accepted, breaks]
      properties:
        period: { type: string, description: 'YYYY-MM' }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: >
            ISO 4217 for this reconciliation. Every AMOUNT here is a Money carrying its own
            currency; this field governs the object and the only bare-integer field left on it,
            `tolerance_milli_fils`, which is a threshold rather than an amount. The previous
            wording ("for every milli-fils amount in this object") described the pre-CODE-03
            shape and survived the sweep that removed those amounts.
        tolerance_milli_fils:
          type: integer
          description: >
            A matching THRESHOLD in integer milli-fils, not a money amount. Expectations are milli-fils
            and documents state fils, so a sub-fil difference is a unit artefact rather than a dispute —
            sub-fil resolution is the entire point of the field, and minor units would round it away.
            Configurable; defaults to one fil.
        query_window_days:
          type: integer
          description: IG v5.0 §10.13 window in calendar days. Config, not a constant (BD-21).
        query_deadline: { type: string, format: date-time }
        query_window_status: { type: string, enum: [open, expired] }
        days_remaining_at_ingest:
          type: integer
          description: Negative once the window closed. Measured at ingest, not at read time, so it is reproducible.
        response_clocks:
          type: object
          description: IG v5.0 §10.13 obligations Nebras owes on an open query.
          required: [first_response_minutes, final_response_days, escalation_review_days]
          properties:
            first_response_minutes: { type: integer }
            final_response_days: { type: integer }
            escalation_review_days: { type: integer }
        matched_line_count: { type: integer }
        break_count: { type: integer }
        expected_total_net: { $ref: '#/components/schemas/Money' }
        actual_total_net:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: >
            What the provider claims for THIS period. Off-period documents are excluded — they carry
            their own period_variance break — so this is not the sum of the documents' own totals
            whenever one is present.
        net_variance:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Signed, so opposing errors net. The headline exposure.
        gross_variance:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Absolute, so opposing errors do NOT net away. The amount actually in dispute.
        penalty_lines_accepted:
          type: integer
          description: IG §10.17 penalties matched to a recorded late payment for this period.
        breaks:
          type: array
          items: { $ref: '#/components/schemas/TppCostDiffLine' }
    TppCostDispatchState:
      type: string
      description: >
        Coarse lifecycle of an AP dispatch. Mirrors the `dispatch_state` CHECK on
        `billing_tpp_cost_ap_dispatch` (migration 0039) value for value — the column is in an
        INSERT-only family with no deletion path, so the two vocabularies cannot be allowed to
        drift. The P9 port's own finer status (`mandate_active`, `presented`, `collected`) is
        reported separately as `payable_status`; several of those map onto `dispatched` here,
        because what this value bounds is "one dispatch per instruction", not the debit's progress.
      enum: [pending, dispatched, accepted, rejected, failed]
    TppCostCloseState:
      type: string
      description: >
        Derived, never stored. `closed` = a second finance principal approved the close (and takes
        precedence — a break raised afterwards cannot un-close a period); `blocked` = not closed and
        unresolved material payable breaks exist; `open` = neither.
      enum: [open, blocked, closed]
    TppCostPayable:
      type: object
      required:
        [payable_id, period, cost_recipient_type, cost_recipient_id, document_reference,
         gross_amount, net_amount, vat_amount, approval_request_id, dispatch_state]
      description: >
        One accepted payable, keyed by the reconciliation that established it. `gross_amount` is
        what the scheme debit collects; `net_amount` is what accrues as cost. Both are Money —
        integer minor units — even though the ledger stores the finer milli-fils behind the
        boundary.
      properties:
        payable_id: { type: string, format: uuid, description: The reconciliation this payable was established by }
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        cost_recipient_type: { type: string, enum: [nebras, underlying_lfi] }
        cost_recipient_id: { type: string }
        document_reference: { type: string, description: The provider tax invoice the payable was accepted against }
        gross_amount: { $ref: '#/components/schemas/Money' }
        net_amount: { $ref: '#/components/schemas/Money' }
        vat_amount: { $ref: '#/components/schemas/Money' }
        approval_request_id:
          type: string
          nullable: true
          description: The four-eyes close that authorises honouring this debit; null until the period closes.
        dispatch_state:
          nullable: true
          description: Latest recorded dispatch state; null when never dispatched.
          allOf: [ { $ref: '#/components/schemas/TppCostDispatchState' } ]
        dispatched_at: { type: string, format: date-time, nullable: true }
        netted_against:
          nullable: true
          description: IG §10.16 offset applied where this counterparty also operates as a TPP.
          allOf: [ { $ref: '#/components/schemas/Money' } ]
    TppCostPeriodBlocker:
      type: object
      required: [line_ref, break_type, cost_recipient_type, cost_recipient_id, variance, reconciliation_break_id]
      description: One unresolved material payable break holding the period open.
      properties:
        line_ref: { type: string }
        break_type: { $ref: '#/components/schemas/PayableBreakType' }
        cost_recipient_type: { type: string, enum: [nebras, underlying_lfi] }
        cost_recipient_id: { type: string }
        variance: { $ref: '#/components/schemas/Money' }
        reconciliation_break_id:
          type: string
          format: uuid
          nullable: true
          description: The E1 break this was escalated as; null means raised but not yet worked.
    TppCostPeriod:
      type: object
      required: [period, close_state, open_break_count, blockers, payables, feeds_monthly_signoff]
      description: >
        The payable state of one cost period — close, payables, and blockers — as one read.
      properties:
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        close_state: { $ref: '#/components/schemas/TppCostCloseState' }
        closed_at: { type: string, format: date-time, nullable: true }
        initiated_by: { type: string, nullable: true, description: Principal who requested the close; normalised. }
        approved_by: { type: string, nullable: true, description: The second principal who approved it; normalised. }
        approval_request_id: { type: string, nullable: true }
        feeds_monthly_signoff:
          type: boolean
          description: >
            Always true. Recorded as data rather than convention so the relationship to the
            BACKOFFICE-06 monthly sign-off is readable from the row.
        open_break_count: { type: integer, minimum: 0 }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/TppCostPeriodBlocker' }
        payables:
          type: array
          items: { $ref: '#/components/schemas/TppCostPayable' }
    TppCostPayableDispatch:
      type: object
      required: [payable_id, dispatch_ref, dispatch_state, payable_status, replayed, approval_request_id]
      description: >
        The outcome of handing one approved payable to P9. `dispatch_ref` is the financial system's
        own reference, redacted before it is persisted.
      properties:
        payable_id: { type: string, format: uuid }
        dispatch_ref: { type: string }
        dispatch_state: { $ref: '#/components/schemas/TppCostDispatchState' }
        payable_status:
          type: string
          enum: [dispatched, mandate_active, presented, collected, rejected]
          description: The P9 port's own finer status for the debit.
        replayed: { type: boolean, description: True when the call matched an existing dispatch rather than authorising a new one }
        approval_request_id: { type: string }
        dispatched_at: { type: string, format: date-time }
    TppCostEvidenceExport:
      type: object
      required:
        [schema_version, period, generated_at, record_counts, documents, reconciliations,
         diff_lines, closes, dispatches, sha256]
      description: >
        One period's payable evidence, as issued. Amounts inside the collections are the ledger's
        own stored values in milli-fils rather than wire Money, deliberately: this is an EVIDENCE
        pack whose purpose is to reproduce what the ledger holds, and rounding it to fils here would
        make the digest attest to a rounded restatement rather than to the records themselves. The
        console reads its figures from `GET /back-office/billing/cost-periods/{period}`, which does
        emit Money.
      properties:
        schema_version: { type: string, example: "1" }
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        generated_at: { type: string, format: date-time }
        record_counts:
          type: object
          description: Row count per collection, so a truncated file is detectable without parsing it.
          additionalProperties: { type: integer, minimum: 0 }
        documents:
          type: array
          description: Provider cost documents with their parsed lines. Provider-fed text is redacted at ingest.
          items: { type: object, additionalProperties: true }
        reconciliations:
          type: array
          items: { type: object, additionalProperties: true }
        diff_lines:
          type: array
          items: { type: object, additionalProperties: true }
        closes:
          type: array
          description: The four-eyes period close, when the period has closed. At most one per period.
          items: { type: object, additionalProperties: true }
        dispatches:
          type: array
          description: The append-only AP dispatch state log. One row per state per instruction.
          items: { type: object, additionalProperties: true }
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Canonical SHA-256 over this pack's body, excluding this field. BARE hex, deliberately
            unlike the `sha256:`-prefixed form used by `TppCostDocument.document_sha256` and the
            other billing artefacts; pinned by pattern so it cannot be silently "harmonised" to the
            prefixed convention, which would break every recipient's recomputation. Recomputable by the
            recipient — that is what makes the pack evidence rather than a report.
    InvoiceRun:
      type: object
      properties:
        invoice_run_id: { type: string, format: uuid }
        billing_period: { type: string }
        record_set_id: { type: string, format: uuid }
        status: { type: string, enum: [pending_approval, approved, dispatched_to_p9, partially_settled, settled, rejected] }
        approval_id: { type: string, format: uuid, nullable: true }
        invoices: { type: array, items: { $ref: '#/components/schemas/InvoiceInstruction' } }
        withheld_line_count: { type: integer, description: Disputed lines excluded from this cycle }
        net_settlement_offset:
          nullable: true
          description: Amount netted where the bank also owes Nebras fees as TPP-of-record (negative = owed)
          allOf: [ { $ref: '#/components/schemas/Money' } ]
    InvoiceInstruction:
      type: object
      properties:
        organisation_id: { type: string }
        financial_system_ref: { type: string }
        line_items: { type: array, items: { type: object, additionalProperties: true } }
        total: { $ref: '#/components/schemas/Money' }
        invoice_status: { type: string, enum: [instructed, issued, settled, overdue, credit_noted] }
        credit_note_refs: { type: array, items: { type: string }, description: Issued on post-invoice break resolution }
    TrustFrameworkRole:
      type: string
      enum: [org_admin, pbc, ptc, stc]
      description: >
        Bank Trust Framework directory roles (BACKOFFICE-74): Org Admin, Primary Business
        Contact (PBC), Primary Technical Contact (PTC), Senior Technical Contact (STC).
    TncStatus:
      type: string
      enum: [not_started, sent, signed, expired]
      description: Individual or organisational T&C / DocuSign status.
    TrustFrameworkParticipantCreate:
      type: object
      required: [role, organisation_id, holder_ref, holder_display_name]
      properties:
        role: { $ref: '#/components/schemas/TrustFrameworkRole' }
        organisation_id: { type: string, description: The bank's Trust Framework OrganisationId }
        holder_ref: { type: string, description: Internal id of the role-holder }
        holder_display_name: { type: string, description: Internal role-holder name (operational, not PSU PII) }
        onboarding_stage: { type: string, description: Current Interaction-Guide onboarding stage }
    TrustFrameworkParticipant:
      allOf:
        - $ref: '#/components/schemas/TrustFrameworkParticipantCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            individual_tnc_status: { $ref: '#/components/schemas/TncStatus' }
            organisational_tnc_status: { $ref: '#/components/schemas/TncStatus' }
            onboarding_stage_due_at: { type: string, format: date-time, nullable: true, description: SLA due time for the current onboarding stage }
            onboarding_stage_overdue: { type: boolean }
            status: { type: string, enum: [active, departing, vacant] }
            nominated_replacement_ref: { type: string, nullable: true, description: Set by the turnover workflow when the holder is departing }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ServiceDeskCaseType:
      type: string
      enum: [incident, billing_query, onboarding, general]
      description: Nebras service-desk case class (BACKOFFICE-79).
    ServiceDeskCasePriority:
      type: string
      enum: [P1, P2, P3, P4]
      description: Interaction-Guide priority; drives the applied SLA.
    ServiceDeskCaseStatus:
      type: string
      enum: [open, in_progress, awaiting_nebras, resolved, closed]
    ServiceDeskCaseCreate:
      type: object
      required: [nebras_case_reference, case_type, priority, summary]
      properties:
        nebras_case_reference: { type: string, description: Nebras service-desk case reference }
        case_type: { $ref: '#/components/schemas/ServiceDeskCaseType' }
        priority: { $ref: '#/components/schemas/ServiceDeskCasePriority' }
        summary: { type: string, description: Case summary (no PSU PII) }
        linked_break_id: { type: string, format: uuid, nullable: true, description: Originating reconciliation break, where one exists }
        linked_dispute_id: { type: string, format: uuid, nullable: true, description: Originating dispute, where one exists }
        linked_signal_id: { type: string, format: uuid, nullable: true, description: Originating risk signal, where one exists }
    ServiceDeskCase:
      allOf:
        - $ref: '#/components/schemas/ServiceDeskCaseCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/ServiceDeskCaseStatus' }
            sla_due_at: { type: string, format: date-time, description: Interaction-Guide SLA due time derived from priority }
            sla_overdue: { type: boolean }
            opened_by: { type: string }
            opened_at: { type: string, format: date-time }
            resolved_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }

    # ---------- Integration Readiness Wizard (ADR 0022) ----------
    ReadinessEffortBand:
      type: string
      enum: [low, medium, scoping]
      description: low = standard protocol/known adapter; medium = config-heavy (e.g. P6 mTLS); scoping = in-house/Other needs sizing
    ReadinessCatalogPortOption:
      type: object
      required: [value, label, effort_band]
      properties:
        value: { type: string }
        label: { type: string }
        effort_band: { $ref: '#/components/schemas/ReadinessEffortBand' }
    ReadinessCatalogPort:
      type: object
      required: [id, name, maps_to, options]
      properties:
        id: { type: string, description: Port id P1..P9 }
        name: { type: string }
        maps_to: { type: string, description: What the bank system behind this port does }
        optional: { type: boolean, description: True for ports a bank may decline (e.g. P8) }
        options:
          type: array
          items: { $ref: '#/components/schemas/ReadinessCatalogPortOption' }
    ReadinessCatalogDecision:
      type: object
      required: [id, title, default, impact]
      properties:
        id: { type: string, description: Decision id BD-01..BD-16 }
        title: { type: string }
        default: { type: string, description: The product's pre-set default answer }
        impact: { type: string }
        blocks: { type: string, nullable: true, description: Milestone/story this decision blocks if unresolved }
    ReadinessCatalog:
      type: object
      required: [ports, decisions]
      properties:
        ports:
          type: array
          items: { $ref: '#/components/schemas/ReadinessCatalogPort' }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/ReadinessCatalogDecision' }
    ReadinessAssessmentInput:
      type: object
      required: [ports]
      properties:
        ports:
          type: object
          description: Map of port id (P1..P9) to the chosen option value
          additionalProperties: { type: string }
        decisions:
          type: object
          description: Map of decision id (BD-01..BD-16) to the chosen answer; omitted = default
          additionalProperties: { type: string }
    ReadinessPortResult:
      type: object
      required: [id, name, chosen_system, adapter_status, contract_test_gate, effort_band, config_keys]
      properties:
        id: { type: string }
        name: { type: string }
        chosen_system: { type: string }
        adapter_status: { type: string, enum: [sim_ready, enterprise_reference, enterprise_to_write], description: 'sim_ready = built-in / declined (no integration work); enterprise_reference = a reference enterprise adapter ships (ADR 0023/0024), so the remaining work is config + the per-bank production cutover (M6); enterprise_to_write = no reference adapter exists yet (none today)' }
        contract_test_gate: { type: string, description: The port-swap acceptance test suite this adapter must pass }
        effort_band: { $ref: '#/components/schemas/ReadinessEffortBand' }
        config_keys:
          type: array
          items: { type: string }
    ReadinessGovernanceResult:
      type: object
      required: [id, title, answer, is_default]
      properties:
        id: { type: string }
        title: { type: string }
        answer: { type: string }
        is_default: { type: boolean }
        blocker: { type: string, nullable: true }
    ReadinessDigest:
      type: object
      required: [score, verdict, ports, governance, generated_profile, already_done, sequencing]
      properties:
        score: { type: integer, minimum: 0, maximum: 100, description: Deterministic readiness score }
        verdict: { type: string }
        ports:
          type: array
          items: { $ref: '#/components/schemas/ReadinessPortResult' }
        governance:
          type: array
          items: { $ref: '#/components/schemas/ReadinessGovernanceResult' }
        generated_profile:
          type: object
          description: A pre-populated enterprise Bank Profile skeleton (tfvars-shaped key/value)
          additionalProperties: { type: string }
        already_done:
          type: object
          description: What the product already ships, to frame the remaining work as bounded
          properties:
            sim_adapters_ready: { type: integer }
            ports_total: { type: integer }
            note: { type: string }
        sequencing:
          type: array
          description: Suggested M6 port-swap order with the bank's specifics filled in
          items:
            type: object
            required: [step, port, system, action]
            properties:
              step: { type: integer }
              port: { type: string }
              system: { type: string }
              action: { type: string }
    ReadinessProfile:
      type: object
      required: [slug, name, created_at, input, digest]
      properties:
        slug: { type: string, description: Unguessable share token }
        name: { type: string }
        created_at: { type: string, format: date-time }
        input: { $ref: '#/components/schemas/ReadinessAssessmentInput' }
        digest: { $ref: '#/components/schemas/ReadinessDigest' }
    MaturityMilestone:
      type: object
      required: [id, title, status, detail]
      properties:
        id: { type: string, description: Milestone id M0..M6 }
        title: { type: string }
        status: { type: string, enum: [done, remaining] }
        detail: { type: string }
    MaturityPort:
      type: object
      required: [id, name, sim_status, enterprise_status, contract_test_gate]
      properties:
        id: { type: string, description: Port id P1..P9 }
        name: { type: string }
        sim_status: { type: string, enum: [ready], description: Demo-profile adapter — ships today }
        enterprise_status: { type: string, enum: [stub, ready], description: 'Enterprise adapter — ''ready'' means a reference adapter ships and swaps via config (ADR 0023/0024); the per-bank production cutover is M6' }
        contract_test_gate: { type: string, description: The acceptance suite both adapters must pass }
    MaturitySummary:
      type: object
      required: [milestones, ports, summary]
      properties:
        milestones:
          type: array
          items: { $ref: '#/components/schemas/MaturityMilestone' }
        ports:
          type: array
          items: { $ref: '#/components/schemas/MaturityPort' }
        summary:
          type: object
          required: [milestones_total, milestones_done, ports_total, sim_adapters_ready, enterprise_adapters_remaining]
          properties:
            milestones_total: { type: integer }
            milestones_done: { type: integer }
            ports_total: { type: integer }
            sim_adapters_ready: { type: integer }
            enterprise_adapters_remaining: { type: integer }
            note: { type: string }
