  /back-office/billing/tpp-cost-documents:
    post:
      tags: [tpp-billing]
      summary: Ingest a provider cost document — Nebras invoice primary (verified manual upload, BILL-14)
      description: >
        The payable-side twin of the billing-records ingest (BACKOFFICE-73), for what the bank owes
        as TPP-of-record rather than what it is owed as an LFI (ADR 0007). Same verified-manual-upload
        posture as BACKOFFICE-67: integrity SHA-256 computed and stored, BCBS 239 lineage emitted,
        second-person verification recorded.


        Read `verified_by` for exactly what it is. The UPLOADER is taken from the caller's verified
        identity-provider claim and is never accepted from the request body. The VERIFIER is
        operator-attested: `verified_by` is a request field naming the second person, checked against
        the uploader's own subject and refused when equal. That establishes DISTINCTNESS between the
        two names — it does not establish that the verifier authenticated, and an uploader can name a
        colleague who never saw the document.


        This paragraph previously asserted that neither name came from the request body, which
        contradicted this operation's own `verified_by` form field twenty-four lines below and
        described a control the service does not implement. Ratified as operator attestation rather
        than silently corrected: a real second-person authenticated step belongs on the existing
        four-eyes primitive (`202` + `approval_request`, initiator ≠ approver, 2-hour expiry), not on
        a second mechanism invented here. Raise a story if the bank wants that stronger posture.


        Provider payloads are redacted at parse time, before the first INSERT: the cost tables are
        INSERT-only with no deletion path, so any customer detail a provider line carries would be
        unremovable. Lines whose provider category has no fee-class mapping are stored flagged
        `mapped: false` rather than dropped.


        Replay of the same `Idempotency-Key` returns the stored result. The same issuer and document
        reference carrying different content is a conflict, not a second document.
      x-rate-limit-per-min: 20
      x-required-scope: billing:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, document_type, billing_period, verified_by]
              properties:
                file: { type: string, format: binary }
                document_type:
                  allOf: [{ $ref: '#/components/schemas/TppCostDocumentType' }]
                  description: >
                    The taxonomy is declared in full, but a type is only ingestible once a transport is
                    wired behind the parser adapter. Today that is `nebras_tax_invoice` only — the
                    Nebras invoice is primary (IG §10.2). The other five are accepted vocabulary for
                    the ledger and are refused at ingest with
                    `BACKOFFICE.UNSUPPORTED_DOCUMENT_TYPE` until their transport lands.
                billing_period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                verified_by:
                  type: string
                  description: >
                    The second person who verified this upload. Checked against the caller's own
                    verified subject claim and refused when equal — it selects the verifier, it does
                    not assert one.
                source_note: { type: string, description: e.g. email received date / sender }
      responses:
        '201':
          description: Document ingested with its parsed lines; reconciliation NOT yet run (BILL-15)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TppCostDocument' }
        '200':
          description: >
            The document was already ingested, so nothing new was written. Reached when the same
            issuer and document reference arrive again with identical content — including under a new
            `Idempotency-Key`. A replay of the SAME key returns the original cached response, status
            included, so a repeated first-ingest replays its `201`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TppCostDocument' }
        '409':
          description: >
            Rejected for one of three reasons: the same issuer and document reference already exists
            carrying different content (a provider restatement, not a replay); the nominated verifier
            is the uploader; or the supplied `Idempotency-Key` was already used for a DIFFERENT
            document, in which case answering with either one would be wrong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/billing/tpp-cost-documents/{document_id}:reconcile:
    post:
      tags: [tpp-billing]
      summary: Three-way reconcile a provider cost document against own metering (BILL-15)
      description: >
        The payable twin of `/back-office/billing-records/{record_set_id}:reconcile`, and it carries
        the same scope for the same reason: judging a counterparty's figures against our own is one
        capability regardless of which direction the money flows.


        Matches own metering against the expected statement and the provider document at the invoice
        category grain, under a configurable tolerance — expected values are milli-fils and documents
        state fils, so exact equality is never the test. Every difference becomes exactly one break:
        an expectation and a document line disagreeing on the counterparty produce a single
        `wrong_recipient` rather than a missing plus an unexpected charge, and a charge appearing on
        both the Nebras invoice and an LFI self-invoice is a `duplicate_charge` rather than a second
        cost. IG §10.17 late-payment penalties are accepted only against a recorded late payment for
        the same period.


        Runs synchronously and returns the result, unlike the billing-records twin: this compares
        stored evidence rather than fetching from the Hub, so there is nothing to wait on. The
        response carries the IG §10.13 query deadline and the Nebras response clocks, because a break
        found outside the window is not actionable and the caller must see that with the finding.


        Reconciling is not approving. Unresolved breaks withhold the period from payable approval
        (BILL-16); this endpoint records what was found and never settles it.
      x-rate-limit-per-min: 20
      x-required-scope: finance:reconciliation:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >
            Reconciliation complete. Returned for both a first run and a replay of the same
            reconciliation run, which writes nothing further — the ledger is INSERT-only with no
            deletion path, so a retried scheduled job must not double it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TppCostReconciliation' }
        '404':
          description: No such cost document for this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: >
            No expected cost statement exists for the document's billing period, so there is nothing
            to reconcile against. Refused rather than reported as an all-unexpected-charges result,
            which would look like a provider fault when it is a missing projection on our side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }


  /back-office/billing/cost-periods/{period}:
    get:
      tags: [tpp-billing]
      summary: TPP cost-period state — close, payables and what is blocking them (BILL-16)
      description: >
        The payable side of a billing period in one read: whether the period has closed, which
        four-eyes approval closed it, the payables it authorises, and the unresolved breaks that
        are holding it open.


        `close_state` is DERIVED, never stored as a workflow column. `closed` means a second finance
        principal approved the close and the row exists; `blocked` means no close exists and
        `open_break_count` is above zero, so a close would be refused; `open` means neither.


        `closed` takes PRECEDENCE over `blocked`: a break raised after a period closed is real and
        stays visible in `blockers`, but it cannot un-close the period, and reporting `blocked` there
        would present history as a live refusal. What stops a break raised BEFORE approval slipping
        through is the re-check at close execution, not this field. There is no `pending_approval` value because a requested close
        lives on the approvals queue, not here — a period with an outstanding request is still
        `open`, and `GET /back-office/approvals/pending` is where that request is visible.
      x-rate-limit-per-min: 60
      x-required-scope: billing:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - name: period
          in: path
          required: true
          description: Cost period as YYYY-MM.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-07" }
      responses:
        '200':
          description: Cost-period state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TppCostPeriod' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/billing/cost-periods/{period}:close:
    post:
      tags: [tpp-billing]
      summary: Request the four-eyes close of a TPP cost period (BILL-16)
      description: >
        Never closes inline. Returns `202` with an `approval_request`, and the close executes only
        when a SECOND finance principal approves it — the binding four-eyes rule, on the existing
        approvals primitive rather than a second close mechanism.


        Refused with `409` while the period carries unresolved material payable breaks. That refusal
        is what makes BILL-15's reconciliation load-bearing rather than advisory: without it a
        disputed line reaches an approved payable and gets paid. The check runs again at execution,
        because approval is a separate act up to two business hours later and a break raised in
        between must still stop the close.


        The close is a gated PRECONDITION feeding the existing BACKOFFICE-06 monthly sign-off. It is
        not a sign-off of its own, and it does not dispatch anything — honouring the scheme direct
        debit is a separate, separately-authorised act.
      x-rate-limit-per-min: 10
      x-required-scope: finance:reconciliation:write
      x-four-eyes: true
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - name: period
          in: path
          required: true
          description: Cost period as YYYY-MM.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-07" }
      responses:
        '202': { $ref: '#/components/responses/ApprovalPending' }
        '409':
          description: >
            The period carries unresolved material payable breaks, or it is already closed. Both are
            refusals rather than no-ops: closing over an open break would approve a disputed line,
            and re-closing a closed period would mint a second four-eyes record for one act.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }

  /back-office/billing/payables/{payable_id}:dispatch:
    post:
      tags: [tpp-billing]
      summary: Hand an approved payable to the financial system (BILL-16)
      description: >
        Authorises HONOURING a scheme direct debit; it does not push a payment. IG v5.0 §10.14–10.15
        makes collection a scheme-operated pull — the DDA is presented to the Nebras sponsoring bank
        on the 10th and collected by the 30th — so P9's role is mandate management plus matching the
        pulled debit to the approved payable.


        The four-eyes period close is a hard precondition, and the cited approval is re-verified here
        rather than trusted: it must be `approved`, for THIS payable's own period, granted inside its
        two-business-hour window, and by two distinct principals. The caller must be one of those two
        — an approval authorises the people who made it, not everyone who can read its id.


        `Idempotency-Key` is required and is never generated server-side: a generated key would make
        every retry a new dispatch, which is exactly how one debit gets authorised twice. The key is
        stored as a digest, not in the clear.
      x-rate-limit-per-min: 10
      x-required-scope: finance:reconciliation:write
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/superAdminJustification'
        - name: payable_id
          in: path
          required: true
          description: The reconciliation whose accepted payable is being dispatched.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >
            Dispatched, or replayed. Either way no second debit is authorised.


            `replayed` reports what happened DOWNSTREAM — that the financial system matched an
            existing instruction, or that our own append-only ledger already held this dispatch. It
            is not an HTTP-level flag: retrying with the SAME `Idempotency-Key` replays the original
            response body verbatim, per the idempotency convention, so `replayed` on that response
            carries whatever it said the first time. To observe the downstream flag flip, the caller
            must send a fresh key for the same payable — which is exactly the case where the ledger
            or P9 recognises the instruction and refuses to double it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TppCostPayableDispatch' }
        '403':
          description: >
            The caller took no part in the four-eyes approval being cited, so it does not authorise
            them to honour this debit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: No such payable for this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: >
            The payable has no live four-eyes approval — absent, expired, approved late, rejected,
            for another period, or evidencing one principal twice — or the dispatch state being
            recorded does not legally follow the one already on file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }


  /back-office/billing/tpp-cost-export:
    get:
      tags: [tpp-billing]
      summary: Governed TPP cost evidence pack for one period (BILL-17)
      description: >
        Every payable artefact for one cost period as ONE downloadable pack: the provider documents
        and their parsed lines, the reconciliations, the diff lines, the four-eyes period close, and
        the AP dispatch log. Separate from `GET /back-office/billing/export`, which is the TENANT
        portability export (statements, statement lines, re-ratings) — that one answers "give me my
        data if I leave", this one answers "show me the evidence behind this month's payable".


        `sha256` is a canonical digest over the pack's own body, so a recipient can recompute it and
        prove the file was not edited after issue. The digest covers the body only, never itself.


        Audited as a governed export on every call, because reading the whole evidence base for a
        period is a disclosure event whether or not anything is wrong with it. Tenant-scoped by row
        level security; the pack can only ever contain the caller's own bank.


        PSU-free by construction for every schema-constrained column: the payable ledger references
        metering event ids rather than customers. The provider-fed free-form columns
        (`parsed_payload`, `response_payload`) are a narrower claim and are stated as one — they are
        redacted at ingest by a redactor keyed on field names and identifier shapes, and scrubbed
        AGAIN at this read boundary, because that redactor is heuristic and its own documentation
        records the residual risk of a bare account number under an unrecognised key. Two heuristic
        passes are not a proof; the count of anything the second pass removed is written to the audit
        trail so a leak is investigable rather than invisible.


        `raw_document_ref` is deliberately EXCLUDED from the pack. It addresses the raw-artifact
        archive, which holds unredacted provider originals by design, and the evidence of what was
        charged is the parsed lines — not a pointer to the scan.
      x-rate-limit-per-min: 10
      x-required-scope: billing:read
      parameters:
        - $ref: '#/components/parameters/fapiInteractionId'
        - name: period
          in: query
          required: true
          description: Cost period as YYYY-MM.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-07" }
      responses:
        '200':
          description: The evidence pack. Empty collections where the period produced no such artefact.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TppCostEvidenceExport' }
        '400':
          description: The period is absent or not YYYY-MM.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }

