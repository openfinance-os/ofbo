      - id: BILL-12
        title: Expected TPP cost statement + payable rate-model corrections
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        adr: docs/adrs/0007-tpp-of-record-payables-net-settlement.md
        depends_on: [BILL-11]
        note: >-
          BLOCKING PRE-TASK: pull a live Trust Framework directory snapshot, confirm the
          OverLimitFees unit (published per CALL; the house model prices per page/100 lines),
          record the decision in ADR 0007, and re-verify the pricing schedule against live
          Nebras sources. Then buildExpectedTppCostStatement(rating, rateEvidence,
          generatedAt): aggregate payable_hub/payable_lfi lines by recipient type+org,
          fee class, product family, API family, segment, period, tenant, internal
          product/cost centre; totals net of VAT with Nebras / LFI-payment / LFI-data kept
          separate; evidence chain = meter run, event ids, FAPI ids, rate-card version and
          a rate-snapshot hash chained to the pricing-doc version + directory snapshot.
          Recipient-dimensioned effective-dated data-overage rates from directory snapshots
          (BILL-01 watch + P6 syncDirectory); mirror-pricing retained only for
          scheme-uniform fees. Fix the two confirmed projection defects - outbound
          corporate data must rate as data.corporate_page (40 fils/page, no free tier;
          metering.ts:316-325) and profitability must expose underlying-LFI cost as its own
          external-cost line (profitability.ts:88).
        outcome: >-
          Landed 2026-08-17. buildExpectedTppCostStatement + resolveLfiOverageRate (snapshot-level
          REQUIRED unit, effective-dated, absent/expired/zero = charges nothing, provenance on every
          resolution); rating prices payable retail overage from the snapshot and FAILS CLOSED
          without one; both defects fixed (outbound corporate -> data.corporate_page with no free
          tier; profitability lfiCostMilliFils as its own external cost, subtracted from profit,
          surfaced on the wire as lfi_cost_milli_fils and as a Finance View stat).
          Two hazards found by adversarial review and fixed in-branch: (1) meter runs dedupe on
          (bank_id, period, rate_card_version, input_hash) which cannot see a projection change, so
          METERING_PROJECTION_VERSION is now bound into the hash - otherwise the corporate fix would
          have been a silent no-op on every already-metered period; (2) the new fail-closed throw
          would have bricked three receivable-only projections (revenue assurance, expected memo,
          closed-period re-rating) that never read payable lines - they now rate via
          receivableMeteredLines, with a regression test.
          The free-tier granularity question surfaced during review is now explicit rate-card data
          (RetailFreeTierGranularity) defaulting to the conservative psu_per_day rather than a silent
          per-LFI reinterpretation that would have understated the payable.
          NOT closed: the OverLimitFees unit pre-task - the egress policy denies
          data.directory.openfinance.ae so no live snapshot could be observed; recorded on ADR 0007.
          DEFERRED with reasons: no P6 directory producer or demo snapshot (would encode the
          unconfirmed unit) and no synthetic outbound data events, so the statement is domain-tested
          but not yet demonstrable end-to-end - BILL-13 persists statements and seeds them once the
          unit is known. Evidence: 34 new tests; unit suite 1413/1413; monorepo typecheck + ESLint
          clean; coverage gate exit 0.
        acceptance:
          - The OverLimitFees unit decision is recorded in ADR 0007 from a live snapshot
            before the statement model merges.
          - Statements are deterministic and reproducible from immutable inputs; every line
            traces to meter run + events + rate snapshot; the three cost totals stay
            separate.
          - Outbound corporate data rates at the corporate page rate (test red before the
            fix); profitability shows Hub and underlying-LFI cost as separate lines.
          - An LFI with absent/empty OverLimitFees yields zero overage cost; per-LFI rates
            are effective-dated and snapshot-evidenced.
      - id: BILL-13
        title: Durable payable ledger + closed-period re-rating
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        adr: docs/adrs/0007-tpp-of-record-payables-net-settlement.md
        depends_on: [BILL-12]
        note: >-
          Eight append-only tenant-RLS tables mirroring the 0032/0033 control block -
          billing_tpp_cost_statement/_line, _document/_line, _reconciliation, _diff_line,
          _ap_dispatch, _rerating: FORCE RLS, SELECT+INSERT-only app permissions,
          TPP-domain classification (ADR 0006), 24-month/5-year retention, BCBS 239
          lineage, canonical SHA-256 evidence hashes, tenant-export integration, no silent
          overwrite. No PSU identifiers anywhere - lines reference event_ids (psu_id stays
          confined to billing_event); no per-customer daily buckets are persisted, so no
          derived customer key exists. Statement generation rides the existing meter-run
          trigger path (idempotent, resumable, sleep-tolerant demo) - no new jobs runner.
          billing_tpp_cost_rerating mirrors billing_period_rerating: closed-period
          corrections replay into immutable delta statements, never mutation.
        outcome: >-
          Landed 2026-08-17. Migration 0039 creates all eight tables with the 0032/0033 control
          posture (RLS ENABLED+FORCED, SELECT+INSERT only for ofbo_app, group-scoped internal-view
          reads, 24/60 retention and confidential-restricted floors) and no PSU column anywhere.
          The schema is self-reconciling: a statement's three streams must sum to its net total,
          gross must equal net+VAT on statements and lines, every line must carry an event id, a
          rerating delta must equal corrected minus previous, and AP dispatch is unique per
          (idempotency key, dispatch state) - which bounds each state to one row per instruction,
          so an instruction cannot be recorded as dispatched twice, but does NOT by itself make
          double payment impossible and constrains no transition order. Not double-paying rests on
          BILL-16 dispatching once under the key plus P9's own idempotency. An earlier draft of this
          entry claimed uniqueness per idempotency key alone; that overstated the constraint.
          PgBillingTppCostStore writes the three tables this story owns, idempotent on (meter run,
          rate card version, rate snapshot hash) so a corrected directory rate becomes a NEW
          immutable statement rather than an overwrite; it refuses a rerating unless both statements
          project the same meter run (a different run is a re-meter, not a re-rate). tppCostLineRef
          derives line identity from cost dimensions, which is what BILL-15 will match documents on.
          Generation rides the existing monthly billing trigger beside the receivable expected-memo
          projection - no new scheduler. It SKIPS with an audited reason rather than throwing when a
          chargeable overage line cannot be priced, so the fail-closed pricing refusal inherited from
          BILL-12 cannot take the regulated receivable projections down with it. The payable dataset
          now travels with the tenant portable export.
          Five tables (documents, document lines, reconciliation, diff lines, AP dispatch) are
          created but unwritten until BILL-14/15/16; they stay empty, which the Q4.5 gate skips, so
          nothing may seed them ahead of their story.
          NOT closed: the OverLimitFees unit criterion below - the egress policy still denies
          data.directory.openfinance.ae. It is enforced structurally rather than procedurally: rating
          fails closed, so a statement carrying chargeable overage cannot be produced at all without
          a snapshot stating its unit, and the criterion carries forward to BILL-14.
          Evidence: unit 1421/1421; integration 162/162 across 77 files on a pristine PostgreSQL
          16.13; Q4.5 lineage gate PASSED with the three written tables covered, allowed gaps none;
          typecheck, ESLint and the coverage gate clean.
        acceptance:
          - The OverLimitFees unit is confirmed from a live directory snapshot and recorded in
            ADR 0007 BEFORE statements are persisted. Carried forward from BILL-12, whose egress
            policy denied the directory host; persisting a statement priced on an unconfirmed unit
            is what this criterion exists to prevent.
          - RLS isolation and INSERT-only proven by denial tests across all eight tables;
            the derived Q4.5 lineage gate covers them with no KNOWN_LINEAGE_GAPS additions.
          - Re-rating a closed period yields previous/corrected/delta statements with
            metered facts provably unchanged (fingerprint equality).
          - Tenant export includes the payable dataset; no psu column exists in any
            billing_tpp_cost_* table (schema assertion).
      - id: BILL-14
        title: Provider-document ingestion (Nebras-primary taxonomy)
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        adr: docs/adrs/0007-tpp-of-record-payables-net-settlement.md
        depends_on: [BILL-13]
        note: >-
          POST /back-office/billing/tpp-cost-documents mirrors the billing-records
          verified-manual-upload pattern (BACKOFFICE-67/-73): multipart, integrity SHA-256,
          second-person verification, lineage, Idempotency-Key, super-admin justification.
          Document taxonomy per ADR 0007 D9 (IG v5.0 section 10): monthly Nebras Tax
          Invoice PRIMARY - it may carry BOTH cost components (Hub fees + LFI charges,
          IG 10.2), though the 10.9 sample shows Hub sections only, so ingestion accepts
          both layouts; the summarized supporting data (IG 10.3.4/10.18) is stored as an
          evidence artifact; underlying-LFI self-invoicing documents secondary;
          credit/debit notes; Finance-approved manual adjustments. Header validation:
          invoice number, billing period, TPP+Nebras TRNs, currency (AED), due date.
          VAT parse is split per ADR 0007 D4: Hub-fee sections are VAT-EXCLUSIVE with
          Taxable/VAT 5%/Gross columns (IG 10.9 sample); LFI-charge amounts are
          VAT-inclusive (5/105). Line categories parse against a maintained Nebras
          category -> fee-class mapping (Service Initiation: Corporate Payment / Payment
          Initiation / Payment Data; Data Sharing: Bank Data Sharing / Corporate Data /
          Balance (Discounted) / CoP (Discounted) / Setup and Consent / Insurance Data
          Sharing / Insurance Quote Sharing). Identical duplicate returns the prior
          result; same reference with different content conflicts (409). Raw document
          retained with parsed-vs-raw linkage. Missing-document alarm anchored to the
          scheme billing calendar (IG 10.12.3: invoice/memo due on/before the 5th, next
          business day if weekend/holiday) raised via P3 ITSM + ops signal - IG 10.12.2
          makes reporting non-receipt the participant's OBLIGATION, so the alarm is a
          compliance control. Parsing sits behind an adapter so a scheme/enterprise
          transport can be added later. The first real Nebras tax invoice closes BD-20.
        acceptance:
          - Idempotent replay and same-ref-different-content conflict both proven; raw
            document is immutable and hash-linked to parsed lines.
          - An IG-10.9-shaped tax invoice (Service Initiation + Data Sharing sections,
            Taxable/VAT/Gross columns) parses with per-line net/VAT/gross reconstructing
            the section subtotals and invoice total; a document carrying an LFI-charges
            component parses its VAT-inclusive amounts via 5/105.
          - Every parsed line resolves through the category->fee-class mapping or is
            flagged unmapped (never silently dropped).
          - The absence alarm fires through P3 when no invoice has arrived by the
            configured calendar anchor (the 5th by default) and not before.
          - BLOCKING, inherited from BILL-13's migration 0039 — raw_document_ref and
            parsed_payload are provider-fed free-form columns in an INSERT-only family with
            NO deletion path, so any PSU detail a Nebras invoice line carries into them is
            unremovable. Redaction MUST happen at parse/ingest time, before the first
            INSERT, and MUST be asserted by a test that feeds a document containing
            payment-level customer detail and greps the persisted row for it. The schema
            cannot enforce this; BILL-13 deliberately withheld the cross-tenant
            bank_internal_view SELECT grant on billing_tpp_cost_document until it exists.
            Granting that read is part of THIS story only once redaction is proven.
          - verified_by and verified_at (migration 0039) are NOT NULL but bound to nothing —
            denormalised second-person-verification evidence, the same weakness the AP-dispatch
            principal columns carry. This story owns making them correspond to the principal
            who actually performed the verified-manual-upload check, stamped from the P2
            subject claim and never from operator-supplied input, and must refuse an upload
            whose verifier equals its uploader.
        outcome: >-
          POST /back-office/billing/tpp-cost-documents added spec-first (94 paths). Parsing lives in
          packages/billing/src/tpp-cost-document.ts behind TppCostDocumentParser so a PDF/EDI/API
          transport can be added without touching the ingest service. VAT is split by STREAM per ADR
          0007 D4 - Hub sections VAT-exclusive (+5% on the stated net), underlying-LFI sections
          VAT-inclusive (5/105 carved out of the stated gross) - and gross is always computed as
          net+vat so the three reconcile exactly under half-up rounding. Document totals are DERIVED
          from the lines and then checked against the provider's own; a disagreement is refused rather
          than silently resolved in either direction. The category map is versioned DATA, and
          deliberately PARTIAL - five categories map to fee classes we already price, and four are
          knowingly unmapped: Balance (Discounted) and CoP (Discounted) because the IG 10.9 sample
          carries a unit anomaly BD-20 must resolve, Payment Data and Setup and Consent because no
          current fee class corresponds without inventing scheme semantics. Unmapped lines persist with
          mapped=false and fee_class NULL, tied together by the schema CHECK. Redaction happens at
          PARSE time, before anything can be persisted, keyed on field NAMES and on identifier SHAPES
          (so a real value the redactor has never seen is still caught), with the store re-checking at
          the boundary that makes a write permanent. Two redaction bugs were found by that
          double-check rather than in review: the redactor was not idempotent (re-running flagged
          already-redacted keys, so the boundary check rejected correct writes), and a generic
          long-digit-run rule plus an unanchored phone pattern were both redacting the 15-digit TRNs
          that IG 10.9 REQUIRES in the header - business identifiers must survive redaction, and the
          residual risk of an account number under an unrecognised key is now stated rather than
          papered over with a heuristic that destroys required evidence. Migration 0040 grants the
          cross-tenant internal-view read on billing_tpp_cost_document that BILL-13 deliberately
          withheld, now that redaction is proven against a persisted row; ap_dispatch stays withheld
          for BILL-16 on the same terms. verified_by is bound to the caller's verified P2 claim and an
          upload nominating its own uploader as verifier is refused (409) - which proves DISTINCTNESS,
          not that the verifier authenticated, and the code says so rather than over-claiming. The
          absence alarm anchors on the 5th of the following month, moving off a weekend, fires only
          once the anchor has passed, and treats a credit note as not-an-invoice. Evidence: unit
          1455/1455, integration 179/179 across 78 files on a pristine PostgreSQL 16.13, Q4.5 PASSED
          with both document tables covered and allowed gaps none, typecheck 0, ESLint clean,
          doc-link-check clean (the anti-drift gate caught a stale README path count), Q1b no
          weakening detected. STILL OPEN and inherited: the directory OverLimitFees unit remains
          unconfirmed because the egress policy still denies data.directory.openfinance.ae - rating
          stays fail-closed - and BD-20 still needs the first REAL Nebras invoice, which is also what
          resolves the four unmapped categories.
      - id: BILL-15
        title: Three-way payable reconciliation + dispute-window management
        status: in_progress
        research: docs/research/lfi-billing-system-tier2.md
        adr: docs/adrs/0007-tpp-of-record-payables-net-settlement.md
        depends_on: [BILL-14]
        note: >-
          Own outbound metering <-> expected statement <-> provider document, matched at
          the INVOICE CATEGORY grain (Nebras line categories -> fee classes via the
          BILL-14 mapping, our line-level evidence beneath) under an explicit configurable
          tolerance defaulting to the fils(1) pattern (expected values are milli-fils,
          documents arrive in fils/AED - never exact equality). Match keys per category:
          period, recipient, units, applied rate, amount, VAT, rate effective date. The
          Nebras invoice reconciles both cost components first; LFI self-invoices
          reconcile as the secondary path; a charge on both sources is itself a
          duplicate_charge break. IG 10.17 late-payment penalty fees are a distinct
          charge class - expected only when a late payment actually occurred, otherwise
          an unexpected-charge break. Variances become standard E1 reconciliation_break
          records (quantity, rate, unexpected, missing, wrong recipient, duplicate, VAT,
          period, unmatched either side) carrying expected/actual, absolute+percent
          variance, owner, reason code, dispute deadline, resolution evidence, approval
          history. The dispute window is scheme-published (IG v5.0 10.13): submit within
          30 CALENDAR days of occurrence (config; BD-21 confirms the anchor), and the
          workflow also tracks Nebras response clocks - first response 10 min, final
          response 10 days, respondent review & escalation 15 days. Billing-query
          evidence bundles carry the IG 10.11.3 required fields (invoice number,
          interaction ID, timestamp, LFI/TPP names, payment/transaction detail).
          POST .../tpp-cost-documents/{id}:reconcile requires finance:reconciliation:write,
          mirroring billing-records:reconcile. Disputed lines are withheld from payable
          approval (mirror of reconcile-before-invoice); Finance+Ops alerted as unresolved
          breaks approach window expiry.
        acceptance:
          - Overcharge, missing charge, and VAT mismatch each produce the correct break
            class with line-level evidence; a difference inside the tolerance produces
            none.
          - A penalty line without a matching late payment raises an unexpected-charge
            break; with one, it matches clean.
          - A disputed line cannot reach an approved payable (blocked path tested end to
            end).
          - The expiry alert fires as the configured window closes and the Nebras
            final-response/escalation clocks are visible on each open query; window
            length is config, not a constant.
          - A generated billing-query bundle contains every IG 10.11.3 required field.
          - BLOCKING, inherited from BILL-13's migration 0039 - billing_tpp_cost_diff_line
            carries a ten-value break_type CHECK and a reconciliation_break_id that has NO
            foreign key. This story owns both. It MUST (a) decide how payable break_type maps
            onto the contract's LineType, because GET /back-office/reconciliation/breaks
            classifies by line_type (six values) and declares no break_type, so an unmapped
            payable break is not representable on the endpoint that is supposed to show it;
            (b) constrain reconciliation_break_id before writing it - a tenant-composite FK
            needs a new UNIQUE (bank_id, id) on reconciliation_break plus an ON DELETE decision
            for a regulated record, which is why BILL-13 deferred rather than added it; and
            (c) reconcile variance shape - ReconciliationBreak.variance_amount is a Money
            object while billing_tpp_cost_diff_line stores variance_milli_fils bare, so this
            depends on the milli-fils decision recorded on BILL-17.
        progress: >-
          Criteria 1, 2, 4, 5 and 6(a)+(b) built. reconcilePayable (packages/billing/
          tpp-cost-reconciliation.ts) matches at (costRecipientType, costRecipientId, feeClass)
          under DEFAULT_PAYABLE_TOLERANCE_MILLI_FILS = fils(1), discriminating quantity ->
          rate -> VAT in that precedence (units first because a rate argument built on the
          wrong volume wastes the 10.13 window). wrong_recipient pairs an expectation and a
          document line into ONE break and REFUSES to guess when two candidates share a fee
          class. duplicate_charge is detected across documents only (within one document a
          provider may legitimately split a category over rows) and its amount counts toward
          actualTotalNetMilliFils - it is money genuinely billed. unmatched_expected_line
          distinguishes OUR mapping gap (a fee class the Hub could never name) from their
          omission, so it is never queried with them. 6(b) landed as migration 0041:
          UNIQUE (bank_id, id) on reconciliation_break + composite FK, ON DELETE deliberately
          absent (NO ACTION = refuse) because CASCADE would propagate a delete into the
          payables ledger and SET NULL would sever the audit trail while reporting success;
          MATCH SIMPLE keeps the reference optional. 6(a) maps break_type -> LineType by cost
          RECIPIENT (nebras -> nebras_fees, underlying_lfi -> lfi_access_log); break_type is a
          guard that throws on an unknown value rather than a routing input, and
          payment_settlement is deliberately unused because it means money movement, not fee
          liability. buildBillingQueryBundle refuses three ways - missing 10.11.3 field, closed
          window, identifier-shaped transaction detail (reusing BILL-14's refusal guard rather
          than adding a second redaction path). Three self-found defects fixed with tests: an
          off-period document anchored the query deadline a month early; a duplicated charge
          reported netVariance 0; the wrong_recipient pairing guessed among candidates.
          STILL OPEN - criterion 3 (a disputed line cannot reach an APPROVED payable) is
          half-built: openPayableBreaks() is the gate query and is tested tenant-scoped, but
          the refusal it feeds lives in BILL-16, so the end-to-end blocked path cannot be
          tested until BILL-16 lands. Criterion 6(c) remains BLOCKED on the money-unit
          decision (BILL-17); diff lines still store variance_milli_fils bare and no
          Money-shaped variance is written.
      - id: BILL-16
        title: Payable accounting + four-eyes close + P9 AP dispatch + net settlement
        status: pending
        research: docs/research/lfi-billing-system-tier2.md
        adr: docs/adrs/0007-tpp-of-record-payables-net-settlement.md
        depends_on: [BILL-15]
        note: >-
          Journal sources nebras_hub_payable, lfi_payment_fee_payable, lfi_data_fee_payable,
          payable_credit_note, payable_variance join the existing net_settlement. Lifecycle
          per ADR 0007 D4: accrual net of VAT (Dr OF external cost / Cr accrued payable);
          acceptance reverses the accrual, books Dr Input VAT receivable per the tax
          invoice, Dr/Cr cost variance, Cr accounts payable gross; settlement clears AP
          against scheme clearing/cash. Four-eyes (202 + approval_request, 2-business-hour
          expiry) before close, material-variance acceptance (existing configurable
          threshold mechanism - no new materiality config), P9 dispatch, manual adjustment,
          net-settlement authorisation. Cost-period close is a gated precondition feeding
          the existing BACKOFFICE-06 monthly sign-off - no parallel close mechanism.
          Collection is the scheme's DIRECT-DEBIT PULL (IG v5.0 10.14-10.15: TPPs must pay
          by direct debit; DDA presented to the Nebras sponsoring bank on the 10th,
          collection window to the 30th, LFI transfers 30th-5th) - the four-eyes AP
          approval authorises honouring the debit, and P9's execution role is DD mandate
          management plus matching the pulled debit to the approved payable, not push
          payment. Dual-role netting is scheme-confirmed (IG 10.16: amounts payable to
          LFIs are netted against fees owed to Nebras where the LFI also operates as a
          TPP). P9 port extension: dispatchPayableInstruction + a payable-status method on
          FinancialSystemPort, sim adapter + fail-closed enterprise financial-system
          adapter, port contract tests binding BOTH through the HARNESS-10 bench (a new
          port method cannot skip the gate). Net settlement decomposes gross receivables
          minus Nebras costs minus underlying-LFI costs plus approved adjustments;
          unexplained residue posts to suspense AND raises an E1 break (new wiring from
          accounting.ts:164).
        acceptance:
          - Every journal balances (property test including the VAT leg); the accrual
            reverses exactly on acceptance.
          - Close is refused (409) while unresolved material breaks exist; approved close
            feeds the monthly sign-off.
          - The port contract suite runs the new methods green on BOTH adapters, including
            a rejection/downstream-failure case; dispatch is idempotent, retry-safe,
            audited, and cannot mutate billing evidence.
          - The residue scenario produces the suspense line AND a reconciliation break.
          - BLOCKING, inherited from BILL-13's migration 0039 — three obligations the
            schema provably CANNOT carry, each to be enforced in this story's write path
            and proven by test. (a) The cited approval_request must be in state 'approved'
            and its expires_at must not have passed when approved (2-hour adopting-bank
            default, PRD section 10) — the foreign key constrains tenant and existence only,
            because state and expiry are mutable on the referenced row. (b) initiated_by
            and approved_by MUST both be stamped from the same normalised P2 subject claim,
            never from operator-supplied input — the CHECK compares strings
            case-insensitively and cannot detect one human under two identifier forms. They
            MUST ALSO equal the cited approval_request's own initiator and approver — they
            are denormalised evidence copies, and nothing in the schema binds them to the
            row they cite, so without this check the recorded four-eyes evidence can name
            two people who had nothing to do with the approval actually referenced.
            (c) response_payload is a provider-fed free-form column in an INSERT-only family
            with no deletion path; redact P9 responses before the first INSERT, asserted by
            test, and only then consider the cross-tenant bank_internal_view SELECT grant
            that BILL-13 deliberately withheld on billing_tpp_cost_ap_dispatch.
          - Dispatch state advances by APPENDING a row, never by UPDATE — the table is
            INSERT-only with UNIQUE (bank_id, idempotency_key, dispatch_state). The schema
            does not constrain transition ORDER, so this story owns rejecting an illegal
            sequence (e.g. accepted after rejected) at write time.
      - id: BILL-17
        title: TPP Cost Management console + governed exports + demo scenarios + hosted smoke
        status: pending
        research: docs/research/lfi-billing-system-tier2.md
        adr: docs/adrs/0007-tpp-of-record-payables-net-settlement.md
        depends_on: [BILL-16]
        note: >-
          Stitch-first (binding): generate the TPP Cost Management screens in the Stitch
          project before implementation, cite screen ids in the PR, token-only styling,
          DEMO banner, persona scope-gating. ONE IA pass adds the section to the billing
          console AND renames the /tpp-billing nav entry (e.g. LFI Revenue & TPP Registry)
          without breaking its API paths. KPIs: expected total/Nebras/LFI cost, documents
          received, variance, unresolved breaks, dispute-window days remaining, AP and
          settlement status. Breakdowns: by underlying LFI, internal product, cost centre,
          API family, Hub vs LFI, payment vs data fees, expected vs actual, month-on-month
          (cost-per-journey deferred - no journey definition exists). Workflows: statement
          -> metered evidence -> upload -> parse review -> reconcile -> investigate ->
          assign -> dispute evidence -> variance approve/reject -> close -> AP approval ->
          governed export. Server-side auth + download proxies (no tokens or export
          payloads in browser storage). Deterministic demo scenarios per the ADR 0007
          evidence list, including: paired discount limited to one Balance AND one CoP per
          payment, corporate 40 fils/page no free tier, per-LFI effective-dated overage,
          insurance producing no payable_lfi, chargeable refund GET, exactly-once
          duplicates, credit note, VAT mismatch, absence alarm, dispute-deadline alert,
          dual-role settlement with residue break, RLS denial, lineage gate, recomputable
          export digest. Hosted smoke asserts the TPP cost totals and independently
          recomputes the exported evidence digest.
        acceptance:
          - Stitch screen ids cited in the PR; screens are token-only with the DEMO banner
            and scope gating; the nav rename ships in the same pass.
          - The full scenario suite is green, including the paired-discount limit and
            per-LFI overage effective-dating.
          - Hosted smoke recomputes the export digest independently; a11y and browser E2E
            pass.
          - BLOCKING, a forward obligation from BILL-13's migration 0039 — nine state and
            reason vocabularies are already hard-committed as CHECK constraints in an
            INSERT-only, no-deletion-path family with NO counterpart in the OpenAPI
            (cost_recipient_type, fee_stream, customer_segment, vat_treatment, document_type,
            query_window_status, break_type, presence, dispatch_state). This story owns the
            endpoints that first expose them, so its schemas MUST mirror those sets exactly,
            or the spec-change workflow must land first. The values are expensive to move once
            rows exist, so a divergence discovered here is a spec-change PR, never a widened
            CHECK.
          - BLOCKING - this story cannot emit a spec-conformant Money object per LINE without
            a decision on the open milli-fils question, and must not invent one. Precise
            position, measured - the spec's Money schema (specs/backoffice-openapi.yaml:3028)
            states the binding rule verbatim and cites CLAUDE.md - integer minor units, "fils
            for AED" - so the spec and CLAUDE.md AGREE; the outliers are two bare
            *_milli_fils integer fields at spec:2926-2927 plus roughly thirty milli-fils
            columns added by migration 0039. Separately, only billing_tpp_cost_statement and
            _document carry a currency column at all (0039:69,156), so the line-level tables
            (_statement_line, _diff_line, _ap_dispatch, _rerating) hold amounts with no
            currency and a conformant per-line Money requires joining the parent - and on
            _rerating "the parent" is not singular, because it carries TWO statement foreign
            keys (previous_statement_id and corrected_statement_id, 0039:371-372), so that
            story must decide which one denominates a delta rather than assume one exists. Two viable
            resolutions, both needing a human - convert milli-fils to Money at the wire
            boundary and keep the finer precision in storage only (nothing requires storage
            precision to equal wire precision, and this leaves Money as declared), or ratify
            milli-fils - which means amending BOTH CLAUDE.md and the Money schema description,
            not just adding an ADR.

  # Dual-role Chinese wall enforcement (ADR 0006, accepted 2026-08-17) — E4-class substrate.
  - name: SEGREGATION
    items:
      - id: SEG-01
        title: Role-domain wall enforcement (scope guard + RLS predicate + cross_domain_access audit)
        status: blocked
        reason: >-
          Awaiting BD-22 - the platform-wide role-domain taxonomy (personas + non-billing
          data classes) is a bank decision. The billing-family taxonomy is already decided
          in ADR 0006 and rides BILL-13..16 as classification tags; this item is the
          enforcement build and must not start before the taxonomy is signed off.
        adr: docs/adrs/0006-lfi-tpp-data-segregation.md
        note: >-
          ADR 0006 Option 1: role_domain (LFI | TPP | shared) threaded through the persona
          scope matrix (role-domain guard beside the BACKOFFICE-43 scope check, both
          layers), RLS predicates on role-owned tables, BACKOFFICE-54 classification, and a
          High-class cross_domain_access audit event on any permitted cross-domain read.
          Raises the full BACKOFFICE requirement + PRD section-2 amendment when it
          unblocks. Tests-first; shared classes (scheme reference data, rate cards,
          settlement/sign-off aggregates) must remain readable by both domains -
          over-walling is a failure mode, not a safety margin.
          Known call site to revisit, surfaced by the BILL-13 hard-stop review: the tenant portable
          export (packages/db/src/tenant-billing-service-store.ts) now returns the TPP-domain payable
          ledger alongside the LFI-domain receivable ledger in ONE artifact behind a single
          billing:read check. Acceptable today - PRD section 2 puts TPP cost management in the Finance
          Analyst's remit and the export is RLS-scoped to the caller's own bank_id - but it is the
          first place one read crosses the wall, so it needs the cross_domain_access seam.
        acceptance:
          - A TPP-domain principal cannot invoke LFI-domain reads/writes and vice versa,
            enforced at middleware AND service layer, proven by denial tests.
          - Role-owned tables carry the RLS role-domain predicate; shared tables provably
            remain dual-readable.
          - Any permitted cross-domain access emits cross_domain_access with full
            attribution; the event appears in the audit trail.

  # Build-harness improvements — the machinery that governs the autonomous build loop itself
  # (not a product feature). Researched against 2025-26 agentic-coding practice; ADR 0019 (01-04), ADR 0020 (05).
  - name: HARNESS
    items:
      - { id: HARNESS-01, title: "Anti-reward-hacking: test-tripwire hook + Q1b test-integrity gate", status: done, adr: docs/adrs/0019-build-harness-hardening.md, note: ".claude/hooks/test-tripwire.sh (advisory) + scripts/test-integrity.mjs (CI Q1b, merge-blocking) stop the loop making a RED test green by weakening it. Exempts *-testfix-*/*-spec-* branches." }
      - { id: HARNESS-02, title: "Contract self-correction: pnpm verify:contract agent tool", status: done, adr: docs/adrs/0019-build-harness-hardening.md, note: "services/bff/scripts/verify-contract.ts validates live BFF responses against the OpenAPI each iteration (28 probes, CONFORMANT/DRIFT). Wired into run-ofbo/smoke.sh + skill. Specmatic self-correcting-loop pattern." }
      - { id: HARNESS-03, title: "Agent provenance sealed into the release evidence bundle", status: done, adr: docs/adrs/0019-build-harness-hardening.md, note: "parseProvenance over git trailers (model/session/story) → BuildProvenance, folded into the sha256-sealed bundle. EU AI Act Art. 12/17 traceability." }
      - { id: HARNESS-04, title: "Mutation testing gate (StrykerJS) on the security-critical BFF core", status: done, adr: docs/adrs/0021-mutation-testing-security-core.md, depends_on: [HARNESS-01], note: "StrykerJS + vitest-runner scoped to rbac/auth/approvals (DB-free vitest.mutation.config.ts). Calibrated against a real run: 70.3% baseline (8m34s), break=65 floor (ratchets up). .github/workflows/mutation.yml runs weekly + on-demand + on PRs touching the security core (NOT a universal per-PR gate — too slow). Survivor backlog = ConditionalExpression/Regex in the four-eyes core. ADR 0021." }
      - { id: HARNESS-05, title: "Documentation-drift gate: doc->file reference + ADR-number check", status: done, adr: docs/adrs/0020-documentation-drift-gate.md, note: "scripts/doc-link-check.mjs + CI Q2b (pnpm docs:check) fail on a current-state doc referencing a non-existent file, or two ADRs sharing a number (the 0018 collision). Excludes the historical build-log. implement-story DoD gains a 'update cited docs on file move' line." }
      - { id: HARNESS-06, title: "ADR number reservation: cross-PR collision check (Q2c)", status: done, adr: docs/adrs/0020-documentation-drift-gate.md, depends_on: [HARNESS-05], note: "scripts/adr-number-check.mjs + CI Q2c close the race HARNESS-05's intra-tree check cannot see: two branches each adding a DIFFERENT NNNN-*.md are both green until the second merges (ADR 0018 during PR #250; ADR 0027 on 2026-07-22). Two checks — BASE (offline: a number this branch adds must not already exist on the base ref, catching the stale-branch case) and PEER (GitHub API: not claimed by an OPEN PR opened earlier). Tie-break is first-opened-keeps-it, so exactly ONE side of a collision fails. API unavailability soft-skips (a merge gate must not flake); a real collision hard-fails. Own job, not a Q2b step, so an unrelated failure cannot skip it." }
      - { id: HARNESS-11, title: "Q4.5 lineage gate derives its regulated surface (retire the hand-listed 17 tables)", status: done, note: "validateLineageCoverage checked a HARDCODED 17-table literal while ofbo_app can INSERT into 26 — so every table added since the literal was written (str_draft, service_desk_case, trust_framework_participant, respondent_dispute, fraud_incident, scheme_notification, ...) was invisible to the BCBS 239 gate while it still printed PASSED (improvement-plan audit §2.3). The surface is now DERIVED from information_schema.role_table_grants — the same in-house pattern registry-coverage.int.spec.ts uses for retention/classification — minus a new NON_REGULATED_TABLES set carrying a standing justification per entry (lineage_events: the sink itself, self-referential; idempotency_key: the schema's sole deletion path, already retention-exempt; readiness_profile: ADR 0022 public wizard, explicitly non-regulated + PII-free). NON_REGULATED_TABLES is deliberately distinct from KNOWN_LINEAGE_GAPS (permanent exclusion vs pending gap awaiting a story); KNOWN_LINEAGE_GAPS stays empty. Measured on one CI-equivalent run (fresh db, apply+seed+test:integration): covered 9 -> 23 tables, 0 gaps, gate still PASSES. Tests: 4 new in lineage.int.spec.ts — set equality against the live privilege catalogue, justified-exclusions, strict superset of the retired literal, and an anti-vacuous-pass probe that grants ofbo_app INSERT on a synthetic table, writes a row, and asserts the gate DETECTS the gap and returns ok:false (proving the widened gate can still fail). A future migration's regulated table is covered with no code change." }
      - { id: HARNESS-10, title: "Make the M6 port-swap acceptance gate executable (enterprise adapters bind the port contract)", status: done, note: "CLAUDE.md promises an enterprise adapter must pass EXACTLY the tests the simulator passes - the port-swap acceptance gate. That gate was inert: describePortContract was literally typed profile: 'demo', only ever invoked for 'demo', and the trailing comment invited re-enabling enterprise per port, which would not have worked (no config, no transport, and demo-specific assertions). Enterprise adapters were covered only by their own specs plus a fail-closed check (improvement-plan audit §2.2). Now: describePortContract(profile, get) takes an adapter RESOLVER, so the same 20 assertions drive both profiles, and test/fixtures/enterprise-harness.ts builds all ten enterprise adapters from Bank-Profile-shaped config with a routed fake vendor transport (payloads reused from each adapter's own spec so the bench cannot assert a shape the adapter does not parse). Result: 44 passing / 1 skipped, with 16 contract assertions now binding the ENTERPRISE adapters through their real request-build -> transport -> parse -> map path. Honest boundary, stated in code: this is ADR 0024 rung 2 (no live tenant); auth, residency and real payload drift remain the rung 4 M6 mile. The single demo-only expectation (nine seeded personas with demo tokens) is skipped rather than faked - a real IdP does not expose them - and replaced by an explicit enterprise-side assertion that personas derive from configured mapping and NO demo token is issued. Two gate-guards: the bench must cover every PORT_NAMES entry (a new port cannot silently skip the gate) and the anti-vacuous-pass check - injecting a 6000ms revoke ack and a bogus IPP status turns the enterprise run RED on exactly those two tests, proving the gate can fail. Verified: unit 1226 pass/1 skip (coverage 95.5%), lint + typecheck clean." }
      - { id: HARNESS-13, title: "Ratchet the mutation floor to the measured baseline + on-demand full-matrix CI run", status: done, note: "Two controls that could decay unnoticed (improvement-plan audit §2.5 and §2.7). (a) RATCHET: stryker break was 65 against a 70.3% baseline - five points of slack, so the mutation gate could lose a lot of ground before failing. Re-measured 2026-08-06 over 493 mutants: 71.20% (351 killed / 116 survived) on vitest 2 and 70.99% (350/117) on vitest 3 after the HARNESS-12 bump - a ONE-mutant delta, so ~0.2pp is the observed noise floor. break raised 65 -> 70, about one point (~5 mutants) of headroom: absorbs noise, fails on real decay. Confirmed the gate still exits 0 at break=70 by a full local run. (b) DISPATCH: ci.yml had no workflow_dispatch, so the full-matrix re-verification the audit asked for (eleven stories carry 'Merged on local gates' from the July Actions billing outage) could not be launched on demand. Added. Q1b is the one gate that CANNOT run on a dispatch - it diffs against a PR merge base - so instead of being filtered out of the run it now RUNS and reports NOT RUN, with a job-summary note stating it is not a pass. A full-matrix run that silently omits a gate is exactly the HARNESS-07 bug. Guard: scripts/test/mutation-ratchet-check.test.mjs (in the discovery-gates harness glob) asserts break stays within 1.5pp of the measured baseline and never above it, that workflow_dispatch survives, and that Q1b still both runs on PRs and announces itself on dispatch. Verified the guard bites: lowering break to 60 fails it with the baseline named." }
      - { id: CODE-01, title: "Shared cursor/keyset pagination for packages/db (retire 16 hand-rolled copies)", status: done, note: "improvement-plan audit §4. The copies were NOT identical — auditing all 16 turned up three real divergences, and the third is why this was worth doing carefully rather than mechanically. (1) DIRECTION: 9 stores page ascending (>), 7 descending (< with ORDER BY DESC). (2) TIE-BREAK COLUMN: tpp_counterparty keys on organisation_id (TEXT) and must NOT take the ::uuid cast every other store uses — a hardcoded helper would have broken it at runtime. (3) PARAMETER INDEXING: 15 stores push binds FIRST then reference $${params.length - 1}/$${params.length}; consent-events builds the clause BEFORE pushing and uses $${params.length + 1}/$${params.length + 2} because its prefix is variable-length. Both correct in place, neither survives being pasted into the other, and the failure mode is SILENT — SQL that still parses and runs but binds the wrong parameters in a regulated read path. So packages/db/src/keyset.ts exposes no convention at all: keysetClause(params, after, opts) appends its own binds and derives the placeholders from the push it just made, so callers cannot do the arithmetic wrong because callers no longer do it. Also keysetOrderBy (kept beside the predicate so a store cannot page one way and sort the other) and paginate (limit+1 probe -> trimmed rows + next cursor). Net -141 LOC across 16 files; zero hand-rolled keyset arithmetic remains. COVERAGE was the real risk: only 2 integration specs mentioned a cursor and none walked a multi-page sequence. Added packages/db/test/keyset.spec.ts (15 unit tests incl. both param conventions, the text-key no-cast path, and the DESC-on-both-key-parts rule) and packages/db/test/keyset-pagination.int.spec.ts (4 live tests walking consent-events ASC over a variable-length prefix and tpp_counterparty over a TEXT key, asserting every row is served exactly once and paging terminates). Anti-vacuous-pass verified: injecting an off-by-one into the shared param index — the exact bug a naive dedup would have introduced — turns BOTH paging tests red, then green on revert. Verified: integration 140/140 on a pristine DB (69 files), unit 1224/1224 (coverage 95.5%), lint + typecheck clean, Q4.5 lineage gate PASSED." }
      - { id: CODE-02, title: "Move the 27 InMemory* stores out of production source (services/bff/memory/)", status: done, note: "improvement-plan audit 4: 27 in-memory store classes sat interleaved with the production service logic they back - reconciliation/service.ts alone carried three of them in its last 150 lines on top of a 900-line service - and they counted against the Q1 coverage denominator, which HARNESS-09 scopes to services/bff/src/**. MEASURED FIRST, because the obvious assumption was wrong: the stores are the WORST branch-covered code in the BFF (286/358 = 79.9%, below both the 80 floor and the 81.71 file-wide average), so removing them from the denominator RAISES branches rather than lowering it. That mattered - branches had only 1.71pp of headroom (2502/3062), and arithmetic on the gate showed at most ~262 fully-covered branches could be removed before it went red. Actual after the move: branches 81.71 -> 82.00 (+0.29pp, headroom 1.71 -> 2.00pp), statements 95.61 -> 95.65, functions 97.48 -> 97.90; gate exits 0. NOT named testing/ or fixtures/: these ARE production for the demo profile (app.ts falls back to them whenever a durable store is not injected, i.e. whenever DATABASE_URL is absent), and a test-implying name would misdescribe code serving real demo traffic - services/bff/memory/ with a README stating exactly that. Each store is RE-EXPORTED from the module declaring its interface, so the public surface is unchanged and the ~55 test files that pull a service and its store from one import are untouched - Q1b reports no test files changed. Imports from memory/ back into src/ are strictly type-only, so there is no runtime cycle; the four store-only VALUES the classes needed (encodeAgentCursor, decodeAgentCursor, str encodeCursor, newSlug, QueryPurposeRegistrarError) were each verified to have no other user across src/test/apps/packages/scripts and moved with their store. Net: 24 production files, -893/+146 lines; reconciliation/service.ts 1068 -> 929. Verified: unit 1241/1241, integration 144/144 on a PRISTINE db, lint + typecheck + build clean. Aside found while verifying: pnpm db:seed is NOT idempotent - re-seeding an already-seeded database inflates row counts and reds 5 assertions in packages/db/test/seed-demo.int.spec.ts; CI never sees it because every run starts fresh. Not fixed here." }
      - { id: CODE-03, title: "Repo-wide pass: audit scope_used labels that name no declared scope", status: pending, note: "Surfaced by consecutive BILL contract/hard-stop reviews and finally ticketed, because a repo-wide decision with no owner is how drift survives. MEASURED inventory (verified against specs/backoffice-openapi.yaml, not estimated) - SIX undeclared tokens across FOURTEEN scope_used emissions: billing:rate x4 (billing/memo-reconciliation.ts:151,232 pre-existing on main; billing/tpp-cost.ts:119,133 added by BILL-13), billing:post x3 (billing/accounting.ts:95,108,118 via BILLING_POST_SCOPE), reconciliation:run x3 (reconciliation/service.ts:288,346,504), billing:assure x2 (billing/revenue-assurance.ts:79,94 via BILLING_ASSURANCE_SCOPE), billing:reconcile x1 (billing/memo-reconciliation.ts:195), billing:collect x1 (billing/collections.ts:121). The spec declares billing:read (10), billing:write (4) and platform:operations:read (8); all six above return ZERO occurrences. IMPORTANT SCOPING FACT, checked so the next agent does not have to: none of the six is ever passed to assertScope or any middleware - BILLING_POST_SCOPE and BILLING_ASSURANCE_SCOPE are exported constants but are referenced ONLY as scope_used audit values. So NO privilege is granted anywhere and this is not an authorisation defect; it is an audit-trail resolvability defect, where audit_high_sensitivity names a scope an auditor cannot resolve against the contract. AuditEvent.scope_used is an unconstrained string in the spec, so nothing is literally contradicted either - the drift is against the declared scope inventory. Decide ONE of: (a) declare the scheduled-job scope vocabulary in the spec, (b) stamp the persona/system scope that actually authorised the run, or (c) add a distinct non-scope field for system actors and stop overloading scope_used. Then apply it to all fourteen sites in one pass and add a check that a scope_used value resolves against the declared inventory, so the next one cannot land silently. BILL-13 declined to half-fix its two sites because fixing 2 of 14 makes the trail less consistent, not more. SECOND FIELD, same class, fold into the same pass - response_status is an HTTP-shaped audit field filled by actors that issue no HTTP response. services/bff/src/billing/tpp-cost.ts:122,135 stamp 200 from a scheduled monthly job, and :122 stamps 200 on a path that reports a SKIP rather than a success, which is wrong on its own terms. Not isolated - 20 response_status occurrences exist across services/bff/src/billing with mixed values (200, 201). AuditEvent.response_status is an unconstrained integer in the spec with no description, so the contract does not say what a non-HTTP actor should record, which is precisely why it wants one decision applied everywhere rather than per-story guesses. Decide the convention for headless emitters (omit the field, a sentinel, or an explicit outcome field) alongside the scope_used decision above." }
      - { id: HARNESS-12, title: "Dependency currency: Renovate + clear the advisory backlog (incl. the vitest critical)", status: done, note: "Nothing watched dependencies: main went red 22-26 Jul on advisories published while no commit changed, and Q4 broke again 2026-08-04 the same way (improvement-plan audit §2.6). Two halves. (a) CLEARED the backlog 41 -> 11 advisories, 1 critical + 17 high -> ZERO: vitest 2.1.9 -> 3.2.7 fixes GHSA-5xrq-8626-4rwp (critical, UI server arbitrary file read/exec; stryker's vitest-runner peer is >=2.0.0 so it rides along), jsdom ^25 -> ^30 in BOTH root and apps/portal (the portal kept its own pin, which is why the ws advisory survived the first pass), and dev-tree override floors for brace-expansion (RANGED per major — minimatch 3/9/10 put three incompatible lines in one tree), js-yaml, undici, vite, ws. overridesNote now separates PRODUCTION floors (what Q4's --prod audit gates) from DEV-TREE floors (not gated, but these tools run in CI holding a token). Also aligned the @hono/node-server skew (nebras-sim ^1.13.7 -> ^2.0.4, matching bff). vitest 3.2 deprecates workspace files (removed in 4), so projects moved from vitest.workspace.ts into vitest.config.ts's test.projects — retiring the split that forced coverage config to live apart from the projects it gates. (b) renovate.json so this stops being manual: weekly window, security PRs immediate and exempt from the major-approval gate, majors + toolchain (pnpm/node/typescript/stryker) behind dependencyDashboardApproval, pnpm.overrides explicitly NOT managed (they are justified floors to remove by hand). NO AUTOMERGE anywhere — HG-0001 makes non-self-merge a governance control and a bot merging its own PR reopens exactly that hole. Verified: unit 1209/1209 (coverage 95.6%), integration 136/136 on a fresh DB, lint + typecheck + pnpm build clean, prod audit exit 0. vitest 3 -> 4 left as a future chore." }
      - { id: HARNESS-14, title: "Deploy smoke gate: assert the security property, not the redirect transport", status: done, note: "The deploy pipeline's Smoke job had been RED since 2026-07-26 - twelve days, eight merges, nobody acting on it - on a portal that was behaving correctly. tests/smoke/portal.smoke.spec.ts asserted status >= 300 for an unauthenticated /dashboard, but Next expresses redirect() two ways: a 3xx + Location when nothing has been sent, or a 200 carrying <meta id=\"__next-page-redirect\" http-equiv=\"refresh\" content=\"1;url=/\"> once the <head> has flushed - which is what /dashboard does, being dynamic = force-dynamic. Reproduced on plain `next start` locally (NOT an OpenNext/Cloudflare difference): status 200, and the body contains ZERO shell - no app-shell, no sidebar, no audit panel - only the meta-refresh. requireSession() -> redirect('/') is working; the assertion was wrong about the transport. THE REAL DEFECT is what that cost: the gate asserted nothing about the response body, so a genuine leak (200 WITH the shell) produced the same red X as twelve days of correct behaviour - a control with no signal left in it, which is the HARNESS-07 class again (this time the check was visibly red rather than silently absent, and got ignored just as effectively). Fixed by asserting the SECURITY PROPERTY first and directly - the response must not contain data-testid=app-shell/sidebar/persona-badge/audit-panel - then accepting EITHER redirect form as the bounce. Strictly stronger: the old test made no body assertion at all. Anti-vacuous-pass proved on a stub server serving the three shapes (no production auth code touched): benign 200+meta-refresh PASSES, a leaked shell FAILS on app-shell, a 307 to the wrong target FAILS on the bounce check. Verified green against a real locally-built portal on next start." }
      - { id: HARNESS-15, title: "Release evidence: derive the Q4.5 verdict from the lineage proof, and re-verify the seal", status: done, note: "Found by dry-running the release-evidence pipeline, which had never executed (improvement-plan audit 2.4 asked for the first bundle; this is what the rehearsal turned up). TWO defects, one story, two commits. (a) THE Q4.5 GATE COULD NOT REPORT ITS OWN FAILURE: collect-gates.mjs wrote a hardcoded status 'pass' for Q4.5, and wrote it BEFORE the proof existed - the CLI collects live coverage from DATABASE_URL afterwards (cli.ts:55) - while buildEvidenceBundle copied lineage_proof through verbatim and validated only that all six gates were PRESENT, never that Q4.5 agreed with the evidence beneath it. Reproduced end to end: injecting gaps [audit_high_sensitivity, str_draft, fraud_incident] produced a SEALED bundle asserting 'Q4.5 | BCBS 239 lineage validation | pass' while the lineage section thirty lines below listed those three tables as gaps. Real gap count today is 0, so the first bundle would have been truthful - but the guard was inert, so it would have stayed silent exactly when a future migration added an uncovered regulated table, which is the one thing Q4.5 exists to catch. HARNESS-11 made the GATE self-maintaining; the evidence bundle still hardcoded its verdict. Fixed by deriving: gaps -> fail, covered-with-no-gaps -> pass, empty-with-no-gaps -> skipped (cli.ts records an empty proof when DATABASE_URL is unset, and 'no proof collected' must not read as 'the gate passed'). Every other gate is carried through untouched - CI step outcomes are the only witness those have. collect-gates.mjs keeps a Q4.5 entry for the completeness check but its placeholder is now 'skipped', so bypassing the derivation would understate the gate rather than assert one that never ran. (b) THE SEAL HAD NO READER: verifyEvidenceBundle was exported and unit-tested and called by nothing, so tampering was detectable but not detected. scripts/verify-bundle.ts is the caller, wired into release-evidence.yml BETWEEN assembling and committing, so a bundle whose digest does not recompute never reaches git; it takes paths, so the same command re-verifies bundles already under releases/. No-args is an error, not a vacuous pass. Tests: 10 new (5 derivation incl. an anti-vacuous-pass probe where an input explicitly claiming pass against a gapped proof must still come out fail; 5 driving the verifier script through its real exit codes) + 3 workflow guards in scripts/test/release-evidence-verify-check.test.mjs asserting the step exists AND precedes the commit. Verified the guards bite: moving the verify step after the commit reds the ordering assertion; the 4 derivation tests were red before the fix. Re-ran the full pipeline against a live DB after the fix: Q4.5 now reads 'pass | 23 regulated tables covered, no gaps' (was a hardcoded pass with a vague summary), the same gap injection now reads 'fail | lineage gaps (3): ...', and the verifier confirms the seal. Verified: unit 1251/1251, node --test scripts/test 19/19, lint + typecheck clean. NOT DONE HERE: cutting v0.1.0 itself - that publishes a release and commits releases/ to main, and is a human call." }
      - { id: HARNESS-16, title: "Run the two OFBO reviewers in CI as advisory PR checks (close the self-attestation gap)", status: in-progress, adr: docs/adrs/0029-ai-review-as-advisory-ci-check.md, note: "AI review already ran on every story - but only PRE-PR, inside the build agent's own session: next-story/SKILL.md:35 dispatches hard-stop-reviewer (must return VERDICT: PASS) and contract-conformance-reviewer (must return VERDICT: CONFORMANT), HG-0001 counts those verdicts toward the merge criteria, and build-log.md records them per story. THE GAP IS SELF-ATTESTATION, NOT ABSENCE: the agent runs its own reviewers, reports its own verdicts, and writes them into its own build log, with nothing in GitHub verifying the review ran or that the reported verdict matched what the reviewer said. Every other control here is enforced outside the agent's write scope (CODEOWNERS, the Q gates, branch protection); this one was not. Before this change CI contained no model-based review at all - Q4 is named 'security review' but is pnpm audit + semgrep p/secrets, and PRs #313/#311 carried zero reviews and zero comments. New .github/workflows/ai-review.yml: two independent check runs (fail-fast: false matrix - a failing hard-stop leg must never cancel contract-conformance, HARNESS-07 doctrine), own workflow file not a job in ci.yml (mutation.yml precedent: non-universal, cost-bearing, and the deterministic Q-gate file stays free of model calls), and deliberately NOT named Q* since that namespace means 'deterministic merge gate'. THE PROMPT POINTS AT .claude/agents/*.md RATHER THAN RESTATING THEM - inlining the checklists would create a second, unprotected copy of the canon free to drift from the one the pre-PR reviewers read, which is exactly what Q2b exists to catch. Red on FAIL/DRIFT but NOT a required status check, honouring HG-0001's 'AI reviewers remain as advisory PR checks' while refusing to show green next to a finding. THE LOAD-BEARING CASE IS THE THIRD ONE: a missing review file, a missing VERDICT: line, or a malformed one all report DID NOT COMPLETE and go red - a review that never ran must never be indistinguishable from a passing one. Verified the parse against 12 cases before wiring it: a review with no verdict, 'VERDICT: MAYBE', and 'VERDICT: PASS' appearing mid-prose all land on red; two verdict lines take the last. Fork PRs (GitHub withholds secrets) and an absent credential report NOT RUN + 'This is not a pass' via ::notice and step summary, mirroring q1b at ci.yml:67-78, without redding the job. Cost ~$1-2.50/PR for both reviewers on Opus 5, subscription-billed; paths-ignore keeps docs-only PRs free. NOT A CLAIM OF SEPARATION OF DUTIES - same model family reviewing the same agent's output, in a fresh session with no shared context; HG-0001 line 58 says 'AI reviewing AI is not four-eyes' and the human-merge requirement is untouched. Residency: HG-0011 Option 3 (provider proxy), permitted only while the environment is synthetic-only and non-prod (HG-0011:48) - must move at the M6 enterprise swap, and the OAuth token pins the job to the first-party API, so that swap is two changes not one (ADR 0029 records both). FOLLOW-UP (same story, on request): the ENGINE IS NOW A PORT rather than a hardcoded vendor - PRD 3 doctrine applied to CI. Contract is fixed and engine-agnostic (read the agent definition, diff against base, write a review whose last line is the VERDICT line) and THE VERDICT PARSE IS THE PORT CONTRACT TEST, binding every adapter identically - the same acceptance rule ADR 0024 sets for enterprise adapters. Engines are config (.github/ai-review.config.json): the single `active` key names the one engine that reviews, so EXACTLY ONE reviews by construction and no combination of entries can double the spend. Cross-checking two engines was considered and dropped (doubles cost for an advisory check); re-adding it is a matrix-builder change, not a flag. The failure mode engineered against is a HALF-ADDED engine - a registry entry with no adapter step would run, execute nothing, write no review, and surface as the generic DID NOT COMPLETE, a real non-review disguised as a transient failure; scripts/ai-review-matrix.mjs refuses to build such a matrix so the new config job fails loudly before a token is spent (proved end to end on a scratch tree: with-adapter exit 0, without-adapter exit 1 + ::error, two engines produce the cross product). Comment attribution moved OUT of the core into the registry, because attributing a Codex review to Claude Code would misstate which model produced the verdict. CORRECTION TO AN EARLIER REVISION OF THIS NOTE: parity was briefly modelled as a per-engine flag (requires_workflow_parity), true only for claude because claude-code-action enforces its own equivalent rule, and this note previously described the Codex adapter being able to review workflow-editing PRs as a capability. THAT WAS THE HOLE, WRITTEN UP AS A FEATURE. on: pull_request hands secrets to same-repo PRs while running the workflow file FROM THE PR HEAD, so pointing active at a CLI engine silently removed a security control. The flag is deleted; preflight now enforces parity for EVERY engine over the whole review control plane (the workflow, the registry, and scripts/ai-review-matrix.mjs - each can decide what the reviewer runs or which secret it is handed). Deliberate consequence: no engine reviews a PR that changes how reviews run, this harness included. NO repo-variable override by design: HG-0006 makes the model serving the review model configuration and HG-0002 puts that under control-plane-owners, so changing the reviewing model is a control-plane PR. 16 guard tests (36/36 in scripts/test) incl. assertions that the engine-agnostic core names no provider, that no per-engine parity flag survives, and that only a missing credential is a fatal non-run. Three engines registered, active is claude. CODEX HAS NOW RUN, AND DOES NOT WORK AS WRITTEN: it authenticated (model gpt-5.6-sol, 14,443 tokens) but its own sandbox is bubblewrap, which cannot create a network namespace in the Actions runner (bwrap: loopback: Failed RTM_NEWADDR) - that fails at sandbox SETUP so every mode including read-only dies with it, and no review file was written. The only mode that runs removes real containment against prompt injection carried in a reviewed diff, which is a SECURITY DECISION FOR A HUMAN and is NOT applied. Gemini is registered and never run. VERIFIED 2026-08-17 (PR #318): both reviewers ran end to end against a real diff - hard-stop VERDICT: PASS, contract-conformance VERDICT: CONFORMANT - closing the reviewing path as unproven. Still owed: the injected-violation self-test; a comment-only diff cannot show a reviewer CATCHES a violation, only that the path runs. FIELD EVIDENCE from BILL-13 (PR #319, 2026-08-17), which ran 13 review rounds and is the largest sample so far - the reviewers DO catch real defects a self-attesting agent had missed, including four on its own work (a resumability bug that would have failed the whole billing projection, a sha256-prefixed string that was not a digest, and THREE assertions that could not fail for the reason they claimed: a tenant-composite FK test tripping three FKs under one indiscriminate regex, a portable-export claim asserted nowhere, and a PSU-absence guard matching /psu/i against a fixture named psu-<uuid>). Notably all four surfaced in the reviewers' OBSERVATIONS or non-finding notes rather than in their verdicts, so a consumer reading only PASS/FAIL would have missed every one - worth weighing when this story decides how verdicts are surfaced. BUT the reliability hole is real and observed TWICE in one day: contract-conformance on c578dbe (~12:23Z) and hard-stop on 82956de (~13:12Z) both completed with 'the reviewer produced no review file', banner 'DID NOT COMPLETE - This is not a pass'. Because the check is advisory and non-gating, a reviewer that silently produces nothing looks identical to one that ran, which reopens exactly the self-attestation gap this story exists to close. The injected-violation self-test should therefore also assert the review FILE EXISTS, not only that the job exited." }
      - { id: HARNESS-07, title: "Un-shadow independent CI checks (a skipped security scan must not look like a passing one)", status: done, note: "Steps sharing a runner are sequential, so a failure skips every later step: Q4's audit failing skipped the semgrep SECRETS scan (it therefore did not run on main 22-26 Jul while the audit was red, with no red check to show for it), and Q2's lint failing skipped typecheck + the semgrep SAST. Independent checks now carry `if: ${{ !cancelled() && steps.install.outcome == 'success' }}` — gated on SETUP, not a bare !cancelled(), so a failed install does not spawn noise runs with no node_modules. Applied to Q4 secrets, Q2 typecheck + SAST, and the Discovery job's run-validation + waist gate (dependency-free, so plain !cancelled()). Kept as in-job guards rather than splitting into new jobs, which would strand any branch-protection rule pinned to the existing check-run names." }
      - { id: HARNESS-08, title: "ESLint ignores nested worktree checkouts", status: done, depends_on: [HARNESS-07], note: "CLAUDE.md rule 0 mandates building in an isolated worktree under .claude/worktrees/. That path is gitignored, but ESLint flat config does NOT read .gitignore, so a root `pnpm lint` scanned every parallel branch and reported ITS findings against paths in the current tree. Worst case it surfaced the DEPLOY_PROFILE no-restricted-syntax rule — which reads as a PRD 3.1 hard-stop violation that does not exist in the tree being linted. Invisible in CI (fresh checkout has no worktrees dir), so Q2 stayed green throughout while local lint was noisy. Adds '.claude/worktrees/**' to the ignores list, alongside the existing .remember/** scratch-dir precedent. Each worktree still lints itself; verified real code is still linted (no-explicit-any negative control)." }
      - { id: HARNESS-09, title: "CI-enforce the coverage gate (Q1 runs pnpm test:coverage)", status: done, note: "The 80% thresholds in vitest.config.ts (scoped to services/bff/src) were enforced by NO CI job — Q1 ran bare `pnpm test`, so the CLAUDE.md 'coverage >=80%' rule was a local convention, invisible to merge (found by the 2026-08 improvement-plan audit, docs/reviews/improvement-plan-2026-08.md §2.1). Q1 now runs `pnpm test:coverage`; measured baseline at flip time: 95.5% stmts / 81.7% branch / 97.5% fn / 95.5% lines over 1209 unit tests, so the gate went live with no ratchet needed. Guard test scripts/test/coverage-gate-check.test.mjs (runs in the discovery-gates job's harness glob) asserts BOTH facts — Q1 invokes test:coverage AND the four thresholds stay >=80 — so silently reverting the workflow or lowering the config re-reds CI: the absent-control-looks-like-a-passing-one class (HARNESS-07) closed for coverage." }

deferred: # Could / Phase 2 — not in build scope until promoted by the user
  # BACKOFFICE-60 and BACKOFFICE-53 fleshed out under ADR 0017 (agent-first MCP gateway,
  # services/mcp-gateway). ADR 0017 ACCEPTED 2026-06-23 — step-1 groundwork landed:
  # real MCP stdio transport (read-only), least-privilege agent personas with a
  # build-time subset invariant against the real SCOPE_MATRIX, and the spend-control
  # anomaly hook. Remaining: the DCR registration ENDPOINT is a new auth path → needs a
  # human-approved spec-change PR first (CLAUDE.md rule 6), so both stay deferred.
  - id: BACKOFFICE-60
    title: Programmatic admin-scope access for internal automation (DCR-registered agents)
    status: done
    priority: Could
    adr: docs/adrs/0017-agent-first-mcp-gateway.md
    progress: >-
      Contract merged (#241); BFF agent-registry implemented (#243): POST :register
      (four-eyes via ApprovalsService → 202), GET list/get, POST :revoke (single-actor
      kill switch); dedicated platform-admin persona (platform:agents:read/write only);
      scopes bound server-side from the AGENT_PERSONAS catalogue (no DCR scope escalation),
      never platform:superadmin; High-class audit on register/revoke. Durable path landed:
      migration 0027_agent_registry (RLS + retention 24/60 + classification), PgAgentStore
      with BCBS 239 lineage at write time (added to the Q4.5 gate table set), worker-wired.
      Gateway step-1 groundwork (#240). Hard-stop PASS + conformance CONFORMANT.
    remaining: >-
      Portal Agent Registry screen + registry-driven gateway both landed: the
      @ofbo/mcp-gateway now adopts a registered, four-eyes-APPROVED agent's bound identity
      (scopes, allow_mutations, spend_budget) from GET /back-office/agents/{id}
      (fetchAgentRegistration + sessionFromRegistration; demo:registry server proves the
      loop end to end). DoD met: contract, RBAC, four-eyes, audit, lineage, portal surface,
      agent-first loop. Production identity story now landed too (ADR 0018 Option 2): the
      gateway mints + presents a server-verified agent SESSION token (:mint-session), and the
      BFF verifies it as a first-class agent Principal — replacing the demo's borrowed
      derived_from human token. Full DCR client-credentials + mTLS (Option 1) is the M6 swap.
    blocked_on: none
    note: >-
      Gives a model/automation the same operations a human persona performs today,
      via the MCP gateway (services/mcp-gateway) over the existing OpenAPI contract.
      Adds NO new enforcement path — auth, RBAC, four-eyes, audit, lineage stay BFF-side.
    acceptance:
      - Agent identity is minted via Dynamic Client Registration (DCR); registration is itself
        a four-eyes-approved operation (202 + approval_request), human-ratified before the agent
        can authenticate.
      - Each agent binds to an agent persona whose scopes are a STRICT SUBSET of an existing
        human persona's scopes (SCOPE_MATRIX in services/bff/src/auth.ts) — least privilege;
        a superset is an automatic review FAIL.
      - Agent identities are service accounts and are REJECTED for platform-super-admin at
        sign-in (BACKOFFICE-80 already enforces isServiceAccountSubject) — no agent ever holds
        platform:superadmin.
      - Every agent tool call emits exactly one High-class audit event with acting_principal=agent,
        scope_used, and the propagated x-fapi-interaction-id; PII redacted at emission; zero PII in
        the agent's prompt/transcript/context store.
      - Four-eyes operations (fourEyes:true in ROUTES) return 202 to the agent and are ratified by
        a DIFFERENT, human principal — the agent never closes the approval loop (self-approval
        rejected at the service layer).
      - Mutating tools stay disabled until BACKOFFICE-53 (spend-control) is built; the initial
        enablement is read-only (fourEyes:false, *:read / audit:read scopes only).
      - The tool catalogue is generated from @ofbo/contracts ROUTES — contract drift surfaces as a
        catalogue diff (spec stays ground truth for the agent surface).
      - Idempotency-Key is sent on every mutating tool call (agents retry); replay within 24h
        returns the original result with no duplicate audit emit.
    depends_on: [BACKOFFICE-44, BACKOFFICE-45, BACKOFFICE-80]
  - id: BACKOFFICE-53
    title: Agentic spend-control for admin-scope MCP tools
    status: done
    priority: Could
    adr: docs/adrs/0017-agent-first-mcp-gateway.md
    progress: >-
      Gateway-side spend-control complete: SpendGuard caps per-session consequential ops
      (four-eyes counts at INITIATION) and blocks further mutations on exhaustion; budgets
      are per-agent-persona config (AGENT_PERSONAS spend_budget, default read-only). On
      threshold crossing BffBackedAnomalySink raises a REAL agent_anomaly Risk signal +
      P3 ITSM ticket — reusing the BACKOFFICE-80 auto-raise sinks, no PSU PII.
      BFF-SIDE re-assertion now done (ADR 0018 Option 2 accepted + built): an agent presents
      a server-verified session token (P2 mintAgentSession/verifyAgentSession), the BFF auth
      middleware builds a first-class agent Principal (agent_id + session_id), and a BFF
      spend-control middleware re-asserts allow_mutations (403) + per-(agent_id, session_id)
      budget (429), raising agent_anomaly Risk + ITSM BFF-side on exhaustion. Defence in
      depth holds: gateway pre-flight AND BFF re-assertion, the gateway never the sole guard.
      All criteria met. Tested at every layer (port round-trip, BFF middleware + integration,
      gateway loop incl. immediate revoke-kills-session).
    blocked_on: none
    note: >-
      Per-session blast-radius budget on consequential agent operations, mirroring the
      BACKOFFICE-80 per-session guardrail pattern. Bounds damage from a confused or
      adversarially-prompted agent.
    acceptance:
      - A per-session budget caps the count of consequential operations (initiated revokes,
        refunds, sign-offs, report/invoice runs) an agent may perform before it MUST escalate
        to a human; exceeding it blocks further mutations for the session.
      - Each session-budget threshold crossing raises a Risk signal (type agent_anomaly) and an
        informational ITSM ticket — the BACKOFFICE-80 auto-raise pattern, reused not reinvented.
      - Budgets are configured per agent persona (config, not code) and default to the most
        restrictive (read-only) until explicitly raised by a human.
      - Spend-control is enforced at the MCP gateway as a pre-flight check AND re-asserted by the
        BFF (defence in depth) — the gateway is never the sole guard.
      - Four-eyes operations count against the budget at INITIATION (the 202), not at approval.
    depends_on: [BACKOFFICE-60]
  - id: BACKOFFICE-59
    title: Training environment for Customer Care
    status: in-progress
    priority: Could
    progress: >-
      Modelled as a SEPARATE app composition (an environment, not a per-request flag) so audit
      isolation is absolute — the training environment shares no sinks with production.
      createApp({ training: true }) wires: (a) a distinct synthetic-PSU dataset (separate seed,
      same generator → mirrors production shape, different records), (b) a TrainingHighClassAuditSink
      that is NEVER the production audit_high_sensitivity writer and stamps training:true, and
      (c) a sandbox Nebras egress so a practised revoke/dispute never propagates. The BFF marks
      every training response x-ofbo-environment=training; a TRAINING Worker (OFBO_TRAINING=true)
      short-circuits to the in-memory training app before any Pg store is built. Portal delivers
      a persistent TRAINING pill (NEXT_PUBLIC_OFBO_TRAINING=true, token-only violet marker, the
      portal twin of the Worker flag). Remaining: M6 wires a training_audit table behind the sink.
    note: >-
      Lets Customer Care agents rehearse the real workflows (PSU search, consent admin,
      revoke, disputes) against synthetic data with zero production side-effects — for
      onboarding/certification without risk to real PSUs or the production audit trail.
    acceptance:
      - The training environment serves a synthetic-PSU dataset that MIRRORS production's shape
        (same generator) but is a SEPARATE set of records (distinct seed) — a trainee can never
        act on a real operator's PSU.
      - 'Training actions NEVER write to the production audit (audit_high_sensitivity): the
        training High-class audit sink is structurally separate and is never the production
        emitter, even when a production emitter is otherwise configured.'
      - Training mutations (revoke, dispute, refund) never propagate to the real scheme — a
        sandbox egress acknowledges them locally so nothing real moves.
      - Every training response is marked (x-ofbo-environment=training) so the portal can render
        a persistent TRAINING banner, distinguishing it from production at a glance.
      - The OpenAPI contract is unchanged — training is a deployment/composition variant over the
        same Customer Care endpoints, so RBAC, four-eyes, and scope hygiene are identical.
  - { id: BACKOFFICE-63, title: AML GO portal submission for STR drafts, status: done, note: "New canonical port P10 (StrWorkflowPort): sim (records handoff, deterministic workflow_ref, never calls AML GO) + fail-closed enterprise stub; port-contract bound. Spec-first GET /back-office/str-drafts (+/{id}) compliance:reports:read; POST /{id}:submit-to-workflow compliance:reports:generate, four-eyes (202 → risk:read approves → P10 handoff + str_draft_handed_off High-class audit), Idempotency-Key; StrDraft schema; canon 86→89 paths. Durable Pg store: migration 0029_str_draft (RLS day-one + retention 24/60 + classification), PgStrDraftStore with column-level lineage, worker-wired; in-memory default for demo/tests. fraud-revoke (BACKOFFICE-22) persists the draft via an optional recorder (prior behaviour intact when absent). Portal STR-queue on the Compliance screen (token-only, OpenAPI-bound, scope-gated, no PII). PRD §7.2 structural: no AML GO client — the only outbound path is the P10 handoff. Tests: str-drafts.spec 8 + .int.spec 1 (RLS+four-eyes+audit+lineage) + port-contract P10 + str-draft-queue.spec 4 + fraud-revoke recorder. Full unit 1200 green; typecheck+lint clean; gen-drift 0; design-conformance clean. Reviewers: hard-stop PASS, conformance CONFORMANT. Supersedes stale PR #259.", depends_on: [BACKOFFICE-22] }
