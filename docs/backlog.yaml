      - { id: UIF-09b-INVESTIGATION-BULKREVOKE, title: "Care/Investigation: bulk-revoke header + finance Investigation screen (Stitch-gen first)", status: done, reason: "Split from UIF-09; BOTH halves now delivered 2026-06-22. (b) the Stitch finance three-source screen exists (screen 251beaef…), and investigation-detail.tsx was brought up to it — per-source reconciled markers, a data-honest summary strip (present refs reconcile · missing ref → break of {variance}), and an Audit Trail timeline (all derived from getBreak; no fabricated history). escalate stays BACKOFFICE-05 via P6. TDD: investigation-detail.spec +4. (a) emergency PSU-wide bulk-revoke (BACKOFFICE-18, four-eyes): a BulkRevokeModule on the care console PSU view → bulkRevoke lib (POST /consents:revoke-bulk, reason CLIENT_INSTRUCTION) → 202 + approval_request → notice + link to /approvals; a second consents-admin approver completes it, never inline. PSU identifier travels server-side via hidden inputs (no PII re-typed in the browser); shown only when ≥1 revocable consent. TDD: bulk-revoke-form.spec + care-console gating test. Both from existing contracts (no spec change). NOTE residual (not part of this item): per-row 'Investigate' on consents is still undefined against the current contract — raise a spec/story if needed." }
