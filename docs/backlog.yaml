  # Commercial track — ADR 0026 (ACCEPTED 2026-07-04): scheme-distributed console tier (Nebras
  # VAS, CAAP model) + independent direct-paid assurance tier, hosted SaaS for Tier 2 banks +
  # insurers in parallel, Tier 1 M6 deploy as the later upmarket motion. Build order: VAL first
  # (strengthens all three motions), then HOST hardening/provisioning, then the insurance module.
  - name: COMMERCIAL
    items:
      - id: VAL-01
        title: Liability-avoided KPI + ROI walkthrough screen
        status: pending
        status_note: >-
          Not started: no liability-schedule constant set and no exposure-avoided figure exists in
          services/bff/src or apps/portal/src (verified by search, 2026-08-06). Compute-and-display
          over existing stores when picked up.
        adr: docs/adrs/0026-commercial-positioning-nebras-vas-split.md
        note: >-
          Translate operating events into AED using the published scheme liability schedule
          (consent-state failure 500, revocation failure 350, data breach 750, SLA failure
          200-350, breaking-change mismanagement 5000): revocations acknowledged <5s, breaks
          resolved inside SLA, compliant scheme notifications each accrue "exposure avoided".
          Surface as an executive-dashboard headline KPI and as a closing ROI screen in the
          demo walkthrough. Compute-and-display over existing stores — no new substrate.
        acceptance:
          - The liability schedule is a named, tested constant set (AED minor units), cited to
            the scheme document — never magic numbers in the view layer.
          - Executive dashboard headline shows a period-scoped "liability exposure avoided"
            AED figure with a per-category breakdown; analytics scope-gating unchanged.
          - The demo walkthrough ends with an ROI screen totalling liability avoided + fee
            variance recovered from the seeded scenario; token-only, OpenAPI-bound, no PII.
          - Deterministic against the seeded demo dataset (stable figure for a given seed).
      - id: HOST-02
        title: Re-scope bank_internal_view for multi-tenant hosting
        status: done
        status_note: >-
          Delivered: migration 0030_tenant_group.sql adds tenant_group_member and re-scopes every
          internal_view_select policy to a pinned app.tenant_group, with the documented unpinned
          fallback for single-tenant backward compatibility. packages/db/src/tenant-tx.ts adds
          beginInternalViewTx(tenantGroupId). All four acceptance criteria are covered by
          packages/db/test/tenant-isolation.int.spec.ts ("HOST-02 - cross-tenant isolation of the
          bank_internal_view bypass"): group-pinned reads see only their own group, unpinned falls
          back to legacy read-all, ordinary ofbo_app RLS is unaffected, and a tenant sees only its
          own membership row. Status recorded retrospectively by DOCS-01 - the item shipped with
          no status field at all.
        adr: docs/adrs/0026-commercial-positioning-nebras-vas-split.md
        note: >-
          bank_internal_view is a cross-bank SELECT designed for ONE bank's internal
          aggregation; in a hosted multi-tenant deployment it is a cross-CUSTOMER read path.
          Must be group-scoped (or operator-only with explicit governance) BEFORE any second
          tenant exists. Pre-requisite hardening for HOST-01.
        acceptance:
          - bank_internal_view SELECT is constrained to an explicit tenant-group membership
            (new mapping table, RLS-guarded) — a role member sees only its group's banks.
          - An integration test proves a member of group A cannot read group B rows via the
            internal-view role on at least reconciliation, disputes, and audit tables.
          - Existing single-tenant behaviour is preserved (the demo bank remains a
            single-member group; all current tests stay green).
          - Migration is additive; INSERT-only audit and retention posture untouched.
      - id: HOST-01
        title: Tenant provisioning + per-tenant PRD §10 configuration
        status: in-progress
        status_note: >-
          Scaffold only. packages/db/src/seed-tenants.ts enrols every demo tenant in its own
          single-member group and seeds a compact dataset for two extra tenants (Beta Bank, Gamma
          Takaful); worker.ts carries MULTITENANT_DEMO and apps/portal/src/lib/tenant.ts the switcher.
          Its own header states it "deliberately does NOT re-parameterise the rich single-tenant seed
          (that is HOST-01 proper)". The PRD §10 per-tenant configuration criterion is NOT met: the
          defaults remain code constants (e.g. approvals/service.ts expiryBusinessHours ?? 2), as the
          tier-2 BaaS readiness review §4.1 #3 also found. Remaining: parameterised seed + per-tenant
          §10 config rows read wherever those defaults are enforced.
        adr: docs/adrs/0026-commercial-positioning-nebras-vas-split.md
        depends_on: [HOST-02]
        note: >-
          Second tenant end-to-end — the moment the hosted-SaaS claim is real. Provision a new
          bank_id (RLS tenancy exists day-one), seed per-tenant synthetic data (distinct seed),
          and make the PRD §10 adopting-bank defaults (approval expiry, SLA weekend pause,
          four-eyes-on-fraud-revoke, care-surface residency) per-tenant configuration with the
          current values as defaults. No application-core profile branching (CLAUDE.md).
        acceptance:
          - A provisioning path (script or admin endpoint per spec decision) creates a second
            tenant with its own bank_id, seeded dataset, and §10 config row; idempotent.
          - Two tenants run against one BFF deployment; an integration test proves full RLS
            isolation of the second tenant from the first across every RLS-guarded table.
          - PRD §10 defaults are read from per-tenant config everywhere they are enforced
            (approvals expiry, SLA clocks, fraud-revoke gating) with unchanged defaults.
          - Demo profile remains single-tenant by default; the DEMO banner and zero-PII
            posture hold for every tenant.
      - id: HOST-03
        title: "ADR: per-tenant P6 scheme-certificate custody for hosted deployments"
        status: blocked
        status_note: >-
          ADR-authoring item (per-tenant P6 scheme-certificate custody) - per CLAUDE.md rule 6 an ADR
          is a human decision, so this cannot be picked up by the build loop. Unblock by a human
          accepting the tenancy direction (ADR 0028 is itself still Proposed).
        adr: docs/adrs/0026-commercial-positioning-nebras-vas-split.md
        note: >-
          Each LFI holds its own FAPI 2.0 scheme certificate chain; a hosted egress gateway
          means custodying tenant certs (HSM/KMS, rotation, revocation, audit). This is an
          ADR-authoring story: research + a Proposed ADR with options (per-tenant KMS keys,
          BYO-egress hybrid, operator HSM) and a recommendation. HUMAN-GATED - the story ends
          at Proposed; no implementation until the ADR is accepted.
        acceptance:
          - A Proposed ADR covering custody options, rotation/revocation lifecycle, residency,
            liability allocation, and the audit trail for certificate use; no code changes.
      - id: HOST-04
        title: "Fail-closed internal_view_select when app.tenant_group is unpinned"
        status: pending
        depends_on: [HOST-02]
        note: >-
          ADR 0028 Consequences records this verbatim as a "marked follow-up" and HOST-02 (its
          prerequisite) is done, but nothing owned it until now - surfaced by BILL-13's hard-stop
          review, which read the pattern as fail-open. It is. Every internal_view_select policy
          reads
          `NULLIF(current_setting('app.tenant_group', true), '') IS NULL OR bank_id IN (...)`,
          so a session holding bank_internal_view with no tenant_group pinned reads EVERY tenant's
          rows. That is deliberate single-tenant backward compatibility (ADR 0028), not an
          oversight, and it is reachable only via runGovernedAggregate behind a registered and
          approved query purpose with a High-class-logged bypass - so it is a hardening item, not
          a live breach. MEASURED surface, since it has grown and future stories keep widening it -
          the idiom now appears in NINE migrations: 0030 (defines it) and 0031, 0032, 0033, 0034,
          0035, 0036, 0037, 0039. BILL-13 (0039) added SIX tables, not eight - its loop excludes
          billing_tpp_cost_document and billing_tpp_cost_ap_dispatch, which is why the two
          provider-fed payload tables that could carry PSU detail are already outside the
          cross-tenant read. Fixing this must be ONE pass over the shared idiom, not per-migration
          patches, or the policies drift apart; and it needs a decision on what unpinned should
          mean (deny all rows, or resolve a default single-tenant group explicitly) since the demo
          profile relies on the current behaviour.
        acceptance:
          - Unpinned app.tenant_group denies rows rather than returning all tenants, across every
            table carrying internal_view_select, applied as one change to the shared idiom.
          - The demo single-tenant profile still works, by an explicit group rather than by the
            absent-setting fallback; seed and all existing tests stay green.
          - An integration test proves the fail-closed behaviour directly - role held,
            app.tenant_group unset, zero rows returned - on at least one table per migration
            family, and proves it FAILS if the fallback clause is restored.
          - runGovernedAggregate's registered-purpose path is unaffected and still audited.
      - id: INS-01
        title: Insurance module — line types, quote-fee reconciliation, insurance consent purposes
        status: blocked
        status_note: >-
          Insurance line types / policy shapes are spec-first and human-gated (ADR 0028 + the
          seed-tenants.ts header both say so explicitly). Needs a specs/backoffice-openapi.yaml
          change decided by a human before any implementation.
        adr: docs/adrs/0026-commercial-positioning-nebras-vas-split.md
        note: >-
          Extends the reconciliation + consent substrate to insurers (mandated participants):
          insurance data-sharing line types in the LineType enum + fee schedule (quotes are
          tiered 5-12.5 fils — representable in the existing milli-fil engine), insurance
          consent purposes, and synthetic insurance data in the Nebras sim (policy/quote
          shapes per the Insurance Data Sharing standard). Spec-first: LineType enum + consent
          purpose additions are contract changes (human-approved spec PR before code).
        acceptance:
          - New insurance line types flow through engine, thresholds, fee schedule, breaks,
            and the CBUAE export exactly as bank lines do (tests-first per line type).
          - Quote-fee reconciliation catches an injected tiered-fee variance via the sim's
            fault-injection surface.
          - Insurance consent purposes appear in consent search/detail with scope hygiene
            unchanged; synthetic insurance dataset is deterministic and PII-safe (999/000
            invariants).
      - id: INS-02
        title: Policy-centric care console variant (insurer/broker personas)
        status: blocked
        status_note: >-
          Depends on INS-01 (same spec-first, human-gated insurance data model).
        adr: docs/adrs/0026-commercial-positioning-nebras-vas-split.md
        depends_on: [INS-01]
        note: >-
          The care surface reframed for insurers: policies/claims/quotes instead of
          accounts/payments, plus insurer-operations and broker personas whose scopes follow
          the existing persona-matrix discipline (strict subsets, review-FAIL on excess).
          Stitch remains the appearance reference; generate the screen there first if absent.
        acceptance:
          - A policy-centric care view (search by policy ref, consent + quote history,
            revoke path) gated by new insurer personas; four-eyes and audit semantics
            identical to the bank care surface.
          - Persona scope matrix extended without widening any existing persona; scope-gating
            asserted in tests; WCAG 2.1 AA on the new screens.
          - Token-only, OpenAPI-bound, DEMO-bannered, zero PII.

  # Billing & monetization — LFI-side scheme billing as a product (the E6 extension).
  # Derived from docs/research/lfi-billing-system-tier2.md (research baseline 4 Aug 2026;
  # realizes its proposed BACKOFFICE-81..90 as BILL-01..10 pending a PRD uplift — new
  # BACKOFFICE ids are reserved for PRD §7). Key inputs: Nebras Interaction Guide v5.0 §10
  # (monthly cycle 3rd/5th/10th/30th/30th-5th; §10.16 LFI net settlement — resolves BD-15:
  # both collection models co-exist; direct input to ADR 0007 and execution-plan item C5)
  # and UAE e-invoicing Phase 1 (ASP appointed by 30 Oct 2026, PINT AE from 1 Jan 2027),
  # which makes BILL-04 calendar-bound. New adopting-bank decisions BD-17..19 (ASP
  # selection, collection rails, VAT posture) are defined in the research doc §10; the
  # Starter/Growth/Scale packaging in §9 feeds execution-plan item C4 (pricing one-pager).
  - name: BILLING
    items:
      - id: BILL-01
        title: Scheme rate-card-as-code with upstream change watch
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        note: >-
          The complete Commercial & Pricing Model v1.0 rate card as versioned,
          effective-dated configuration (fee class x segment x schedule x conditions):
          bps-with-cap (AED 50), the AED 200/day merchant exemption conditional on
          Merchant ID (page edit 2 Jun 2026), batch caps, year-stepped schedules with a
          configurable anchor (the scheme has never defined "Year 1" publicly), per-LFI
          directory-published retail overage. A scheduled watcher diffs the upstream
          C&P Confluence page and the Nebras pricing pages — the page mutated four times
          Nov 2025 - Jun 2026 without a version bump — and raises a review task on change.
        acceptance:
          - A named, tested rate-card constant set replaces in-code fee references; the
            BACKOFFICE-01 reconciliation schedule reads from it (no behaviour change).
          - Rate-card changes are effective-dated, diff-audited High-class, and notify
            Finance + Compliance; the year-step anchor is per-tenant configuration.
          - The watcher demonstrably raises a review task on an injected upstream change.
      - id: BILL-02
        title: Independent billable-event metering feed (CloudEvents, exactly-once)
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        adr: docs/adrs/0024-pre-stage-enterprise-adapters-kong-metering-boundary.md
        note: >-
          Gateway/Ozone Connect logs derived into idempotent CloudEvents billable events
          on the platform metering boundary: chargeability per the 50-chargeable/26-free
          endpoint classification, technically-successful-only, page aggregation (100
          lines), attended/unattended, per-customer/day free-tier counters, the
          payment-balance/CoP 2-hour discount pairing (one of each per payment),
          Merchant-ID presence, quote-tier fan-out. Every metered line carries
          x-fapi-interaction-id so an invoice line traces to a FAPI transaction.
        acceptance:
          - Re-metering from replayed logs is deterministic (same events in, same meters
            out); ingestion is exactly-once under duplicate delivery.
          - Simulator-injected traffic produces the expected meter set including pairing
            and free-tier edge cases (tests-first per meter).
          - Metering coverage (percent of gateway traffic classified) is exposed as a
            metric for BILL-08.
      - id: BILL-03
        title: Receivables rating engine - the expected Collection Memo
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        depends_on: [BILL-01, BILL-02]
        note: >-
          Rates own metering per consuming TPP per fee class under BILL-01 and produces a
          draft rated statement by the 3rd of each month; the emailed Nebras Collection
          Memo (by the 5th) is auto-diffed against it on ingest, converting billing from
          verify-what-arrived to compare-against-expected. Re-rating replays facts under
          a corrected rate-card version - it never mutates metered events.
        acceptance:
          - Expected-memo statement generated per TPP by the 3rd against the simulator
            month; memo ingest produces a line-level diff with variances above threshold
            flowing into the standard E1 break workflow inside the 30-day query window.
          - A rate-card correction re-rates a closed period by replay, producing a
            documented delta - metered facts provably unchanged.
      - id: BILL-04
        title: PINT AE e-invoicing via Accredited Service Provider (statutory clock)
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        depends_on: [BILL-03]
        note: >-
          Invoice runs emit PINT AE Billing invoices (380) and credit notes (381) through
          the institution's ASP under the UAE 5-corner DCTCE model; TIN/endpoint-0235
          buyer identification; VAT extracted 5/105 from VAT-inclusive scheme amounts;
          AED tax totals; foreign-TPP invoices flagged zero-rated export; Tax Data
          Document reporting confirmed; human-readable PDF alongside. Calendar-bound:
          ASP appointed by 30 Oct 2026 (BD-17), mandatory from 1 Jan 2027 (revenue >=
          AED 50m); voluntary-window pilot mode before that. ASP port is a new adapter
          seam (simulator first, per the ports discipline).
        acceptance:
          - An invoice run yields schema-valid PINT AE 380/381 documents (validated
            against the v1.0.3 artifacts) plus rendered PDFs; disputed lines withheld.
          - VAT derivation (5/105), AED totals, and zero-rated export flagging are
            tested per counterparty class; BD-19 VAT posture is a named config input.
          - TDD reporting acknowledgment is captured as evidence; pilot mode runs the
            full flow against the ASP simulator with the mandate flag off.
      - id: BILL-05
        title: Collections, dunning and net-settlement decomposition
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        adr: docs/adrs/0007-tpp-of-record-payables-net-settlement.md
        depends_on: [BILL-04]
        note: >-
          Two collection channels, decomposed rather than conflated. Scheme channel:
          net-settlement remittances (30th-5th via the Nebras sponsoring bank) matched
          invoice-by-invoice with cross-role netting (LFI receivables vs TPP-of-record
          payables) explained line-by-line - unexplained residue becomes a break; the
          IG v5.0 s10.16 model is the direct input to the ADR 0007 decision. Direct
          channel: invoice-attached payment requests - OF Large Value/Invoice Collection
          (AED 4 capped, invoices > AED 5,000), Aani request-to-pay below AED 50k,
          UAEDDS mandate fallback - with a dunning ladder mirroring the scheme's own
          late-payment regime and DSO tracked per TPP.
        acceptance:
          - A simulated settlement file decomposes to invoice level including a netted
            dual-role period; an injected residue raises a break with both role ledgers
            referenced.
          - Dunning states progress on simulated non-payment and surface in the Finance
            View; every collection action is High-class audited.
      - id: BILL-06
        title: Commissions and clawback sub-ledger (insurance now, FX at V2.2)
        status: blocked
        reason: >-
          No approved insurance commercial model exists and INS-01 is not implemented.
          The billing console reports this dependency explicitly; no commission,
          clawback, or insurance ledger semantics are inferred from the prototype.
        research: docs/research/lfi-billing-system-tier2.md
        depends_on: [INS-01]
        note: >-
          The payables mirror of TPP billing: insurance commissions accrued at policy
          sale, held through the 30-day cool-off, released or clawed back (5 years life /
          2 years others) as negative accruals; bilateral-rate registry overriding scheme
          defaults, reconciled against production-onboarding submissions; quote-tolerance
          gating (premium within 17.5 percent, FX within 50 pips); FX/remittance
          commissions (0.07/0.1 percent, min 50 fils) behind a V2.2 feature flag.
          TPP-issued commission invoices are matched against the sub-ledger before
          approval. Extends INS-01 line types to the money side for the 28 Tier 2
          insurers arriving Mar 2027.
        acceptance:
          - Commission lifecycle (accrue, hold, release, clawback) is tested per line
            type with cool-off and clawback windows enforced by the calendar, not by
            operator memory.
          - A TPP commission invoice that disagrees with the sub-ledger is blocked from
            approval with a line-level diff; bilateral rates provably override defaults.
      - id: BILL-07
        title: GL and VAT posting via the P9 financial-system port
        status: done
        research: docs/research/lfi-billing-system-tier2.md
        depends_on: [BILL-04]
        note: >-
          Journal instructions per fee class (payment fees, data fees, overage,
